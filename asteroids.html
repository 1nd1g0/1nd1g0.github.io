<!DOCTYPE html>
<html><head><title>Asteroids</title><style>
*{margin:0;padding:0}body{background:#000;overflow:hidden}canvas{display:block}
</style></head><body><canvas id=c></canvas><script>
const X=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight;
let ship,rocks,bullets,score,lives,gameOver,keys={};
document.addEventListener('keydown',e=>{keys[e.code]=1;if(gameOver&&e.code==='Space')init()});
document.addEventListener('keyup',e=>keys[e.code]=0);
function init(){
  ship={x:W/2,y:H/2,a:0,vx:0,vy:0,r:15,co:0};
  rocks=[];bullets=[];score=0;lives=3;gameOver=0;
  for(let i=0;i<4;i++)spawn();
}
function spawn(x,y,s){
  let a=Math.random()*6.28,d=200+Math.random()*200;
  let px,py;
  if(x!==undefined){
    px=x;py=y;
  } else {
    px=Math.random()*W;py=Math.random()*H;
    if(ship){let dx=px-ship.x,dy=py-ship.y;while(dx*dx+dy*dy<90000){px=Math.random()*W;py=Math.random()*H;dx=px-ship.x;dy=py-ship.y}}
  }
  rocks.push({x:px,y:py,
    vx:Math.cos(a)*d/800,vy:Math.sin(a)*d/800,
    r:s?15*s:40+Math.random()*20,s:s||3,
    a:Math.random()*6.28,rv:(Math.random()-.5)*.03});
}
function update(){
  if(gameOver)return;
  if(ship.co>0)ship.co--;
  if(keys.ArrowLeft)ship.a-=.06;
  if(keys.ArrowRight)ship.a+=.06;
  if(keys.ArrowUp){ship.vx+=Math.cos(ship.a)*.15;ship.vy+=Math.sin(ship.a)*.15}
  if(keys.Space&&ship.co<=0){
    bullets.push({x:ship.x+Math.cos(ship.a)*ship.r,y:ship.y+Math.sin(ship.a)*ship.r,
      vx:Math.cos(ship.a)*8+ship.vx*.5,vy:Math.sin(ship.a)*8+ship.vy*.5,l:60});
    ship.co=8;
  }
  ship.vx*=.99;ship.vy*=.99;
  ship.x+=ship.vx;ship.y+=ship.vy;
  if(ship.x<0)ship.x=W;if(ship.x>W)ship.x=0;
  if(ship.y<0)ship.y=H;if(ship.y>H)ship.y=0;
  for(let b of bullets){b.x+=b.vx;b.y+=b.vy;b.l--;
    if(b.x<0)b.x=W;if(b.x>W)b.x=0;if(b.y<0)b.y=H;if(b.y>H)b.y=0}
  bullets=bullets.filter(b=>b.l>0);
  for(let r of rocks){r.x+=r.vx;r.y+=r.vy;r.a+=r.rv;
    if(r.x<-50)r.x=W+50;if(r.x>W+50)r.x=-50;
    if(r.y<-50)r.y=H+50;if(r.y>H+50)r.y=-50}
  for(let i=bullets.length-1;i>=0;i--){
    for(let j=rocks.length-1;j>=0;j--){
      let dx=bullets[i].x-rocks[j].x,dy=bullets[i].y-rocks[j].y;
      if(dx*dx+dy*dy<rocks[j].r**2){
        let r=rocks[j];
        if(r.s>1){spawn(r.x,r.y,r.s-1);spawn(r.x,r.y,r.s-1)}
        score+=10*(4-r.s);rocks.splice(j,1);bullets.splice(i,1);break;
      }
    }
  }
  for(let r of rocks){
    let dx=ship.x-r.x,dy=ship.y-r.y;
    if(dx*dx+dy*dy<(ship.r+r.r)**2){
      lives--;if(lives<=0){gameOver=1}else{ship.x=W/2;ship.y=H/2;ship.vx=0;ship.vy=0}
      break;
    }
  }
  if(rocks.length<5+Math.floor(score/500))spawn(0,0,3);
}
function draw(){
  X.fillStyle='#000';X.fillRect(0,0,W,H);
  X.strokeStyle='#fff';X.lineWidth=2;X.lineJoin='round';
  if(!gameOver){
    X.save();X.translate(ship.x,ship.y);X.rotate(ship.a);
    X.beginPath();X.moveTo(ship.r,0);X.lineTo(-ship.r,-ship.r*.6);
    X.lineTo(-ship.r*.4,0);X.lineTo(-ship.r,ship.r*.6);X.closePath();X.stroke();
    if(keys.ArrowUp){
      X.strokeStyle='#f80';X.beginPath();
      X.moveTo(-ship.r*.4,-ship.r*.2);X.lineTo(-ship.r*1.2,0);
      X.lineTo(-ship.r*.4,ship.r*.2);X.stroke();X.strokeStyle='#fff';
    }
    X.restore();
  }
  for(let r of rocks){
    X.beginPath();
    for(let i=0;i<8;i++){let a=i/8*6.28+Math.PI/8;
      let rr=r.r*(.7+Math.sin(i*3.7)*.3);
      i?X.lineTo(r.x+Math.cos(a)*rr,r.y+Math.sin(a)*rr):X.moveTo(r.x+Math.cos(a)*rr,r.y+Math.sin(a)*rr)}
    X.closePath();X.stroke();
  }
  for(let b of bullets){X.fillStyle='#ff0';X.fillRect(b.x-1,b.y-1,3,3)}
  X.fillStyle='#fff';X.font='16px monospace';X.fillText('Score: '+score,10,25);
  for(let i=0;i<lives;i++){X.save();X.translate(20+i*20,H-20);X.rotate(-Math.PI/2);
    X.beginPath();X.moveTo(10,0);X.lineTo(-10,-7);X.lineTo(-6,0);X.lineTo(-10,7);X.closePath();X.stroke();X.restore()}
  if(gameOver){X.fillStyle='#fff';X.font='40px monospace';X.textAlign='center';
    X.fillText('GAME OVER',W/2,H/2);X.font='20px monospace';
    X.fillText('Score: '+score,W/2,H/2+40);X.fillText('Press SPACE to restart',W/2,H/2+80);X.textAlign='left'}
}
init();(function loop(){update();draw();requestAnimationFrame(loop)})();
</script></body></html>
