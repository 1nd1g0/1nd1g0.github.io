<div id="stage">
  <div id="topbar">
    <div class="tb">
      <button id="ffBtn">⏩</button>

    <div class="tb">
      <button id="homeBtn">🏠</button>
      <div class="tbstat"><span class="lbl" id="lblLevelHud">LEVEL</span>
        <span class="row"><span id="level">1</span><span id="chain">×2</span></span></div>
    </div>
    <div class="tb">
      <div class="tbstat"><span class="lbl" id="lblLives">LIVES</span><span id="lives">●●●</span></div>
      <button class="tbtn" id="pauseBtn">❚❚</button>
      <button class="tbtn" id="muteBtn">🔊</button>
    </div>
  </div>
  <div id="cvwrap">
    <canvas id="cv"></canvas>
    <div id="scan"></div><div id="vig"></div>
    <div id="fx"></div>
    <div id="seedTag"></div>
    <div id="banner"></div>

    <div id="titleOv" class="ov on"><div class="panel">
      <div class="logo" id="logoTitle">SQUISH<em>OID</em></div>
      <div class="tag" id="tagLine">SOFT-BODY ARKANOID · SEED ENGINE</div>
      <div class="frow"><label id="lblSeed">SEED</label><input type="text" id="seedIn" maxlength="24" spellcheck="false">
        <button class="dice" id="diceBtn">🎲</button></div>
      <div id="hashTag"></div>
      <div class="frow"><label id="lblLevel">LEVEL</label>
        <div class="step"><button id="lvlDn">−</button><b id="lvlVal">1</b><button id="lvlUp">+</button></div></div>
      <button class="btn" id="startBtn">▶&nbsp; START RUN</button>
      <button class="btn alt" id="helpBtn">❔&nbsp; HELP</button>
      <div class="help"><span id="helpLine1"></span><br><span id="helpLine2"></span></div>
      <div class="flavor" id="flavor"></div>
      <div id="best">BEST 0</div>
    </div></div>

    <div id="helpOv" class="ov"><div class="panel wide">
      <div class="logo" style="font-size:26px" id="logoHelp">FIELD <em>MANUAL</em></div>
      <div class="helpScroll" id="helpScroll"></div>
      <button class="btn alt" id="helpClose">CLOSE</button>
    </div></div>

    <div id="overOv" class="ov"><div class="panel">
      <div class="logo" style="font-size:34px" id="logoOver">GAME <em>OVER</em></div>
      <div id="overStats"></div>
      <button class="btn" id="retryBtn">↻&nbsp; RETRY</button>
      <button class="btn alt" id="titleBtn">TITLE</button>
    </div></div>

    <div id="pauseOv" class="ov"><div class="panel">
      <div class="logo" style="font-size:30px" id="logoPause">PAUSED</div>
      <div class="tag" id="pauseHint">TAP ANYWHERE OR PRESS ESC / P</div>
      <button class="btn" id="resumeBtn">▶&nbsp; RESUME</button>
      <button class="btn alt" id="pauseTitleBtn">🏠&nbsp; BACK TO TITLE</button>
    </div></div>
  </div>
</div>
