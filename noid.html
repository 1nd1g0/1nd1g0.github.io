function xmur3(str){
  var h=1779033703^str.length,i;
  for(i=0;i<str.length;i++){
    h=Math.imul(h^str.charCodeAt(i),3432918353);
    h=h<<13|h>>>19;
  }
  return function(){
    h=Math.imul(h^h>>>16,2246822507);
    h=Math.imul(h^h>>>13,3266489909);
    return (h^=h>>>16)>>>0;
  };
}
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };

function makeBall(x,y,stuck){

function integrate(dt){
  var dt2=dt*dt,gs=GRAV*G.gravScale;
  for(var i=0;i<pTop;i++){
    if(!ACT[i]||IM[i]===0)continue;
    var x=PX[i],y=PY[i];
    var vx=(x-OX[i])*AIR,vy=(y-OY[i])*AIR;
    var v2=vx*vx+vy*vy;
    if(v2>210){var f=14.5/Math.sqrt(v2);vx*=f;vy*=f;}
    var g=GF[i]*gs;
    if(G.ballGrav>0&&bodies[BID[i]].kind===K_BALL)g+=G.ballGrav*gs;
    OX[i]=x;OY[i]=y;PX[i]=x+vx;PY[i]=y+vy+g*dt2;
  }
}
function solveC(){
  for(var k=0;k<cTop;k++){
    if(!ACTC[k])continue;
    var a=CA[k],b=CB[k];
    var dx=PX[b]-PX[a],dy=PY[b]-PY[a];
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<1e-6)d=1e-6;
    var diff=(d-CR[k])/d*CK[k];
    var wi=IM[a],wj=IM[b],ws=wi+wj;
    if(!ws)continue;
    var ki=wi/ws,kj=wj/ws;
    PX[a]+=dx*diff*ki;PY[a]+=dy*diff*ki;
    PX[b]-=dx*diff*kj;PY[b]-=dy*diff*kj;
  }
}
function solvePP(i,j){
  var bi=bodies[BID[i]],bj=bodies[BID[j]];
  if((bi.kind===K_BALL&&bj.kind===K_PAD)||(bi.kind===K_PAD&&bj.kind===K_BALL))return;
  if(G.fx.fireball>0){
    if((bi.kind===K_BALL&&(bj.kind===K_BRICK||bj.kind===K_PRIZE))||
       (bj.kind===K_BALL&&(bi.kind===K_BRICK||bi.kind===K_PRIZE)))return;
  }
  var dx=PX[j]-PX[i],dy=PY[j]-PY[i],rr=PR[i]+PR[j],d2=dx*dx+dy*dy;
  if(d2>=rr*rr||d2<1e-8)return;
  var wi=IM[i],wj=IM[j],ws=wi+wj;
  if(!ws)return;
  var d=Math.sqrt(d2),f=(rr-d)*0.85,ki=wi/ws,kj=1-ki;
  var cx2=dx/d*f,cy2=dy/d*f;
  PX[i]-=cx2*ki;PY[i]-=cy2*ki;PX[j]+=cx2*kj;PY[j]+=cy2*kj;
  if(bi.kind===K_PAD||bj.kind===K_PAD){
    var isPadI=bi.kind===K_PAD;
    var od=isPadI?bj:bi,oi=isPadI?j:i,pi2=isPadI?i:j;
    if(od.kind===K_BRICK||od.kind===K_PRIZE){
      var pvx=PX[pi2]-OX[pi2],pvy=PY[pi2]-OY[pi2];
      var cvx=PX[oi]-OX[oi],cvy=PY[oi]-OY[oi];
      OX[oi]=PX[oi]-(cvx+(pvx-cvx)*CFG.paddle.carry);
      OY[oi]=PY[oi]-(cvy+(pvy-cvy)*CFG.paddle.carryV);
    }
  }
}
function collidePP(){
  for(var cy=0;cy<GH;cy++){
    for(var cx=0;cx<GW;cx++){
      var h=HEAD[cy*GW+cx];
      if(h===-1)continue;
      var a,b2;
      for(a=h;a!==-1;a=NXT[a]){
        for(b2=NXT[a];b2!==-1;b2=NXT[b2])solvePP(a,b2);
      }
      var nb;
      if(cx+1<GW){
        nb=cy*GW+cx+1;
        for(a=h;a!==-1;a=NXT[a]){
          for(b2=HEAD[nb];b2!==-1;b2=NXT[b2])solvePP(a,b2);
        }
      }
      if(cy+1<GH){
        nb=(cy+1)*GW+cx;
        for(a=h;a!==-1;a=NXT[a]){
          for(b2=HEAD[nb];b2!==-1;b2=NXT[b2])solvePP(a,b2);
        }
        if(cx>0){
          nb=(cy+1)*GW+cx-1;
          for(a=h;a!==-1;a=NXT[a]){
            for(b2=HEAD[nb];b2!==-1;b2=NXT[b2])solvePP(a,b2);
          }
        }
        if(cx+1<GW){
          nb=(cy+1)*GW+cx+1;
          for(a=h;a!==-1;a=NXT[a]){
            for(b2=HEAD[nb];b2!==-1;b2=NXT[b2])solvePP(a,b2);
          }
        }
      }
    }
  }
}
function walls(){
  for(var i=0;i<pTop;i++){
    if(!ACT[i])continue;
    if(IM[i]===0)continue;
    var b=bodies[BID[i]];
    if(b.stuck||b.kind===K_BALL)continue;
    var r=PR[i],x=PX[i];
    if(x<r+3){var vx=x-OX[i];PX[i]=r+3;OX[i]=PX[i]+vx*0.5;}
    else if(x>W-r-3){var vx2=x-OX[i];PX[i]=W-r-3;OX[i]=PX[i]+vx2*0.5;}
    if(PY[i]<r+3){var vy=PY[i]-OY[i];PY[i]=r+3;OY[i]=PY[i]+vy*0.5;}
  }
}
function anchors(){
  for(var bi=0;bi<bodies.length;bi++){
    var b=bodies[bi];
    if(!b||!b.alive||b.kind!==K_BRICK||!b.attached)continue;
    for(var k=0;k<6;k++){
      var i=b.p[k];
      var dx=b.ax[k]-PX[i],dy=b.ay[k]-PY[i];
      PX[i]+=dx*0.32;PY[i]+=dy*0.32;
      OX[i]+=(PX[i]-OX[i])*0.22;OY[i]+=(PY[i]-OY[i])*0.22;
    }
  }
}
function collideBrickAt(i){
  var x=PX[i],y=PY[i];
  if(y>G.zoneY)return;
  var r=PR[i]+1;
  var c0=((x-r-MARG)/CW())|0,c1=((x+r-MARG)/CW())|0;
  var r0=((y-r-TOPY)/RH)|0,r1=((y+r-TOPY)/RH)|0;
  var cc,rr2;
  if(c0<0)c0=0;if(c1>=COLS)c1=COLS-1;
  if(r0<0)r0=0;if(r1>=G.rows-1)r1=G.rows-1;
  for(rr2=r0;rr2<=r1;rr2++){
    for(cc=c0;cc<=c1;cc++){
      var gi=grid[rr2*COLS+cc];
      if(gi<0)continue;
      var B=bodies[gi];
      if(!B.alive||!B.attached)continue;
      var nx=x<B.x0?B.x0:(x>B.x1?B.x1:x);
      var ny=y<B.y0?B.y0:(y>B.y1?B.y1:y);
      var dx=x-nx,dy=y-ny,d2=dx*dx+dy*dy;
      if(d2>r*r)continue;
      var d=Math.sqrt(d2),ux,uy;
      if(d<0.001){
        var l=x-B.x0,rt=B.x1-x,tp=y-B.y0,bt=B.y1-y,m=Math.min(l,rt,tp,bt);
        if(m===l){ux=-1;uy=0;d=-l;}
        else if(m===rt){ux=1;uy=0;d=-rt;}
        else if(m===tp){ux=0;uy=-1;d=-tp;}
        else{ux=0;uy=1;d=-bt;}

        ux=dx/d;uy=dy/d;

      var vx=PX[i]-OX[i],vy=PY[i]-OY[i],vn=vx*ux+vy*uy,push=r-d;
      PX[i]+=ux*push;PY[i]+=uy*push;
      if(vn<0){OX[i]=PX[i]-(vx-1.45*vn*ux);OY[i]=PY[i]-(vy-1.45*vn*uy);}
      if(-vn>CFG.physics.debrisDetach){
        var OB=bodies[BID[i]];
        damageBrick(B,ux,uy,Math.min(5,2-vn),nx,ny,false);
        if(OB.kind===K_BULLET){OB.dead=true;burst(nx,ny,4,190);}
      }
    }
  }
}
function collideBricks(){
  for(var i=0;i<pTop;i++){
    if(!ACT[i])continue;
    var b=bodies[BID[i]];
    if(b.stuck||b.kind===K_BALL||(b.kind===K_BRICK&&b.attached))continue;
    collideBrickAt(i);

}
function damageBrick(B,ux,uy,pow,hx,hy,soft){
  if(!B.attached)return;
  B.hp--;
  if(B.hp>0){
    if(!soft){
      for(var k=0;k<B.p.length;k++){OX[B.p[k]]-=ux*pow*0.55;OY[B.p[k]]-=uy*pow*0.55;}
    }

function ballBricks(){
  for(var k=0;k<balls.length;k++){
    var b=balls[k];
    if(!b.alive||b.stuck)continue;
    var c=b.p[0];
    for(var pass=0;pass<2;pass++){
      var x=PX[c],y=PY[c];
      if(y>G.zoneY)break;
      var bestPen=0,bB=null,bnx=0,bny=0,bhx=0,bhy=0;
      var c0=((x-BALL_R-MARG)/CW())|0,c1=((x+BALL_R-MARG)/CW())|0;
      var r0=((y-BALL_R-TOPY)/RH)|0,r1=((y+BALL_R-TOPY)/RH)|0;
      if(c0<0)c0=0;if(c1>=COLS)c1=COLS-1;
      if(r0<0)r0=0;if(r1>=G.rows-1)r1=G.rows-1;
      for(var rr=r0;rr<=r1;rr++){
        for(var cc=c0;cc<=c1;cc++){
          var gi=grid[rr*COLS+cc];
          if(gi<0)continue;
          var B=bodies[gi];
          if(!B.alive||!B.attached)continue;
          var nx=x<B.x0?B.x0:(x>B.x1?B.x1:x);
          var ny=y<B.y0?B.y0:(y>B.y1?B.y1:y);
          var dx=x-nx,dy=y-ny,d2=dx*dx+dy*dy;
          if(d2>=BALL_R*BALL_R)continue;
          var ux,uy,pen;
          if(d2<1e-8){
            var l=x-B.x0,rt=B.x1-x,tp=y-B.y0,bt=B.y1-y,m=Math.min(l,rt,tp,bt);
            if(m===l){ux=-1;uy=0;pen=BALL_R+l;}
            else if(m===rt){ux=1;uy=0;pen=BALL_R+rt;}
            else if(m===tp){ux=0;uy=-1;pen=BALL_R+tp;}
            else{ux=0;uy=1;pen=BALL_R+bt;}
          }else{
            var d=Math.sqrt(d2);ux=dx/d;uy=dy/d;pen=BALL_R-d;
          }
          if(pen>bestPen){bestPen=pen;bB=B;bnx=ux;bny=uy;bhx=nx;bhy=ny;}
        }
      }
      if(!bB)break;
      var pi,p;
      var pierce=G.fx.fireball>0||(G.fx.disruptor>0&&bB.hp>1);
      if(!pierce){
        for(pi=0;pi<b.p.length;pi++){
          p=b.p[pi];
          PX[p]+=bnx*bestPen;PY[p]+=bny*bestPen;
          OX[p]+=bnx*bestPen;OY[p]+=bny*bestPen;
        }
      }
      var vx=PX[c]-OX[c],vy=PY[c]-OY[c],vn=vx*bnx+vy*bny;
      var sp=Math.sqrt(vx*vx+vy*vy);
      if(pierce){
        if(G.time>=bB.burnCd){
          bB.burnCd=G.time+CFG.fx.burnCd;
          damageBrick(bB,bnx,bny,Math.min(5,sp+1),bhx,bhy,true);
        }
      }else if(vn<0){
        var rvx=vx-2*vn*bnx,rvy=vy-2*vn*bny;
        for(pi=0;pi<b.p.length;pi++){
          p=b.p[pi];
          OX[p]=PX[p]-rvx;OY[p]=PY[p]-rvy;
        }
        damageBrick(bB,bnx,bny,Math.min(5,sp+1),bhx,bhy,false);
      }
    }
  }
}
function ballVsDebris(){
  if(G.fx.fireball>0)return;
  for(var k=0;k<balls.length;k++){
    var b=balls[k];
    if(!b.alive||b.stuck)continue;
    var c=b.p[0],bx=PX[c],by=PY[c];
    for(var bi=0;bi<bodies.length;bi++){
      var B=bodies[bi];
      if(!B||!B.alive||B.kind!==K_BRICK||B.attached)continue;
      var mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9,pi;
      for(pi=0;pi<B.p.length;pi++){
        var px=PX[B.p[pi]],py=PY[B.p[pi]];
        if(px<mnx)mnx=px;
        if(px>mxx)mxx=px;
        if(py<mny)mny=py;
        if(py>mxy)mxy=py;
      }
      if(bx>=mnx&&bx<=mxx&&by>=mny&&by<=mxy){
        var l=bx-mnx,r=mxx-bx,t=by-mny,bt=mxy-by;
        var m=Math.min(l,r,t,bt),ux=0,uy=0;
        if(m===l)ux=-1;else if(m===r)ux=1;else if(m===t)uy=-1;else uy=1;
        var push=BALL_R+m+2;
        for(pi=0;pi<b.p.length;pi++){
          var p=b.p[pi];
          PX[p]+=ux*push;PY[p]+=uy*push;
          OX[p]+=ux*push;OY[p]+=uy*push;
        }
      }
    }
  }
}
function ballWalls(){

      var d=BALL_R+3-x;

      vx=Math.abs(vx);moved=1;

    }else if(x>W-BALL_R-3){

      vx=-Math.abs(vx);moved=1;
      if(t-lastWallSnd>0.06){sfx.wall();lastWallSnd=t;}
    }
    if(y<BALL_R+3){
      var d3=BALL_R+3-y;
      for(pi=0;pi<b.p.length;pi++){p=b.p[pi];PY[p]+=d3;OY[p]+=d3;}

function ballPaddle(){
  if(!paddle||!paddle.alive)return;
  var halfW=paddle.w/2,top=PADY-PADR;
  for(var k=0;k<balls.length;k++){
    var b=balls[k];
    if(!b.alive||b.stuck)continue;
    var c=b.p[0],x=PX[c],y=PY[c];
    if(y+BALL_R<top||y-BALL_R>PADY+PADR)continue;
    if(x+BALL_R<G.padMinX||x-BALL_R>G.padMaxX)continue;
    var vx=PX[c]-OX[c],vy=PY[c]-OY[c];
    var nvx=vx,nvy=vy,pi,p;
    if(y<top+5&&vy>0.02){
      if(G.fx.sticky>0){
        b.stuck=true;
        b.stickOff=clamp(x-G.padCx,-(halfW-6),halfW-6);
        for(pi=0;pi<b.p.length;pi++){p=b.p[pi];IM[p]=0;OX[p]=PX[p];OY[p]=PY[p];}
        sfx.paddle();G.paddleTouched=true;
        return;
      }
      var t=clamp((x-G.padCx)/(halfW+BALL_R*0.5),-1,1);
      var spd=Math.sqrt(vx*vx+vy*vy)||ballSpeedNow();
      var ang=curveAng(t);
      var pv=clamp(G.padV,-10,10);
      nvx=Math.sin(ang)*spd+CFG.paddle.momentum*pv;
      nvy=-Math.cos(ang)*spd;
      if(nvy>-0.2*spd)nvy=-0.2*spd;
      var dy=(top-BALL_R)-y;
      for(pi=0;pi<b.p.length;pi++){p=b.p[pi];PY[p]+=dy;OY[p]+=dy;}
      sfx.paddle();G.paddleTouched=true;
    }else{
      nvx=(x<G.padCx)?-Math.abs(vx):Math.abs(vx);
      var dxs=(x<G.padCx)?(G.padMinX-BALL_R)-x:(G.padMaxX+BALL_R)-x;
      for(pi=0;pi<b.p.length;pi++){p=b.p[pi];PX[p]+=dxs;OX[p]+=dxs;}
    }
    for(pi=0;pi<b.p.length;pi++){p=b.p[pi];OX[p]=PX[p]-nvx;OY[p]=PY[p]-nvy;}
  }
}
function steer(){
  if(!paddle||!paddle.alive)return;
  var P=paddle.p,cx=0,k;
  for(k=0;k<P.length;k++)cx+=PX[P[k]];
  cx/=P.length;
  var tx=G.tx,halfW=paddle.w/2;
  if(tx<halfW+3)tx=halfW+3;

    PX[P[k]]+=dx;OX[P[k]]=PX[P[k]]-dx;PY[P[k]]=PADY;OY[P[k]]=PADY;
  }

    for(j=0;j<n;j++){
      var a=j*6.2832/n;

function ballCtrl(){

  ctx.lineTo(PX[p[5]],PY[p[5]]);ctx.lineTo(PX[p[4]],PY[p[4]]);ctx.lineTo(PX[p[3]],PY[p[3]]);
  ctx.closePath();
}
function render(dtF){
  var t=G.time,k;
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);
  if(tier>0&&starCv){
    var off=(t*7)%(H);
    ctx.globalAlpha=tier>1?1:0.7;
    ctx.drawImage(starCv,0,off-H);ctx.drawImage(starCv,0,off);
    ctx.globalAlpha=1;
  }
  ctx.lineWidth=6;ctx.strokeStyle=SPRITES.railGlow;
  ctx.beginPath();ctx.moveTo(3,H+30);ctx.lineTo(3,3);ctx.lineTo(W-3,3);ctx.lineTo(W-3,H+30);ctx.stroke();
  ctx.lineWidth=2.5;ctx.strokeStyle=SPRITES.rail;ctx.stroke();
  var vg=ctx.createLinearGradient(0,H-70,0,H);
  vg.addColorStop(0,SPRITES.voidEdge+'0)');
  vg.addColorStop(1,SPRITES.voidEdge+'0.2)');
  ctx.fillStyle=vg;ctx.fillRect(0,H-70,W,70);
  ctx.globalAlpha=0.25+0.15*Math.sin(t*4);ctx.fillStyle=SPRITES.danger;
  for(k=0;k<W;k+=26)ctx.fillRect(k+((t*30)%26),H-3,13,2);
  ctx.globalAlpha=1;
  if(G.fx.field>0){
    var fa=G.fx.field<3?(0.35+0.35*Math.abs(Math.sin(t*12))):0.8;
    var fg=ctx.createLinearGradient(0,FIELD_Y-16,0,FIELD_Y+8);
    fg.addColorStop(0,SPRITES.field+'0)');
    fg.addColorStop(1,SPRITES.field+(0.28*fa)+')');
    ctx.fillStyle=fg;ctx.fillRect(4,FIELD_Y-16,W-8,24);
    ctx.setLineDash([12,9]);ctx.lineDashOffset=-t*60;
    ctx.strokeStyle=SPRITES.fieldLine+fa+')';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(4,FIELD_Y);ctx.lineTo(W-4,FIELD_Y);ctx.stroke();
    ctx.setLineDash([]);
  }
  for(var bi=0;bi<bodies.length;bi++){
    var b=bodies[bi];
    if(!b||!b.alive)continue;
    if(b.kind===K_BRICK)drawBrick(b,t);
    else if(b.kind===K_PRIZE)drawPrize(b,t);
    else if(b.kind===K_BALL)drawBall(b);
    else if(b.kind===K_PAD)drawPaddle(b);
    else if(b.kind===K_BULLET)drawBullet(b);
  }
  for(k=sparks.length-1;k>=0;k--){
    var s=sparks[k];s.t-=dtF;
    if(s.t<=0){sparks.splice(k,1);continue;}
    s.x+=s.vx*dtF;s.y+=s.vy*dtF;s.vy+=500*dtF*G.gravScale;
    ctx.globalAlpha=Math.min(1,s.t*2.4);ctx.fillStyle=s.c;
    ctx.fillRect(s.x-1.5,s.y-1.5,3,3);
  }
  ctx.globalAlpha=1;
  ctx.font='bold 13px Consolas,Menlo,monospace';ctx.textAlign='center';
  for(k=floats.length-1;k>=0;k--){
    var f=floats[k];f.t+=dtF;
    if(f.t>1){floats.splice(k,1);continue;}
    ctx.globalAlpha=1-f.t;ctx.fillStyle=f.c;
    ctx.fillText(f.s,f.x,f.y-f.t*34);
  }
  ctx.globalAlpha=1;
  if(flashLoss>0){
    ctx.globalAlpha=flashLoss*0.35;ctx.fillStyle=SPRITES.lossFlash;
    ctx.fillRect(0,H-90,W,90);
    ctx.globalAlpha=1;flashLoss-=dtF*2.2;
  }
}
function drawBrick(b,t){
  brickPath(b);
  if(b.metal){ctx.fillStyle='hsl('+b.hue+',14%,70%)';ctx.fill();ctx.strokeStyle='hsl('+b.hue+',18%,38%)';}
  else{ctx.fillStyle='hsl('+b.hue+',70%,54%)';ctx.fill();ctx.strokeStyle='hsl('+b.hue+',72%,30%)';}
  ctx.lineWidth=1.5;ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(PX[b.p[0]],PY[b.p[0]]+1.5);ctx.lineTo(PX[b.p[2]],PY[b.p[2]]+1.5);ctx.stroke();
  if(b.prize>=0){
    var col=PRIZES[b.prize].col;
    ctx.globalAlpha=0.45+0.35*Math.sin(t*5+b.row+b.col);
    ctx.shadowColor=col;ctx.shadowBlur=22;
    ctx.strokeStyle=col;ctx.lineWidth=3;brickPath(b);ctx.stroke();
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
}
function drawPrize(b,t){
  var cx=0,cy=0,k;
  for(k=0;k<6;k++){cx+=PX[b.p[k]];cy+=PY[b.p[k]];}
  cx/=6;cy/=6;
  var PZ=PRIZES[b.prize];
  ctx.globalAlpha=0.3+0.2*Math.sin(t*6);
  ctx.fillStyle=PZ.col;ctx.beginPath();ctx.arc(cx,cy,26,0,6.2832);ctx.fill();
  ctx.globalAlpha=1;
  brickPath(b);ctx.fillStyle=SPRITES.prizeBody;ctx.fill();
  ctx.strokeStyle=PZ.col;ctx.lineWidth=2.5;ctx.stroke();
  ctx.font='bold 24px Consolas,Menlo,monospace';ctx.textAlign='center';
  ctx.shadowColor=PZ.col;ctx.shadowBlur=10;
  ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.95)';
  ctx.strokeText(PZ.g,cx,cy+8);
  ctx.fillStyle=SPRITES.prizeInk;ctx.fillText(PZ.g,cx,cy+8);
  ctx.shadowBlur=0;
}
function drawBall(b){
  if(G.fx.invisible>0){
    var qq=(PY[b.p[0]]-TOPY)/(PADY-TOPY);
    if(qq<0)qq=0;
    if(qq>1)qq=1;
    ctx.globalAlpha=0.12+0.83*qq;
  }else if(b.stuck){
    ctx.globalAlpha=0.55+0.3*Math.sin(G.time*5);
  }
  var n=7;
  ctx.beginPath();
  var p0=b.p[1],p1=b.p[2];
  ctx.moveTo((PX[p0]+PX[p1])/2,(PY[p0]+PY[p1])/2);
  for(var k=1;k<=n;k++){
    var a=b.p[1+k%n],c=b.p[1+(k+1)%n];
    ctx.quadraticCurveTo(PX[a],PY[a],(PX[a]+PX[c])/2,(PY[a]+PY[c])/2);
  }
  ctx.closePath();
  ctx.fillStyle=G.fx.fireball>0?SPRITES.fire:SPRITES.ball;ctx.fill();
  ctx.strokeStyle=G.fx.fireball>0?SPRITES.fireEdge:SPRITES.ballEdge;
  ctx.lineWidth=1.6;ctx.stroke();
  ctx.fillStyle=SPRITES.ballHi;
  ctx.beginPath();ctx.arc(PX[b.p[0]]-2.5,PY[b.p[0]]-2.5,2.4,0,6.2832);ctx.fill();
  ctx.globalAlpha=1;
}
function drawBullet(b){
  var x=PX[b.p[0]],y=PY[b.p[0]];
  ctx.strokeStyle=SPRITES.bulletGlow;ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(x,y+13);ctx.lineTo(x,y-2);ctx.stroke();
  ctx.strokeStyle=SPRITES.bulletCore;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x,y+11);ctx.lineTo(x,y-3);ctx.stroke();
}
function drawPaddle(b){
  var P=b.p,k;
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();
  var mx=(PX[P[0]]+PX[P[6]])/2;
  var curveY=G.fx.concave>0?PADY+12:PADY-14;
  ctx.moveTo(PX[P[0]],PY[P[0]]);
  ctx.quadraticCurveTo(mx,curveY,PX[P[6]],PY[P[6]]);
  ctx.strokeStyle=SPRITES.paddleGlow;ctx.lineWidth=28;ctx.stroke();
  var g=ctx.createLinearGradient(G.padMinX,0,G.padMaxX,0);
  g.addColorStop(0,SPRITES.paddle[0]);g.addColorStop(0.5,SPRITES.paddle[1]);g.addColorStop(1,SPRITES.paddle[2]);
  ctx.strokeStyle=g;ctx.lineWidth=17;ctx.stroke();
  ctx.strokeStyle=SPRITES.paddleGloss;ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(PX[P[0]],PY[P[0]]-4);
  ctx.quadraticCurveTo(mx,curveY-4,PX[P[6]],PY[P[6]]-4);
  ctx.stroke();
  if(G.shield>0){
    ctx.strokeStyle=SPRITES.shield+(0.4+0.25*Math.sin(G.time*6))+')';
    ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(PX[P[0]]-6,PADY+16);ctx.lineTo(PX[P[6]]+6,PADY+16);ctx.stroke();
  }
}

function tone(f0,f1,dur,type,vol,dl){
  if(G.mute||!AC)return;
  var t=AC.currentTime+(dl||0);
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.03);
}

      for(var k=0;k<balls.length;k++){if(balls[k].stuck){launchBall(balls[k]);break;}}

    if(G.mode==='play'){G.ffTarget=CFG.ff.max;ffBtn.classList.add('active');}
    e.preventDefault();
  }
  else if(e.code==='Space'){
    if(G.mode==='title')startGame();

      for(var k2=0;k2<balls.length;k2++){if(balls[k2].stuck){launchBall(balls[k2]);break;}}
    }
    e.preventDefault();
  }
  else if(e.code==='Enter'){
    if(G.mode==='title')startGame();
    else if(G.mode==='over')startGame();
    else if(G.mode==='play')togglePause();
  }
  else if(e.code==='KeyP'||e.code==='Escape')togglePause();

function govern(ms){
  ft+=ms;fn++;
  if(fn>=50){
    var avg=ft/fn;ft=0;fn=0;
    if(avg>34&&tier>0){tier--;RS=RS_TIERS[tier];ITER=tier>1?CFG.physics.iter:2;resize();}
    else if(avg<15&&tier<2&&upLock-->0){tier++;RS=RS_TIERS[tier];ITER=CFG.physics.iter;resize();}
  }
}

var last=performance.now(),acc=0;
function frame(now){
  var ms=now-last;last=now;
  if(ms>100)ms=100;
  G.time+=ms/1000;
  var ffDiff=G.ffTarget-G.ffCurrent;
  if(Math.abs(ffDiff)>0.01){G.ffCurrent+=ffDiff*(ffDiff>0?CFG.ff.rampUp:CFG.ff.rampDown);}
  else{G.ffCurrent=G.ffTarget;}
  if(G.mode==='play'&&!G.paused){
    if(G.keyDir!==0){
      G.ptr=false;G.tx+=G.keyDir*ms*0.55;
      if(G.tx<20)G.tx=20;
      if(G.tx>W-20)G.tx=W-20;
    }
    acc+=ms*G.ffCurrent;
    var n=0,maxN=Math.ceil(3*G.ffCurrent);
    while(acc>=1000/120&&n<maxN){physics(STEP);acc-=1000/120;n++;}
    if(n>=maxN)acc=0;
    if(G.paddleTouched){
      G.paddleTouched=false;
      if(G.chain>0){G.chain=0;syncHUD();}
    }
    if(G.fx.shoot>0||G.fx.laser>0){
      G.shootT-=ms/1000*G.ffCurrent;
      if(G.shootT<=0){G.shootT=G.fx.laser>0?CFG.fx.laserInterval:CFG.fx.gunInterval;fireBullet();}
    }
    var k;
    for(k in G.fx){
      if(G.fx[k]>0){
        G.fx[k]-=ms/1000*G.ffCurrent;
        if(G.fx[k]<=0){
          G.fx[k]=0;
          if((k==='wide'||k==='narrow')&&!G.fx.wide&&!G.fx.narrow)setPadW(CFG.paddle.width);
        }
      }
    }
    if(G.clearing&&G.time>G.clearAt){
      G.clearing=false;G.level++;
      buildLevel(G.level);syncHUD();
      showBanner(TEXTS.banners.level+' '+G.level,G.patName);
    }
    fxChips();
  }else if(G.mode!=='play'){
    acc+=ms;
    var m=0;
    while(acc>=1000/120&&m<2){physics(STEP);acc-=1000/120;m++;}
    if(m===2)acc=0;
  }
  render(ms/1000);
  govern(ms);
  requestAnimationFrame(frame);
}

applyLang();makeStars();resize();syncHUD();
hSet('title',true);
requestAnimationFrame(frame);
})();
</script>
