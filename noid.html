<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  #score{font-size:16px;font-weight:700;color:#ffd76a;text-shadow:0 0 10px rgba(255,190,60,.35)}
  #level{font-size:14px;font-weight:700;color:#8fe8ff}
  #chain{font-size:9px;font-weight:700;color:#ff8fb0;visibility:hidden}

  .tbtn{width:32px;height:32px;flex:0 0 32px;border-radius:8px;border:1px solid #2b3f6b;
    background:rgba(10,16,34,.85);color:#9fc6ff;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .12s,background .12s}
  .tbtn:hover{background:#17254a;transform:translateY(-1px)}
  .tbtn:active{transform:translateY(1px)}
  #homeBtn{width:36px;height:36px;flex:0 0 36px;border-radius:50%;
    background:linear-gradient(180deg,#5db8ff,#2d6eb8);border:2px solid #1a4a80;color:#fff;font-size:17px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(0,0,0,.5);transition:transform .15s}
  #homeBtn:hover{transform:scale(1.1)}
  #homeBtn:active{transform:scale(0.95)}
  #ffBtn{width:32px;height:32px;flex:0 0 32px;border-radius:8px;border:1px solid #2b3f6b;
    background:rgba(10,16,34,.85);color:#9fc6ff;font-size:14px;cursor:pointer;
    display:none;align-items:center;justify-content:center;transition:background .12s,color .12s}

  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  #scan{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:.45;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
  #vig{position:absolute;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(115% 100% at 50% 45%,transparent 62%,rgba(0,0,10,.42) 100%)}

  .chip i{position:absolute;left:0;bottom:0;height:2px;background:currentColor;opacity:.9}
  .chip.good{color:#7dffb0;border-color:#2c7a4d}.chip.bad{color:#ff8f8f;border-color:#8a3540}
  .chip.spd{color:#8fd4ff;border-color:#2d5f8a}
  #seedTag{position:absolute;left:12px;bottom:7px;z-index:8;pointer-events:none;
    font-family:Consolas,Menlo,monospace;font-size:9px;letter-spacing:.12em;color:#4d6285;opacity:.8}
  #banner{position:absolute;left:0;right:0;top:38%;z-index:9;text-align:center;pointer-events:none;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;font-weight:900;font-size:34px;letter-spacing:.14em;
    color:#fff;text-shadow:0 0 18px rgba(120,220,255,.8),2px 2px 0 #0aa, -2px -1px 0 #d3f;
    opacity:0;transform:scale(.8)}

  #banner.show{animation:bnr 1.5s ease forwards}
  @keyframes bnr{0%{opacity:0;transform:scale(.7)}14%{opacity:1;transform:scale(1.06)}24%{transform:scale(1)}

    border:2px solid #2a3c66;border-radius:12px;padding:24px 26px;text-align:center;

    touch-action:pan-y;-webkit-overflow-scrolling:touch}

    color:#eef7ff;line-height:1;text-shadow:0 0 22px rgba(90,210,255,.55),3px 3px 0 rgba(0,190,255,.55),-3px -2px 0 rgba(255,60,170,.45)}
  .logo em{font-style:normal;color:#ffc44d;text-shadow:0 0 22px rgba(255,180,60,.6),3px 3px 0 rgba(200,90,0,.6)}

  .frow{display:flex;gap:7px;margin-bottom:11px;align-items:stretch}

      <button class="btn alt" id="titleBtn">TITLE</button>

      <button class="btn alt" id="pauseTitleBtn">🏠&nbsp; BACK TO TITLE</button>
    </div></div>
  </div>
</div>

function xmur3(str){
  var h=1779033703^str.length,i;
  for(i=0;i<str.length;i++){
    h=Math.imul(h^str.charCodeAt(i),3432918353);
    h=h<<13|h>>>19;
  }
  return function(){
    h=Math.imul(h^h>>>16,2246822507);
    h=Math.imul(h^h>>>13,3266489909);
    return (h^=h>>>16)>>>0;
  };
}
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function q(id){return document.getElementById(id);}

var W=CFG.screen.W,H=CFG.screen.H,STEP=CFG.physics.step,TOPBAR=CFG.ui.topbar;
var COLS=CFG.grid.cols,MARG=CFG.grid.margin,TOPY=CFG.grid.top,RH=CFG.grid.rowH,BH=CFG.grid.brickH;
var PADY=CFG.paddle.y,PADR=CFG.paddle.r,CURV=CFG.paddle.curve;
var BALL_R=CFG.ball.r;
var FIELD_Y=H-CFG.field.yOffset;

var K_PAD=1,K_BALL=2,K_BRICK=3,K_PRIZE=4,K_BULLET=5;

var MAXP=960,MAXC=1500;
var PX=new Float32Array(MAXP),PY=new Float32Array(MAXP),
    OX=new Float32Array(MAXP),OY=new Float32Array(MAXP),
    IM=new Float32Array(MAXP),PR=new Float32Array(MAXP),
    GF=new Float32Array(MAXP),ACT=new Uint8Array(MAXP),BID=new Int16Array(MAXP);
var CA=new Int16Array(MAXC),CB=new Int16Array(MAXC),
    CR=new Float32Array(MAXC),CK=new Float32Array(MAXC),ACTC=new Uint8Array(MAXC);
var pTop=0,cTop=0,pFree=[],cFree=[];
function newP(b,x,y,r,im,g){
  var i=pFree.length?pFree.pop():pTop++;
  PX[i]=OX[i]=x;PY[i]=OY[i]=y;PR[i]=r;IM[i]=im;GF[i]=g;BID[i]=b;ACT[i]=1;
  return i;
}
function newC(a,b,k){
  var i=cFree.length?cFree.pop():cTop++;
  CA[i]=a;CB[i]=b;
  var dx=PX[b]-PX[a],dy=PY[b]-PY[a];
  CR[i]=Math.sqrt(dx*dx+dy*dy);CK[i]=k;ACTC[i]=1;
  return i;
}

var bodies=[],bFree=[];
function newBody(){
  var i=bFree.length?bFree.pop():bodies.length;
  var b=bodies[i];
  if(!b){
    b={id:i,p:[],c:[],ax:new Float32Array(6),ay:new Float32Array(6)};
    bodies[i]=b;
  }else{
    b.p.length=0;b.c.length=0;
  }
  b.kind=0;b.alive=true;b.attached=false;b.hp=1;b.dead=false;
  b.prize=-1;b.stuck=false;b.w=0;b.phase=0;b.born=0;b.swayA=0;b.swayW=0;
  b.burnCd=0;b.stickOff=0;
  return b;
}
function killBody(b){
  if(!b.alive)return;
  b.alive=false;
  var k,i;
  for(k=0;k<b.p.length;k++){i=b.p[k];ACT[i]=0;pFree.push(i);}
  for(k=0;k<b.c.length;k++){i=b.c[k];ACTC[i]=0;cFree.push(i);}
  b.p.length=0;b.c.length=0;
  bFree.push(b.id);
}

var CS=28,GW=Math.ceil(W/CS)+2,GH=Math.ceil((H+140)/CS)+2;
var HEAD=new Int32Array(GW*GH),NXT=new Int32Array(MAXP);
function buildGrid(){
  HEAD.fill(-1);
  for(var i=0;i<pTop;i++){
    if(!ACT[i])continue;
    var b=bodies[BID[i]];
    if(b.stuck||(b.kind===K_BRICK&&b.attached))continue;
    var cx=(PX[i]/CS)|0,cy=((PY[i]+CS)/CS)|0;
    if(cx<0)cx=0;else if(cx>=GW)cx=GW-1;
    if(cy<0)cy=0;else if(cy>=GH)cy=GH-1;
    var ci=cy*GW+cx;
    NXT[i]=HEAD[ci];HEAD[ci]=i;
  }
}

function buildLevel(n){

  floats.length=0;sparks.length=0;

  G.clearing=false;G.paddleTouched=false;G.padV=0;
  var rnd=mulberry32(xmur3(G.seed+'::'+n)());
  var rows=Math.min(9,5+((n*0.5)|0)+(rnd()<0.35?1:0));
  var roll=rnd(),picks=[],pi;
  if(n<2)roll=1;
  if(roll<0.30){
    picks=[LAYOUTS.masks[(rnd()*LAYOUTS.masks.length)|0]];
  }else if(roll<0.52){
    for(pi=0;pi<2;pi++)picks.push(LAYOUTS.masks[(rnd()*LAYOUTS.masks.length)|0]);
  }
  if(picks.length){
    var mk=picks[(rnd()*picks.length)|0];
    G.patName=mk.n;rows=mk.m.length;
    var off=Math.max(0,Math.min(COLS-9,((rnd()*(COLS-8))|0)));
    for(var r=0;r<rows;r++){
      for(var c=0;c<COLS;c++){
        var mc=c-off;
        if(mc<0||mc>8)continue;
        if(mk.m[r].charAt(mc)==='X')addBrick(r,c,rnd()<metalChance(n),0,rnd);
      }
    }
  }else{
    var pat=(rnd()*6)|0,ph=(rnd()*9)|0;
    G.patName=LAYOUTS.patterns[pat];
    for(var r2=0;r2<rows;r2++){
      for(var c2=0;c2<COLS;c2++){
        var ok=false;
        if(pat===0)ok=r2<rows-2||c2%2===0;
        else if(pat===1)ok=(r2+c2+ph)%2===0;
        else if(pat===2)ok=Math.abs(c2-4)<=r2*0.75+1;
        else if(pat===3)ok=(Math.abs(c2-4)+Math.abs(r2-rows/2+0.5))<=rows/2+1.2;
        else if(pat===4)ok=rnd()<0.55;
        else ok=c2%3===0||r2%2===0;
        if(ok)addBrick(r2,c2,rnd()<metalChance(n),0,rnd);
      }
    }
  }
  var hue0=(rnd()*360)|0,list=[],qq;
  for(qq=0;qq<bodies.length;qq++){
    var B=bodies[qq];
    if(B&&B.alive&&B.kind===K_BRICK){B.hue=(hue0+B.row*17+B.col*5)%360;list.push(B);}
  }
  var np=Math.min(list.length>>1,2+(((n+1)/3)|0)+((rnd()*2)|0)),cnt=0,tries=0;
  while(cnt<np&&tries++<200){
    var B2=list[(rnd()*list.length)|0];
    if(B2.prize<0){B2.prize=pickPrize(rnd);cnt++;}
  }
  G.rows=rows;G.zoneY=TOPY+rows*RH+50;
  makePaddle(W/2,CFG.paddle.width);
  spawnStuckBall();
  q('seedTag').textContent=TEXTS.seedTag+' '+G.seed+' · LV'+n;
}
function addBrick(r,c,metal,demo,rnd){

  var b=newBody();b.kind=K_BRICK;b.attached=!demo;b.hp=metal?2:1;b.metal=metal;

function makeBall(x,y,stuck){

function integrate(dt){
  var dt2=dt*dt,gs=GRAV*G.gravScale;
  for(var i=0;i<pTop;i++){
    if(!ACT[i]||IM[i]===0)continue;
    var x=PX[i],y=PY[i];
    var vx=(x-OX[i])*AIR,vy=(y-OY[i])*AIR;
    var v2=vx*vx+vy*vy;
    if(v2>210){var f=14.5/Math.sqrt(v2);vx*=f;vy*=f;}
    var g=GF[i]*gs;
    if(G.ballGrav>0&&bodies[BID[i]].kind===K_BALL)g+=G.ballGrav*gs;
    OX[i]=x;OY[i]=y;PX[i]=x+vx;PY[i]=y+vy+g*dt2;
  }
}
function solveC(){
  for(var k=0;k<cTop;k++){
    if(!ACTC[k])continue;
    var a=CA[k],b=CB[k];
    var dx=PX[b]-PX[a],dy=PY[b]-PY[a];
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<1e-6)d=1e-6;
    var diff=(d-CR[k])/d*CK[k];
    var wi=IM[a],wj=IM[b],ws=wi+wj;
    if(!ws)continue;
    var ki=wi/ws,kj=wj/ws;
    PX[a]+=dx*diff*ki;PY[a]+=dy*diff*ki;
    PX[b]-=dx*diff*kj;PY[b]-=dy*diff*kj;
  }
}
function solvePP(i,j){
  var bi=bodies[BID[i]],bj=bodies[BID[j]];
  if((bi.kind===K_BALL&&bj.kind===K_PAD)||(bi.kind===K_PAD&&bj.kind===K_BALL))return;
  if(G.fx.fireball>0){
    if((bi.kind===K_BALL&&(bj.kind===K_BRICK||bj.kind===K_PRIZE))||
       (bj.kind===K_BALL&&(bi.kind===K_BRICK||bi.kind===K_PRIZE)))return;
  }
  var dx=PX[j]-PX[i],dy=PY[j]-PY[i],rr=PR[i]+PR[j],d2=dx*dx+dy*dy;
  if(d2>=rr*rr||d2<1e-8)return;
  var wi=IM[i],wj=IM[j],ws=wi+wj;
  if(!ws)return;
  var d=Math.sqrt(d2),f=(rr-d)*0.85,ki=wi/ws,kj=1-ki;
  var cx2=dx/d*f,cy2=dy/d*f;
  PX[i]-=cx2*ki;PY[i]-=cy2*ki;PX[j]+=cx2*kj;PY[j]+=cy2*kj;
  if(bi.kind===K_PAD||bj.kind===K_PAD){
    var isPadI=bi.kind===K_PAD;
    var od=isPadI?bj:bi,oi=isPadI?j:i,pi2=isPadI?i:j;
    if(od.kind===K_BRICK||od.kind===K_PRIZE){
      var pvx=PX[pi2]-OX[pi2],pvy=PY[pi2]-OY[pi2];
      var cvx=PX[oi]-OX[oi],cvy=PY[oi]-OY[oi];
      OX[oi]=PX[oi]-(cvx+(pvx-cvx)*CFG.paddle.carry);
      OY[oi]=PY[oi]-(cvy+(pvy-cvy)*CFG.paddle.carryV);
    }
  }
}
function collidePP(){
  for(var cy=0;cy<GH;cy++){
    for(var cx=0;cx<GW;cx++){
      var h=HEAD[cy*GW+cx];
      if(h===-1)continue;
      var a,b2;
      for(a=h;a!==-1;a=NXT[a]){
        for(b2=NXT[a];b2!==-1;b2=NXT[b2])solvePP(a,b2);
      }
      var nb;
      if(cx+1<GW){
        nb=cy*GW+cx+1;
        for(a=h;a!==-1;a=NXT[a]){
          for(b2=HEAD[nb];b2!==-1;b2=NXT[b2])solvePP(a,b2);
        }
      }
      if(cy+1<GH){
        nb=(cy+1)*GW+cx;
        for(a=h;a!==-1;a=NXT[a]){
          for(b2=HEAD[nb];b2!==-1;b2=NXT[b2])solvePP(a,b2);
        }
        if(cx>0){
          nb=(cy+1)*GW+cx-1;
          for(a=h;a!==-1;a=NXT[a]){
            for(b2=HEAD[nb];b2!==-1;b2=NXT[b2])solvePP(a,b2);
          }
        }
        if(cx+1<GW){
          nb=(cy+1)*GW+cx+1;
          for(a=h;a!==-1;a=NXT[a]){
            for(b2=HEAD[nb];b2!==-1;b2=NXT[b2])solvePP(a,b2);
          }
        }
      }
    }
  }
}
function walls(){
  for(var i=0;i<pTop;i++){

    var b=bodies[BID[i]];
    if(b.stuck||b.kind===K_BALL)continue;
    var r=PR[i],x=PX[i];
    if(x<r+3){var vx=x-OX[i];PX[i]=r+3;OX[i]=PX[i]+vx*0.5;}
    else if(x>W-r-3){var vx2=x-OX[i];PX[i]=W-r-3;OX[i]=PX[i]+vx2*0.5;}
    if(PY[i]<r+3){var vy=PY[i]-OY[i];PY[i]=r+3;OY[i]=PY[i]+vy*0.5;}
  }
}
function anchors(){
  for(var bi=0;bi<bodies.length;bi++){
    var b=bodies[bi];
    if(!b||!b.alive||b.kind!==K_BRICK||!b.attached)continue;
    for(var k=0;k<6;k++){
      var i=b.p[k];
      var dx=b.ax[k]-PX[i],dy=b.ay[k]-PY[i];
      PX[i]+=dx*0.32;PY[i]+=dy*0.32;
      OX[i]+=(PX[i]-OX[i])*0.22;OY[i]+=(PY[i]-OY[i])*0.22;

function collideBrickAt(i){
  var x=PX[i],y=PY[i];
  if(y>G.zoneY)return;
  var r=PR[i]+1;
  var c0=((x-r-MARG)/CW())|0,c1=((x+r-MARG)/CW())|0;
  var r0=((y-r-TOPY)/RH)|0,r1=((y+r-TOPY)/RH)|0;
  var cc,rr2;
  if(c0<0)c0=0;if(c1>=COLS)c1=COLS-1;
  if(r0<0)r0=0;if(r1>=G.rows-1)r1=G.rows-1;
  for(rr2=r0;rr2<=r1;rr2++){
    for(cc=c0;cc<=c1;cc++){
      var gi=grid[rr2*COLS+cc];
      if(gi<0)continue;
      var B=bodies[gi];
      if(!B.alive||!B.attached)continue;
      var nx=x<B.x0?B.x0:(x>B.x1?B.x1:x);
      var ny=y<B.y0?B.y0:(y>B.y1?B.y1:y);
      var dx=x-nx,dy=y-ny,d2=dx*dx+dy*dy;
      if(d2>r*r)continue;
      var d=Math.sqrt(d2),ux,uy;
      if(d<0.001){
        var l=x-B.x0,rt=B.x1-x,tp=y-B.y0,bt=B.y1-y,m=Math.min(l,rt,tp,bt);
        if(m===l){ux=-1;uy=0;d=-l;}
        else if(m===rt){ux=1;uy=0;d=-rt;}
        else if(m===tp){ux=0;uy=-1;d=-tp;}
        else{ux=0;uy=1;d=-bt;}
      }else{
        ux=dx/d;uy=dy/d;
      }
      var vx=PX[i]-OX[i],vy=PY[i]-OY[i],vn=vx*ux+vy*uy,push=r-d;
      PX[i]+=ux*push;PY[i]+=uy*push;
      if(vn<0){OX[i]=PX[i]-(vx-1.45*vn*ux);OY[i]=PY[i]-(vy-1.45*vn*uy);}
      if(-vn>CFG.physics.debrisDetach){
        var OB=bodies[BID[i]];
        damageBrick(B,ux,uy,Math.min(5,2-vn),nx,ny,false);
        if(OB.kind===K_BULLET){OB.dead=true;burst(nx,ny,4,190);}
      }
    }
  }
}
function collideBricks(){
  for(var i=0;i<pTop;i++){
    if(!ACT[i])continue;
    var b=bodies[BID[i]];
    if(b.stuck||b.kind===K_BALL||(b.kind===K_BRICK&&b.attached))continue;
    collideBrickAt(i);
  }
}
function damageBrick(B,ux,uy,pow,hx,hy,soft){

    }
    sfx.metal();burst(hx,hy,4,B.hue);G.score+=CFG.score.chip;syncHUD();return;
  }
  B.attached=false;grid[B.row*COLS+B.col]=-1;attachedCount--;
  for(var k2=0;k2<B.p.length;k2++){
    OX[B.p[k2]]-=ux*pow*(0.45+Math.random()*0.5);
    OY[B.p[k2]]-=uy*pow*(0.45+Math.random()*0.5);
    OX[B.p[k2]]-=(Math.random()-0.5)*0.7;

  G.chain++;
  var pts=(B.metal?CFG.score.metal:CFG.score.brick)+(G.chain>1?G.chain*CFG.score.chainMul:0);
  G.score+=pts;addFloat(hx,hy,'+'+pts,B.metal?'#cfe0ee':'#ffd76a');
  burst(hx,hy,8,B.hue);

    B.kind=K_PRIZE;B.born=G.time;
    B.swayA=14+Math.random()*20;B.swayW=1.6+Math.random()*1.6;B.phase=Math.random()*6;
    for(k2=0;k2<B.p.length;k2++)GF[B.p[k2]]*=0.42;
    sfx.prizeOut();
  }else{
    if(G.time-lastBrickSnd>0.03){sfx.brick();lastBrickSnd=G.time;}
  }
  syncHUD();
  if(attachedCount===0&&!G.clearing&&G.mode==='play'){
    G.clearing=true;G.clearAt=G.time+1.6;
    var bonus=CFG.score.clearBase+G.level*CFG.score.clearPerLevel;
    G.score+=bonus;syncHUD();
    showBanner(TEXTS.banners.cleared,'+'+bonus+' '+TEXTS.banners.bonus);
    sfx.clear();
  }
}
function ballBricks(){
  for(var k=0;k<balls.length;k++){
    var b=balls[k];
    if(!b.alive||b.stuck)continue;
    var c=b.p[0];
    for(var pass=0;pass<2;pass++){
      var x=PX[c],y=PY[c];
      if(y>G.zoneY)break;
      var bestPen=0,bB=null,bnx=0,bny=0,bhx=0,bhy=0;
      var c0=((x-BALL_R-MARG)/CW())|0,c1=((x+BALL_R-MARG)/CW())|0;
      var r0=((y-BALL_R-TOPY)/RH)|0,r1=((y+BALL_R-TOPY)/RH)|0;
      if(c0<0)c0=0;if(c1>=COLS)c1=COLS-1;
      if(r0<0)r0=0;if(r1>=G.rows-1)r1=G.rows-1;
      for(var rr=r0;rr<=r1;rr++){
        for(var cc=c0;cc<=c1;cc++){
          var gi=grid[rr*COLS+cc];
          if(gi<0)continue;
          var B=bodies[gi];
          if(!B.alive||!B.attached)continue;
          var nx=x<B.x0?B.x0:(x>B.x1?B.x1:x);
          var ny=y<B.y0?B.y0:(y>B.y1?B.y1:y);
          var dx=x-nx,dy=y-ny,d2=dx*dx+dy*dy;
          if(d2>=BALL_R*BALL_R)continue;
          var ux,uy,pen;
          if(d2<1e-8){
            var l=x-B.x0,rt=B.x1-x,tp=y-B.y0,bt=B.y1-y,m=Math.min(l,rt,tp,bt);
            if(m===l){ux=-1;uy=0;pen=BALL_R+l;}
            else if(m===rt){ux=1;uy=0;pen=BALL_R+rt;}
            else if(m===tp){ux=0;uy=-1;pen=BALL_R+tp;}
            else{ux=0;uy=1;pen=BALL_R+bt;}
          }else{
            var d=Math.sqrt(d2);ux=dx/d;uy=dy/d;pen=BALL_R-d;
          }
          if(pen>bestPen){bestPen=pen;bB=B;bnx=ux;bny=uy;bhx=nx;bhy=ny;}
        }
      }
      if(!bB)break;
      var pi,p;
      var pierce=G.fx.fireball>0||(G.fx.disruptor>0&&bB.hp>1);
      if(!pierce){
        for(pi=0;pi<b.p.length;pi++){
          p=b.p[pi];
          PX[p]+=bnx*bestPen;PY[p]+=bny*bestPen;
          OX[p]+=bnx*bestPen;OY[p]+=bny*bestPen;
        }
      }
      var vx=PX[c]-OX[c],vy=PY[c]-OY[c],vn=vx*bnx+vy*bny;
      var sp=Math.sqrt(vx*vx+vy*vy);
      if(pierce){
        if(G.time>=bB.burnCd){
          bB.burnCd=G.time+CFG.fx.burnCd;
          damageBrick(bB,bnx,bny,Math.min(5,sp+1),bhx,bhy,true);
        }
      }else if(vn<0){
        var rvx=vx-2*vn*bnx,rvy=vy-2*vn*bny;
        for(pi=0;pi<b.p.length;pi++){
          p=b.p[pi];

function ballVsDebris(){
  if(G.fx.fireball>0)return;
  for(var k=0;k<balls.length;k++){
    var b=balls[k];
    if(!b.alive||b.stuck)continue;
    var c=b.p[0],bx=PX[c],by=PY[c];
    for(var bi=0;bi<bodies.length;bi++){
      var B=bodies[bi];
      if(!B||!B.alive||B.kind!==K_BRICK||B.attached)continue;
      var mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9,pi;
      for(pi=0;pi<B.p.length;pi++){
        var px=PX[B.p[pi]],py=PY[B.p[pi]];
        if(px<mnx)mnx=px;
        if(px>mxx)mxx=px;
        if(py<mny)mny=py;
        if(py>mxy)mxy=py;
      }
      if(bx>=mnx&&bx<=mxx&&by>=mny&&by<=mxy){
        var l=bx-mnx,r=mxx-bx,t=by-mny,bt=mxy-by;
        var m=Math.min(l,r,t,bt),ux=0,uy=0;
        if(m===l)ux=-1;else if(m===r)ux=1;else if(m===t)uy=-1;else uy=1;
        var push=BALL_R+m+2;
        for(pi=0;pi<b.p.length;pi++){
          var p=b.p[pi];
          PX[p]+=ux*push;PY[p]+=uy*push;
          OX[p]+=ux*push;OY[p]+=uy*push;
        }
      }
    }
  }
}
function ballWalls(){

    var b=balls[k];

    var c=b.p[0],x=PX[c],y=PY[c];
    var vx=PX[c]-OX[c],vy=PY[c]-OY[c];
    var moved=0,pi,p;
    if(x<BALL_R+3){
      var d=BALL_R+3-x;
      for(pi=0;pi<b.p.length;pi++){p=b.p[pi];PX[p]+=d;OX[p]+=d;}
      vx=Math.abs(vx);moved=1;
      if(t-lastWallSnd>0.06){sfx.wall();lastWallSnd=t;}
    }else if(x>W-BALL_R-3){
      var d2=x-(W-BALL_R-3);
      for(pi=0;pi<b.p.length;pi++){p=b.p[pi];PX[p]-=d2;OX[p]-=d2;}
      vx=-Math.abs(vx);moved=1;
      if(t-lastWallSnd>0.06){sfx.wall();lastWallSnd=t;}
    }
    if(y<BALL_R+3){
      var d3=BALL_R+3-y;
      for(pi=0;pi<b.p.length;pi++){p=b.p[pi];PY[p]+=d3;OY[p]+=d3;}
      vy=Math.abs(vy);moved=1;

function ballPaddle(){

    if(y+BALL_R<top||y-BALL_R>PADY+PADR)continue;
    if(x+BALL_R<G.padMinX||x-BALL_R>G.padMaxX)continue;
    var vx=PX[c]-OX[c],vy=PY[c]-OY[c];
    var nvx=vx,nvy=vy,pi,p;
    if(y<top+5&&vy>0.02){
      if(G.fx.sticky>0){
        b.stuck=true;

        for(pi=0;pi<b.p.length;pi++){p=b.p[pi];IM[p]=0;OX[p]=PX[p];OY[p]=PY[p];}
        sfx.paddle();G.paddleTouched=true;
        return;
      }

      var spd=Math.sqrt(vx*vx+vy*vy)||ballSpeedNow();

  }
}
function steer(){

function ballCtrl(){

function drawPrize(b,t){
  var cx=0,cy=0,k;
  for(k=0;k<6;k++){cx+=PX[b.p[k]];cy+=PY[b.p[k]];}
  cx/=6;cy/=6;
  var PZ=PRIZES[b.prize];
  ctx.globalAlpha=0.3+0.2*Math.sin(t*6);
  ctx.fillStyle=PZ.col;ctx.beginPath();ctx.arc(cx,cy,26,0,6.2832);ctx.fill();
  ctx.globalAlpha=1;
  brickPath(b);ctx.fillStyle=SPRITES.prizeBody;ctx.fill();
  ctx.strokeStyle=PZ.col;ctx.lineWidth=2.5;ctx.stroke();
  ctx.font='bold 24px Consolas,Menlo,monospace';ctx.textAlign='center';
  ctx.shadowColor=PZ.col;ctx.shadowBlur=10;
  ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.95)';
  ctx.strokeText(PZ.g,cx,cy+8);
  ctx.fillStyle=SPRITES.prizeInk;ctx.fillText(PZ.g,cx,cy+8);
  ctx.shadowBlur=0;
}
function drawBall(b){
  if(G.fx.invisible>0){
    var qq=(PY[b.p[0]]-TOPY)/(PADY-TOPY);
    if(qq<0)qq=0;
    if(qq>1)qq=1;
    ctx.globalAlpha=0.12+0.83*qq;
  }else if(b.stuck){
    ctx.globalAlpha=0.55+0.3*Math.sin(G.time*5);
  }
  var n=7;
  ctx.beginPath();
  var p0=b.p[1],p1=b.p[2];
  ctx.moveTo((PX[p0]+PX[p1])/2,(PY[p0]+PY[p1])/2);
  for(var k=1;k<=n;k++){
    var a=b.p[1+k%n],c=b.p[1+(k+1)%n];
    ctx.quadraticCurveTo(PX[a],PY[a],(PX[a]+PX[c])/2,(PY[a]+PY[c])/2);
  }
  ctx.closePath();
  ctx.fillStyle=G.fx.fireball>0?SPRITES.fire:SPRITES.ball;ctx.fill();
  ctx.strokeStyle=G.fx.fireball>0?SPRITES.fireEdge:SPRITES.ballEdge;
  ctx.lineWidth=1.6;ctx.stroke();
  ctx.fillStyle=SPRITES.ballHi;
  ctx.beginPath();ctx.arc(PX[b.p[0]]-2.5,PY[b.p[0]]-2.5,2.4,0,6.2832);ctx.fill();
  ctx.globalAlpha=1;
}
function drawBullet(b){
  var x=PX[b.p[0]],y=PY[b.p[0]];
  ctx.strokeStyle=SPRITES.bulletGlow;ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(x,y+13);ctx.lineTo(x,y-2);ctx.stroke();
  ctx.strokeStyle=SPRITES.bulletCore;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x,y+11);ctx.lineTo(x,y-3);ctx.stroke();
}
function drawPaddle(b){
  var P=b.p,k;
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();
  var mx=(PX[P[0]]+PX[P[6]])/2;
  var curveY=G.fx.concave>0?PADY+12:PADY-14;
  ctx.moveTo(PX[P[0]],PY[P[0]]);
  ctx.quadraticCurveTo(mx,curveY,PX[P[6]],PY[P[6]]);
  ctx.strokeStyle=SPRITES.paddleGlow;ctx.lineWidth=28;ctx.stroke();
  var g=ctx.createLinearGradient(G.padMinX,0,G.padMaxX,0);
  g.addColorStop(0,SPRITES.paddle[0]);g.addColorStop(0.5,SPRITES.paddle[1]);g.addColorStop(1,SPRITES.paddle[2]);
  ctx.strokeStyle=g;ctx.lineWidth=17;ctx.stroke();
  ctx.strokeStyle=SPRITES.paddleGloss;ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(PX[P[0]],PY[P[0]]-4);
  ctx.quadraticCurveTo(mx,curveY-4,PX[P[6]],PY[P[6]]-4);
  ctx.stroke();
  if(G.shield>0){
    ctx.strokeStyle=SPRITES.shield+(0.4+0.25*Math.sin(G.time*6))+')';
    ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(PX[P[0]]-6,PADY+16);ctx.lineTo(PX[P[6]]+6,PADY+16);ctx.stroke();
  }
}

var AC=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended'){AC.resume().catch(function(){});}
}
function tone(f0,f1,dur,type,vol,dl){
  if(G.mute||!AC)return;
  var t=AC.currentTime+(dl||0);
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.03);
}

var ft=0,fn=0,upLock=0;
function govern(ms){
  ft+=ms;fn++;
  if(fn>=50){
    var avg=ft/fn;ft=0;fn=0;
    if(avg>34&&tier>0){tier--;RS=RS_TIERS[tier];ITER=tier>1?CFG.physics.iter:2;resize();}
    else if(avg<15&&tier<2&&upLock-->0){tier++;RS=RS_TIERS[tier];ITER=CFG.physics.iter;resize();}
  }
}

var last=performance.now(),acc=0;
function frame(now){
  var ms=now-last;last=now;
  if(ms>100)ms=100;
  G.time+=ms/1000;
  var ffDiff=G.ffTarget-G.ffCurrent;
  if(Math.abs(ffDiff)>0.01){G.ffCurrent+=ffDiff*(ffDiff>0?CFG.ff.rampUp:CFG.ff.rampDown);}
  else{G.ffCurrent=G.ffTarget;}
  if(G.mode==='play'&&!G.paused){
    if(G.keyDir!==0){
      G.ptr=false;G.tx+=G.keyDir*ms*0.55;
      if(G.tx<20)G.tx=20;
      if(G.tx>W-20)G.tx=W-20;
    }
    acc+=ms*G.ffCurrent;
    var n=0,maxN=Math.ceil(3*G.ffCurrent);
    while(acc>=1000/120&&n<maxN){physics(STEP);acc-=1000/120;n++;}
    if(n>=maxN)acc=0;
    if(G.paddleTouched){
      G.paddleTouched=false;
      if(G.chain>0){G.chain=0;syncHUD();}
    }
    if(G.fx.shoot>0||G.fx.laser>0){
      G.shootT-=ms/1000*G.ffCurrent;
      if(G.shootT<=0){G.shootT=G.fx.laser>0?CFG.fx.laserInterval:CFG.fx.gunInterval;fireBullet();}
    }
    var k;
    for(k in G.fx){
      if(G.fx[k]>0){
        G.fx[k]-=ms/1000*G.ffCurrent;
        if(G.fx[k]<=0){
          G.fx[k]=0;
          if((k==='wide'||k==='narrow')&&!G.fx.wide&&!G.fx.narrow)setPadW(CFG.paddle.width);
        }
      }
    }
    if(G.clearing&&G.time>G.clearAt){
      G.clearing=false;G.level++;
      buildLevel(G.level);syncHUD();
      showBanner(TEXTS.banners.level+' '+G.level,G.patName);
    }
    fxChips();

// stored BEFORE reloading, so the reloaded page compares equal and never
// loops). Offline/file:// hosts: no request at all, never an error. Hosts
