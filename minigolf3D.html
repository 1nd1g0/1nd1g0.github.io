<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140b08">
<title>Putt Canyon DX</title>
<meta name="version" content="2026.11.24.1">
<style>
:root{--ink:#ffe9c9;--dim:#c9a97f;--bg:#140b08;--panel:#241309;--panel2:#33200f;--acc:#ff9a3c;--acc2:#5ad068;--line:#5a3a22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
 font:15px/1.35 "Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.scr,#card,#modal,#hudTop,#hudBotW,#edTop,#edPanel{pointer-events:auto}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
 background:radial-gradient(120% 90% at 50% 20%,rgba(46,24,10,.55),rgba(10,5,3,.82));text-align:center;padding:14px;overflow-y:auto}
.scrIn{margin:auto;display:flex;flex-direction:column;align-items:center;width:100%;padding:10px 0}
h1{margin:0;font-size:min(11vw,58px);letter-spacing:.12em;color:var(--acc);
 text-shadow:0 3px 0 #7a3c10,0 6px 18px rgba(0,0,0,.6)}
.sub{color:var(--dim);letter-spacing:.28em;font-size:12px;margin:4px 0 18px}
.btn{display:block;min-width:min(78vw,300px);margin:6px auto;padding:13px 18px;font:inherit;font-weight:700;
 letter-spacing:.14em;color:var(--ink);background:linear-gradient(#4a2c14,#33200f);border:2px solid var(--line);
 border-radius:12px;cursor:pointer;text-shadow:0 1px 0 #000;text-decoration:none;text-align:center}
.btn:active{transform:translateY(2px);background:linear-gradient(#5a3a1c,#3a2412)}
.btn.acc{border-color:#b4691f;background:linear-gradient(#a35a17,#6f3a0c)}
.btn.grn{border-color:#2c7a3a;background:linear-gradient(#2f8a41,#1d5a2a)}
.btn.sm{padding:8px 10px;font-size:13px;min-width:0;display:inline-block;margin:3px}
.btn.ic{min-width:0;display:inline-block;width:42px;height:34px;padding:5px 0;margin:0;font-size:15px;border-radius:10px}
#hud{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
 padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom))}
#hudTop{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{background:rgba(20,10,5,.72);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13px;letter-spacing:.08em}
.pill b{color:var(--acc)}
#hudBotW{display:flex;flex-direction:column;align-items:center;gap:6px}
#hudBot{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
#hint{background:rgba(20,10,5,.6);border-radius:10px;padding:5px 12px;font-size:12px;color:var(--dim);max-width:92vw;text-align:center;pointer-events:none}
#powRow{display:flex;align-items:center;gap:8px}
#powWrap{width:min(46vw,220px);height:12px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.5);overflow:hidden;margin:0}
#pow{height:100%;width:0%;background:linear-gradient(90deg,#5ad068,#ffd23c,#ff5a3c)}
#powPct{font-size:12px;color:var(--dim);min-width:38px;text-align:left}
#card{position:absolute;inset:0;display:flex;align-items:safe center;justify-content:safe center;overflow-y:auto;background:rgba(8,4,2,.55)}
#cardIn{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:26px 34px;text-align:center;min-width:min(80vw,320px)}
#cardIn h2{margin:0 0 4px;font-size:34px;color:var(--acc);letter-spacing:.1em}
#cardIn p{margin:4px 0 16px;color:var(--dim)}
#toast{position:absolute;top:16%;left:50%;transform:translateX(-50%);background:rgba(20,10,5,.85);
 border:1px solid var(--line);padding:8px 18px;border-radius:12px;font-weight:700;letter-spacing:.1em;
 opacity:0;transition:opacity .25s;white-space:nowrap}
#ed{position:absolute;inset:0;display:flex;flex-direction:column;background:rgba(12,6,3,.35)}
#edTop{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:rgba(15,8,4,.88);border-bottom:1px solid var(--line)}
#edTop input[type=text]{width:130px}
#edPanel{margin-top:auto;background:rgba(20,11,5,.93);border-top:2px solid var(--line);padding:8px;max-height:46vh;overflow:auto}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}
.chip{padding:6px 9px;font-size:12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);cursor:pointer;white-space:nowrap}
.chip.sel{border-color:var(--acc);color:var(--acc)}
.lbl{font-size:11px;color:var(--dim);letter-spacing:.1em;margin:6px 0 2px}
input,select,textarea{font:inherit;color:var(--ink);background:#170d06;border:1px solid var(--line);border-radius:8px;padding:7px 8px;outline:none}
input[type=number]{width:64px}
textarea{width:100%;min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:12px;resize:vertical}
#edList{display:flex;gap:5px;overflow-x:auto;padding:4px 0}
#modal{position:absolute;inset:0;background:rgba(5,2,1,.7);display:flex;align-items:center;justify-content:center;padding:14px}
#mBox{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px;max-width:min(94vw,560px);max-height:88vh;overflow:auto;width:100%}
#mBox h3{margin:0 0 10px;color:var(--acc);letter-spacing:.12em}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;font-size:14px;margin:8px 0}
.kv b{color:var(--acc2)}
#holeGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:10px 0;max-height:46vh;overflow:auto}
.hbtn{padding:8px 0;font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:var(--panel2);
 border:1px solid var(--line);border-radius:8px;cursor:pointer}
.hbtn:active{background:#4a2c14}
.hbtn.lock{opacity:.3;cursor:default}
@media(max-width:640px){
 .kv{grid-template-columns:1fr}
 .btn{min-width:min(88vw,250px);padding:10px 14px;font-size:14px;margin:4px auto;letter-spacing:.08em}
 h1{font-size:min(13vw,46px);letter-spacing:.08em}
 .sub{font-size:10px;margin-bottom:10px;letter-spacing:.2em}
 .pill{font-size:11px;padding:4px 7px}
 .btn.ic{width:38px;height:30px;padding:4px 0;font-size:14px}
 #hint{font-size:11px;padding:4px 10px}
 #powWrap{width:min(56vw,200px);height:10px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="menu" class="scr hide">
    <div class="scrIn">
    <h1>PUTT CANYON</h1>
    <div class="sub" data-t="menuSub">ARCADE MINI-GOLF &middot; OFFLINE 3D</div>
    <button class="btn acc" id="bPlay" data-t="teeOff">TEE OFF</button>
    <button class="btn grn hide" id="bCont" data-t="continue">CONTINUE</button>
    <button class="btn" id="bHoles" data-t="holeSelect">HOLE SELECT</button>
    <button class="btn" id="bCustom" data-t="myCourses">MY COURSES</button>
    <button class="btn" id="bGen" data-t="procRounds">PROCEDURAL ROUNDS</button>
    <button class="btn" id="bEdit" data-t="levelEditor">LEVEL EDITOR</button>
    <button class="btn" id="bHelp" data-t="howToPlay">HOW TO PLAY</button>
    <button class="btn" id="bSet" data-t="settings">SETTINGS</button>
    <button class="btn" id="bHome">🏠 <span data-t="home">HOME</span></button>
    <div class="sub" id="bestLine" style="margin-top:14px"></div>
    </div>
  </div>
  <div id="hud" class="hide">
    <div id="hudTop">
      <span class="pill" id="hudHole"></span><span class="pill" id="hudPar"></span>
      <span class="pill"><span data-t="strokesLbl">STROKES</span> <b id="hudStr">0</b></span><span class="pill"><span data-t="totalLbl">TOTAL</span> <b id="hudTot">0</b></span>
    </div>
    <div id="hudBotW">
      <div id="hint"></div>
      <div id="powRow"><div id="powWrap"><div id="pow"></div></div><span id="powPct">0%</span></div>
      <div id="hudBot">
        <button class="btn ic" id="bUndo" data-tip="tipUndo">↶</button>
        <button class="btn ic" id="bRestart" data-tip="tipRestart">↺</button>
        <button class="btn ic" id="bMute" data-tip="tipSound">♪</button>
        <button class="btn ic" id="bCam" data-tip="tipCam">◎</button>
        <button class="btn ic" id="bHelpHud" data-tip="help">?</button>
        <button class="btn ic" id="bMenu" data-tip="menu">☰</button>
      </div>
    </div>
  </div>
  <div id="card" class="hide"><div id="cardIn"></div></div>
  <div id="ed" class="hide">
    <div id="edTop">
      <button class="btn sm" id="edBack">☰</button>
      <input type="text" id="edName" data-ph="edNamePh" maxlength="40">
      <span class="lbl" data-t="parLbl">PAR</span><input type="number" id="edPar" min="2" max="9" step="1">
      <button class="btn sm grn" id="edTest">▶ <span data-t="edTestLbl">TEST</span></button>
      <button class="btn sm" id="edIO">⇅ <span data-t="edIOLbl">I/O</span></button>
    </div>
    <div id="edPanel">
      <div class="row" id="edTools"></div>
      <div class="lbl" data-t="edParts">PARTS — tap scene to move selected · drag = orbit · two fingers / right-drag = pan</div>
      <div id="edList"></div>
      <div class="row" id="edProps"></div>
      <div class="row">
        <button class="btn sm" id="edDup">⧉ <span data-t="edDupLbl">Dup</span></button><button class="btn sm" id="edDel">🗑 <span data-t="edDelLbl">Del</span></button>
        <button class="btn sm" id="edUp">▲</button><button class="btn sm" id="edDn">▼</button>
        <button class="btn sm" id="edTee" data-t="edTeeLbl">SET TEE</button><button class="btn sm" id="edCup" data-t="edCupLbl">SET CUP</button>
        <button class="btn sm" id="edSeal">🧱 <span data-t="edSealLbl">SEAL</span></button><button class="btn sm" id="edCheck">✓ <span data-t="edCheckLbl">CHECK</span></button>
        <button class="btn sm grn" id="edSave">💾 <span data-t="edSaveLbl">SAVE</span></button>
      </div>
    </div>
  </div>
  <div id="modal" class="hide"><div id="mBox"></div></div>
  <div id="toast"></div>
</div>

/* ============================ utils ============================ */
function $(id){return document.getElementById(id)}
var TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function lerp(a,b,t){return a+(b-a)*t}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}

 var ix,iz,id;

/* ---- plan-driven assembler ---- */
function assembleHole(seed,phase,nFeat,diff,pattern){
 var rng=mulberry(hashStr(seed));

 var legs=pattern.length+1,counts=distribute(nFeat,legs);
 var usedFam={},last='',turns=[],placed=0;
 function commit(b,tt){bCommit(c,b,occ);last=tt;}
 function pickFeat(){
  var pool=featurePool(phase),cands=[],i;
  for(i=0;i<pool.length;i++){var t=pool[i];if(t===last||!featOk(t,c))continue;cands.push(t);}
  if(!cands.length)return null;
  var fresh=[];for(i=0;i<cands.length;i++)if(!usedFam[BMETA[cands[i]].f])fresh.push(cands[i]);
  var from=(fresh.length&&rng()<0.8)?fresh:cands;
  return from[Math.floor(rng()*from.length)];

  var feat=pickFeat();if(!feat)return false;
  var f=bClone(c);BLOCKS[feat](f,rng,diff);

  commit(f,feat);usedFam[BMETA[feat].f]=1;placed++;return true;

  var t=bClone(c);BLOCKS.turn(t,rng,diff,sign);

  commit(t,'turn');turns.push(sign);return true;

 }
 for(var leg=0;leg<legs;leg++){
  for(var k=0;k<counts[leg];k++){if(!placeFeat())placeFeat();}
  if(leg<legs-1){
   var s=pattern[leg];
   if(placeTurn(s)){}
   else if(placeTurn(-s)){}
   else{advance();if(placeTurn(s)){}else if(placeTurn(-s)){}else break;}
  }

 if(turns.length===0){if(!placeTurn(1))placeTurn(-1);}
 var g=bClone(c);BLOCKS.green(g);

  var okG=false;

/* ============================ campaign: unique layouts, no clones ============================ */
function buildExtraCampaign(){

 for(i=0;i<100;i++){
  var phase=i<12?0:i<36?1:i<64?2:3;
  var nFeat=[2,3,4,5][phase]+(i%2);
  var minObs=[1,2,3,3][phase];
  var lv=null,desc=null,fp=0;
  var best=null,bestDesc=null,bestFp=0,bestMinD=-1;
  for(att=0;att<48&&!lv;att++){
   var cand=null;

    var rng=mulberry(hashStr('C'+i+':'+att));

var NA=["Dusty","Crooked","Rusty","Sunny","Echo","Mesa","Cactus","Coyote","Red","Whisper","Broken","Golden"];
var NB=["Run","Bend","Hollow","Ridge","Trail","Gulch","Bluff","Draw","Pass","Arroyo"];
function genLevels(seedStr,count,diff){
 var out=[],roundFps=new Set(),roundDescs=[],prevCls=null,recentCls=[],h,att;
 for(h=0;h<count;h++){
  var phase=clamp(clamp(diff,0,2)+(h%3===2?1:0),0,3);
  var nFeat=[2,3,4,5][phase]+(h%2);
  var minObs=[1,2,3,3][phase];
  var lv=null,desc=null,fp=0,best=null,bestDesc=null,bestFp=0,bestMinD=-1;
  for(att=0;att<48&&!lv;att++){
   var key=String(seedStr)+'#'+h+'#'+att,cand=null;
   try{
    var rng=mulberry(hashStr(key));
    var pattern=makePlan(rng,phase,prevCls,recentCls);
    cand=assembleHole(key,phase,nFeat,phase,pattern);
   }catch(e){cand=null;}
   if(!cand||!Array.isArray(cand.parts))continue;
   var an=safeAnalyze(cand);if(!an.ok)continue;
   var f=layoutFingerprint(cand);
   if(CAMPAIGN_FPS.has(f))continue;
   if(roundFps.has(f))continue;
   var d=trajDesc(an.path);if(!d)continue;
   var minD=minDistToSet(d,roundDescs);
   if(minD>bestMinD){bestMinD=minD;best=cand;bestDesc=d;bestFp=f;}
   if(minD>=0.10&&(cand._placed||0)>=minObs){lv=cand;desc=d;fp=f;break;}
  }
  if(!lv&&best&&!CAMPAIGN_FPS.has(bestFp)&&!roundFps.has(bestFp)){lv=best;desc=bestDesc;fp=bestFp;}
  if(!lv){
   lv=guaranteedHole(h+500);fp=layoutFingerprint(lv);
   var guard=0;
   while((CAMPAIGN_FPS.has(fp)||roundFps.has(fp))&&guard<16){
    guard++;lv=guaranteedHole(h+500+guard*31);fp=layoutFingerprint(lv);}
   var a3=safeAnalyze(lv);desc=a3.ok?trajDesc(a3.path):null;
  }
  roundFps.add(fp);
  if(desc)roundDescs.push(desc);
  prevCls=lv._cls||null;recentCls.push(prevCls);if(recentCls.length>3)recentCls.shift();
  delete lv._cls;delete lv._placed;
  var nr=mulberry(hashStr(String(seedStr)+'#'+h));
  lv.name=NA[Math.floor(nr()*NA.length)]+' '+NB[Math.floor(nr()*NB.length)];
  out.push(lv);
 }
 return out;
}

   if(q.t==='g'){q.y=num(p.y,0);if(p.rail)q.rail=1}
   if(q.t==='q')q.y=num(p.y,-.5)}
  else if(q.t==='r'){q.x=num(p.x,0);q.z=num(p.z,0);q.w=clamp(num(p.w,4),.5,60);q.d=clamp(num(p.d,4),.5,60);
   q.y0=num(p.y0,0);q.y1=num(p.y1,1);q.a=(p.a==='x'?'x':'z')}
  else if(q.t==='w'){q.x=num(p.x,0);q.z=num(p.z,0);q.w=clamp(num(p.w,1),.2,60);q.d=clamp(num(p.d,1),.2,60);
   q.h=clamp(num(p.h,1),.2,8);q.y=num(p.y,0)}

   q.n=clamp(Math.round(num(p.n,4)),1,6);q.w=clamp(num(p.w,.3),.12,1);

function undoShot(){
 if(mode!=='play'&&mode!=='editTest')return;
 if(sinkT>=0||ball.moving||!shotHist.length){toast(TLI18N.t("nothingToUndo"));return}
 var h=shotHist.pop();
 ball.x=h.x;ball.y=h.y;ball.z=h.z;ball.vx=0;ball.vy=0;ball.vz=0;
 ball.gh=topAt(lv.parts,ball.x,ball.z);ball.airT=0;ball.rest=null;

/* ============================ camera / picking ============================ */
function getBallScreenPos(){
 if(!VP)return null;
 var x=ball.x,y=ball.y,z=ball.z;
 var cx=VP[0]*x+VP[4]*y+VP[8]*z+VP[12];
 var cy=VP[1]*x+VP[5]*y+VP[9]*z+VP[13];
 var cw=VP[3]*x+VP[7]*y+VP[11]*z+VP[15];
 if(cw<=.1)return null;
 return{x:(cx/cw+1)*.5*innerWidth,y:(1-cy/cw)*.5*innerHeight}}
function panCamera(dx,dy){
 var sy=Math.sin(cam.yaw),cyw=Math.cos(cam.yaw);
 var sp=Math.sin(cam.pitch),cp=Math.cos(cam.pitch);
 var rx=-cyw,rz=sy,ux=sp*sy,uy=-cp,uz=sp*cyw;
 var k=.0016*cam.dist;
 cam.tx-=(dx*rx-dy*ux)*k;
 cam.ty+=(dy*uy)*k;
 cam.tz-=(dx*rz-dy*uz)*k}
function lookMat(){
 var cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),sy=Math.sin(cam.yaw),cyw=Math.cos(cam.yaw);
 var ex=cam.tx+cam.dist*cp*sy,ey=cam.ty+cam.dist*sp+1,ez=cam.tz+cam.dist*cp*cyw;
 var fx=cam.tx-ex,fy=cam.ty-ey,fz=cam.tz-ez;
 var fl=Math.hypot(fx,fy,fz)||1;fx/=fl;fy/=fl;fz/=fl;
 var rx=-fz,rz=fx,rl=Math.hypot(rx,rz)||1;rx/=rl;rz/=rl;
 var ux=-rz*fy,uy=rz*fx-rx*fz,uz=rx*fy;
 return[rx,ux,-fx,0, 0,uy,-fy,0, rz,uz,-fz,0,
  -(rx*ex+rz*ez),-(ux*ex+uy*ey+uz*ez),fx*ex+fy*ey+fz*ez,1]}
function screenRay(px,py){
 var inv=mInv(VP);
 var sx=px/VW*2-1,sy=1-py/VH*2;
 function tr(zz){return[inv[0]*sx+inv[4]*sy+inv[8]*zz+inv[12],
  inv[1]*sx+inv[5]*sy+inv[9]*zz+inv[13],
  inv[2]*sx+inv[6]*sy+inv[10]*zz+inv[14],
  inv[3]*sx+inv[7]*sy+inv[11]*zz+inv[15]]}
 var p0=tr(-1),p1=tr(1);
 var v=[p0[0]/p0[3],p0[1]/p0[3],p0[2]/p0[3]],w2=[p1[0]/p1[3],p1[1]/p1[3],p1[2]/p1[3]];
 return{o:v,d:[w2[0]-v[0],w2[1]-v[1],w2[2]-v[2]]}}
function rayY(cssX,cssY,yy){
 if(!VP)return null;
 var r=screenRay(cssX*(VW/innerWidth),cssY*(VH/innerHeight));
 if(Math.abs(r.d[1])<1e-5)return null;
 var t=(yy-r.o[1])/r.d[1];if(t<0)return null;
 return[r.o[0]+r.d[0]*t,r.o[2]+r.d[2]*t]}
/* Power curve: 8px dead-zone, gentle low end so feather-light taps register. */
function computeAim(){
 if(!drag||drag.orbit||drag.pan)return null;
 var dx=drag.cx-drag.x0,dy=drag.cy-drag.y0,len=Math.hypot(dx,dy);
 if(len<8)return{pow:0};
 var maxLen=Math.min(innerWidth,innerHeight)*.42;
 var pow=clamp((len-8)/Math.max(20,maxLen-8),0,1);
 var fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw),rx=-fz,rz=fx;
 var wx=rx*(-dx)+fx*dy,wz=rz*(-dx)+fz*dy;
 var wl=Math.hypot(wx,wz)||1;
 return{pow:pow,dx:wx/wl,dz:wz/wl,spd:1.8+13.7*Math.pow(pow,1.25)}}
function releaseShot(){
 if(!drag||drag.orbit||drag.pan)return false;
 aim=computeAim();
 if(!aim||aim.pow<=0)return false;
 if(sinkT>=0||!round||lockT>0||ball.moving)return false;
 shotHist.push({x:ball.x,y:ball.y,z:ball.z,s:strokes});
 if(shotHist.length>24)shotHist.shift();
 shotOrigin={x:ball.x,y:ball.y,z:ball.z};
 ball.vx=aim.dx*aim.spd;ball.vz=aim.dz*aim.spd;ball.vy=.3;
 ball.moving=true;strokes++;updateHUD();AU.putt(aim.pow);
 return true}
function buildPreview(){
 var a=computeAim();
 if(!a||a.pow<=0){dotArr=new Float32Array(0);return}
 var pts=[],i;
 var gy=topAt(lv.parts,ball.x,ball.z);
 for(i=1;i<=5;i++){var tb=i/5*1.3*a.pow;
  pts.push(ball.x-a.dx*tb,gy+.06,ball.z-a.dz*tb)}
 var st={x:ball.x,y:ball.y,z:ball.z,vx:a.dx*a.spd,vy:.3,vz:a.dz*a.spd,gh:ball.y-R_BALL,airT:0};
 var mills=[];
 for(i=0;i<course.mills.length;i++){var m0=course.mills[i];
  mills.push({x:m0.x,z:m0.z,r:m0.r,n:m0.n,w:m0.w,s:m0.s,hub:m0.hub,bh:m0.bh,ang:m0.ang})}
 var fx={},sample=0;
 for(i=0;i<720;i++){
  physStep(st,lv,STEP,mills,fx);
  for(var k=0;k<mills.length;k++)mills[k].ang=(mills[k].ang+mills[k].s*STEP)%TAU;
  if(fx.water||fx.oob||fx.sink){pts.push(st.x,st.y,st.z);break}
  if((sample+=STEP)>=.05){sample=0;pts.push(st.x,st.y,st.z)}
  var spd=Math.hypot(st.vx,st.vz);
  if(i>24&&spd<=.12&&Math.abs(st.vy)<=.2&&st.airT<=.25)break}
 dotArr=new Float32Array(pts);updMesh(dotBuf,dotArr)}
var previewAcc=0;

/* ============================ render ============================ */
function render(){
 gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 if(!course||!lv)return;
 VP=mMul(mPersp(55*Math.PI/180,VW/VH,.5,260),lookMat());
 gl.useProgram(PM);
 gl.uniformMatrix4fv(LU.uVP,false,new Float32Array(VP));
 gl.uniform3f(LU.uL,.45,.8,.35);
 gl.uniformMatrix4fv(LU.uM,false,new Float32Array(mIdent()));
 bindMain(course.opaque);gl.drawArrays(gl.TRIANGLES,0,course.opaque.n);
 if(mode==='play'||mode==='editTest'){
  var by=ball.y;
  if(sinkT>=0){var cy0=topAt(lv.parts,lv.cup[0],lv.cup[1]);
   by=lerp(ball.y,Math.max(cy0-.5,-2),Math.min(1,sinkT))}
  gl.uniformMatrix4fv(LU.uM,false,new Float32Array(mMul(mTrans(ball.x,by,ball.z),mScale(R_BALL,R_BALL,R_BALL))));
  bindMain(meshBall);gl.drawArrays(gl.TRIANGLES,0,meshBall.n)}
 var i,b;
 for(i=0;i<course.mills.length;i++){var m=course.mills[i];
  var hubY=topAt(lv.parts,m.x,m.z)+(m.hub||.55);
  for(b=0;b<m.n;b++){
   var a=m.ang+b*TAU/m.n;
   var mod=mMul(mMul(mTrans(m.x,hubY,m.z),mRotY(-a)),mScale(m.r,m.bh,m.w));
   gl.uniformMatrix4fv(LU.uM,false,new Float32Array(mod));
   bindMain(meshBlade);gl.drawArrays(gl.TRIANGLES,0,meshBlade.n)}}
 gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
 gl.uniformMatrix4fv(LU.uM,false,new Float32Array(mIdent()));
 if(course.water.n){bindMain(course.water);gl.drawArrays(gl.TRIANGLES,0,course.water.n)}
 if(mode==='play'||mode==='editTest'){
  var gy=topAt(lv.parts,ball.x,ball.z,true);
  if(gy!==null){
   var sc=R_BALL*1.6*clamp(1.6-(ball.y-gy),.5,1.6);
   gl.uniformMatrix4fv(LU.uM,false,new Float32Array(mMul(mTrans(ball.x,gy+.08,ball.z),mScale(sc,1,sc))));
   bindMain(meshShadow);gl.drawArrays(gl.TRIANGLES,0,meshShadow.n)}}
 if(dotArr.length){
  gl.useProgram(PD);
  gl.uniformMatrix4fv(DU.uVP,false,new Float32Array(VP));
  gl.uniform1f(DU.uS,VH*.9);gl.uniform4f(DU.uCol,1,1,1,.9);
  gl.bindBuffer(gl.ARRAY_BUFFER,dotBuf.b);
  gl.enableVertexAttribArray(DU.aP);gl.vertexAttribPointer(DU.aP,3,gl.FLOAT,false,12,0);
  gl.drawArrays(gl.POINTS,0,dotArr.length/3);
  gl.disableVertexAttribArray(DU.aP);gl.useProgram(PM)}
 gl.depthMask(true);gl.disable(gl.BLEND)}

/* ============================ main loop ============================ */
var lastT=0;
function frame(t){
 requestAnimationFrame(frame);
 var dt=Math.min((t-lastT)/1000||.016,.05);lastT=t;
 if(settings.q===0&&(mode==='play'||mode==='editTest')){
  perfEMA=perfEMA?perfEMA*.95+dt*.05:dt;perfT+=dt;
  if(perfT>2.5){perfT=0;
   if(perfEMA>.034&&autoScale>.4){autoScale*=.8;resize()}
   else if(perfEMA<.02&&autoScale<1){autoScale=Math.min(1,autoScale*1.1);resize()}}}
 if((mode==='play'||mode==='editTest')&&round&&lv){
  lockT-=dt;
  if(sinkT<0&&lockT<=0&&!drag){
   acc+=dt;var n=0;
   while(acc>STEP&&n<8){acc-=STEP;n++;
    var fx={};
    physStep(ball,lv,STEP,course.mills,fx);
    physEvents(fx);
    if(fx.water||fx.oob||fx.sink){acc=0;break}}}
  var spd=Math.hypot(ball.vx,ball.vz);
  var moving=spd>.12||Math.abs(ball.vy)>.2||ball.airT>.25;
  if(!moving)ball.rest={x:ball.x,y:ball.y,z:ball.z};
  ball.moving=moving||sinkT>=0;
  for(var i=0;i<course.mills.length;i++){var m=course.mills[i];m.ang=(m.ang+m.s*dt)%TAU}
  cam.tx+=(ball.x-cam.tx)*Math.min(1,dt*6);
  cam.ty+=(ball.y-cam.ty)*Math.min(1,dt*6);
  cam.tz+=(ball.z-cam.tz)*Math.min(1,dt*6);
  if(drag&&!drag.orbit&&!drag.pan&&(previewAcc-=dt)<=0){previewAcc=.08;buildPreview()}}
 else if(mode==='edit'&&course){
  for(var j=0;j<course.mills.length;j++){var m2=course.mills[j];m2.ang=(m2.ang+(m2.s||1.5)*dt)%TAU}}
 else if(mode==='menu')cam.yaw+=dt*.06;
 if(sinkT>=0)sinkT+=dt*2.2;
 var pw=0;
 if(drag&&!drag.orbit&&!drag.pan){var aa=computeAim();if(aa)pw=aa.pow}
 $('pow').style.width=Math.round(pw*100)+'%';
 $('powPct').textContent=Math.round(pw*100)+'%';
 $('bUndo').style.opacity=shotHist.length&&sinkT<0?'1':'.4';
 render()}
requestAnimationFrame(frame);

/* ============================ input ============================ */
var ptrs=new Map();
var twoF=false,pinch0=1,dist0=13,lastMid=null;
cv.addEventListener('contextmenu',function(e){e.preventDefault()});
function pDown(id,x,y,btn){
 ptrs.set(id,{x:x,y:y,sx:x,sy:y,t:performance.now(),btn:btn});
 if(ptrs.size===2){
  twoF=true;drag=null;aim=null;dotArr=new Float32Array(0);
  var a=[];ptrs.forEach(function(p){a.push(p)});
  pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;dist0=cam.dist;
  lastMid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}
 else if(ptrs.size===1){
  if(btn===2){drag={x0:x,y0:y,cx:x,cy:y,id:id,orbit:false,pan:true};lastMid={x:x,y:y}}
  else{
   var canAim=(mode==='play'||mode==='editTest')&&round&&sinkT<0&&lockT<=0&&!ball.moving;
   var bsp=getBallScreenPos();
   var nearBall=bsp&&Math.hypot(x-bsp.x,y-bsp.y)<90;
   if(canAim&&nearBall)drag={x0:x,y0:y,cx:x,cy:y,id:id,orbit:false,pan:false};
   else drag={x0:x,y0:y,cx:x,cy:y,id:id,orbit:true,pan:false,yaw0:cam.yaw,pit0:cam.pitch}}}}
function pMove(id,x,y){
 var p=ptrs.get(id);if(!p)return;
 p.x=x;p.y=y;
 if(twoF&&ptrs.size>=2){
  var a=[];ptrs.forEach(function(q){a.push(q)});
  var d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
  cam.dist=clamp(dist0*pinch0/d,5,45);
  var mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;
  if(lastMid)panCamera(mx-lastMid.x,my-lastMid.y);
  lastMid={x:mx,y:my};return}
 if(!drag||drag.id!==id)return;
 drag.cx=x;drag.cy=y;
 if(drag.pan){panCamera(x-lastMid.x,y-lastMid.y);lastMid={x:x,y:y}}
 else if(drag.orbit){
  cam.yaw=drag.yaw0-(x-drag.x0)*.008;
  cam.pitch=clamp(drag.pit0+(y-drag.y0)*.005,.18,1.25)}
 else aim=computeAim()}
function pUp(id){
 var p=ptrs.get(id);
 ptrs.delete(id);
 if(ptrs.size<2){twoF=false;lastMid=null}
 if(!drag||drag.id!==id)return;
 var dtms=p?performance.now()-p.t:999,dist=p?Math.hypot(p.x-p.sx,p.y-p.sy):999;
 var isTap=dtms<350&&dist<9;
 if(p){drag.cx=p.x;drag.cy=p.y}
 if(mode==='edit'&&isTap&&p)editorTap(p.x,p.y);
 else if((mode==='play'||mode==='editTest')&&!drag.orbit&&!drag.pan){
  releaseShot()}
 drag=null;aim=null;dotArr=new Float32Array(0)}
if(window.PointerEvent){
 cv.addEventListener('pointerdown',function(e){e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  pDown(e.pointerId,e.clientX,e.clientY,e.button)});
 cv.addEventListener('pointermove',function(e){pMove(e.pointerId,e.clientX,e.clientY)});
 cv.addEventListener('pointerup',function(e){pUp(e.pointerId)});
 cv.addEventListener('pointercancel',function(e){
  var p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);
  if(ptrs.size<2){twoF=false;lastMid=null}
  if(drag&&drag.id===e.pointerId){drag=null;aim=null;dotArr=new Float32Array(0)}});
 document.addEventListener('pointerdown',function(){AU.init()},{passive:true});
}else{
 cv.addEventListener('mousedown',function(e){e.preventDefault();pDown('m',e.clientX,e.clientY,e.button)});
 addEventListener('mousemove',function(e){pMove('m',e.clientX,e.clientY)});
 addEventListener('mouseup',function(e){pUp('m')});
 cv.addEventListener('touchstart',function(e){e.preventDefault();AU.init();
  for(var i=0;i<e.changedTouches.length;i++){var tc=e.changedTouches[i];
   pDown('t'+tc.identifier,tc.clientX,tc.clientY,0)}},{passive:false});
 cv.addEventListener('touchmove',function(e){e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){var tc=e.changedTouches[i];
   pMove('t'+tc.identifier,tc.clientX,tc.clientY)}},{passive:false});
 var tEnd=function(e){for(var i=0;i<e.changedTouches.length;i++)pUp('t'+e.changedTouches[i].identifier)};
 cv.addEventListener('touchend',tEnd);
 cv.addEventListener('touchcancel',tEnd);
 document.addEventListener('touchstart',function(){AU.init()},{passive:true});
 document.addEventListener('mousedown',function(){AU.init()},{passive:true});
}

addEventListener('keydown',function(e){

/* guide.js — the one first-run tutorial card set every page shares.

   A game publishes its guide through `window.TLGC` (a src module at the end
   of the game block, so it sees the game's own scope):

     TLGC = {
       id:    "tetris",                       // localStorage key: tlg_<id>
       head:  "HOW TO PLAY",                  // optional card header; pass an
                                             // object {en:,es:,pt:,ru:,zh:} to
                                             // translate it with the page
       steps: [["move","MOVE","Arrows or WASD slide the stack."], ...],
       L:     {es:[["MOVE","..."],...], pt:[...], ru:[...], zh:[...]},
                                             // same order as steps; rows may be
                                             // [title,text] — the icon rides
                                             // from the English row
       mount: ["#options-screen", ["#pauseOv .panel","menu-btn"]],
       cls:   "menu-btn",                     // default class for the GUIDE buttons
       t:     fn,                             // optional: returns L('next') etc, or null
       playing: fn, pause: fn, resume: fn     // optional gameplay freeze hooks
     }

   The engine mounts a GUIDE button into every menu the game lists (title AND
   pause — a page may repeat), and on first visit (never seen, keys not touched)
   runs the card set once, freezing gameplay through the hooks while it reads.
   SKIP ends the run instantly; any end records "seen", which switches the
   auto-run off for good. The mounted GUIDE button is the manual re-entry: it
   replays the cards (that IS the manual re-enable — it also re-arms auto for
   the next visit), and every finished run disarms it again.

   The cards are pure DOM: scrim + panel + inline-SVG pictograms + short text,
   styled from this file. No images, no fonts, no requests — the shipped page
   stays a single file. The overlay swallows every pointer/touch, so a title
   screen that starts on any tap cannot fire through it — by stopping
   propagation and absorbing the synthesized click, never by cancelling the
   touch start itself (a cancelled start synthesizes no click and the buttons
   go dead on touch — see _shared/CODEX.md). Buttons stop their own pointerdown
   too, for the same reason.                                */
(function () {
  if (window.TLG) return;
  var cfg = window.TLGC;
  if (!cfg || !cfg.steps || !cfg.steps.length) return;
  var KEY = "tlg_" + (cfg.id || "game");
  var run = false, idx = 0, froze = false, ov = null, queued = 0;
  var btns = [];

  function seen() { try { return !!JSON.parse(localStorage.getItem(KEY) || "0").s } catch (e) { return true } }
  function markSeen() { try { localStorage.setItem(KEY, JSON.stringify({ s: 1 })) } catch (e) {} }
  /* the hub's five languages; <html lang> is what every page's i18n flips */
  function curlang() {
    var l = (document.documentElement.lang || "").toLowerCase();
    for (var i = 0; i < LANGS.length; i++) if (l.indexOf(LANGS[i]) === 0) return LANGS[i];
    return "en";
  }
  var LANGS = ["en", "es", "pt", "ru", "zh"];

/* fs.js — the one fullscreen control every page shares.

      title panel using that page's own button class; `TLFS.mount()` alone floats a
      small icon button in the bottom-right corner; `{icon:true}` swaps the word for
      a ⤢ glyph and moves it into `aria-label` for narrow hosts. The wording is the
      shared translation key `fullscreen` / `exitFullscreen` — from the i18n kit, from
      a page table published through `TLFS_LABEL(key)`, or English as the floor — and
      a change of `<html lang>` repaints it. Where the Fullscreen API is missing the
      button hides itself instead of lying.

      orientation flip, and a mobile browser bar hiding or showing all change the
      area the game has to fill — and the bar case does not always fire a plain
      `resize`. This file listens to `fullscreenchange` (all vendor spellings) and
      to `visualViewport.resize`, then re-applies `<html data-fs>` and dispatches
      `resize` (plus `orientationchange`) once per frame, so the page's own layout
      code runs. `TLFS.refitOnly()` gives a page that already has its own
      fullscreen button just that wiring, without a second button.

      leaving the page. A page whose own history walk lands below the sentinel
