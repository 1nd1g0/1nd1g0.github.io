<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04050c">
<title>3D Arcade Pinball DX</title>
<style>
  html,body{height:100%;margin:0;overflow:hidden;background:#04050c;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:'Segoe UI',system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 0%,#0b1030 0%,#04050c 60%)}
  #stage{position:relative}
  canvas{display:block;background:#000;box-shadow:0 0 40px rgba(30,80,255,.35),0 0 4px rgba(0,255,255,.5)}
  #hud{position:absolute;left:0;top:0;right:0;display:flex;align-items:center;gap:8px;
    padding:calc(4px + env(safe-area-inset-top)) 8px 6px;z-index:5;
    background:linear-gradient(180deg,rgba(2,4,18,.92),rgba(2,4,18,.55) 75%,transparent)}
  .hg{display:flex;flex-direction:column;line-height:1.05;min-width:0}
  .hg .l{font-size:9px;letter-spacing:1px;color:#4be1ff;opacity:.85}
  .hg .v{font-family:'Courier New',monospace;font-weight:700;color:#ffb32b;
    text-shadow:0 0 8px rgba(255,150,0,.8);font-size:15px;white-space:nowrap}
  #hScore{font-size:18px}
  .sp{flex:1}
  .hbtn{pointer-events:auto;background:rgba(0,255,255,.08);border:1px solid rgba(0,255,255,.4);
    color:#7df3ff;border-radius:8px;font-size:14px;width:34px;height:30px;line-height:1}
  .hbtn:active{background:rgba(0,255,255,.3)}
  #msg{position:absolute;left:0;right:0;top:24%;text-align:center;z-index:6;pointer-events:none;
    font-weight:900;font-size:clamp(20px,6vmin,42px);letter-spacing:2px;color:#fff;opacity:0;
    text-shadow:0 0 12px #0ff,0 0 30px #f0f,0 2px 2px #000}
  #msg.show{animation:pop 1.3s ease-out forwards}
  #msg.big{font-size:clamp(28px,9vmin,60px)}
  @keyframes pop{0%{opacity:0;transform:scale(.4)}10%{opacity:1;transform:scale(1.1)}
    20%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
  #overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;color:#cfeaff;background:rgba(3,5,16,.86);padding:12px}
  #overlay.hidden{display:none}
  #overlay h1{margin:0;font-size:clamp(26px,8vmin,54px);letter-spacing:3px;color:#fff;
    text-shadow:0 0 10px #0ff,0 0 30px #08f,0 0 60px #f0f}
  #overlay h2{margin:4px 0 14px;font-weight:400;color:#ff5fd0;text-shadow:0 0 12px #f0f;font-size:clamp(12px,3vmin,18px)}
  #overlay .ctl{font-size:clamp(11px,2.8vmin,14px);line-height:1.8;color:#8fb8ff;margin-bottom:14px}
  #overlay .ctl b{color:#ffe27a}
  #overlay .coin{font-weight:900;font-size:clamp(14px,4vmin,22px);color:#ffe27a;letter-spacing:2px;
    text-shadow:0 0 14px rgba(255,200,0,.9);animation:blink 1s steps(2) infinite}
  #overlay .hi{margin-top:12px;color:#7df3ff;font-size:13px}
  @keyframes blink{50%{opacity:.15}}
  #touchUI{position:absolute;inset:0;z-index:8;pointer-events:none;transition:opacity .35s}
  #touchUI.hidden{opacity:0}
  #touchUI.hidden .tbtn{pointer-events:none}
  .tbtn{pointer-events:auto;position:absolute;display:flex;align-items:center;justify-content:center;
    border-radius:18px;color:#9ff;font-size:30px;transition:transform .06s,background .1s}
  .tbtn:active{transform:scale(.96)}
  #btnL{left:6px;bottom:8px;width:37%;height:112px;background:rgba(0,255,255,.09);border:1px solid rgba(0,255,255,.4)}
  #btnL:active{background:rgba(0,255,255,.3)}
  #btnR{right:6px;bottom:8px;width:37%;height:112px;background:rgba(255,0,255,.09);border:1px solid rgba(255,0,255,.4);color:#f9f}
  #btnR:active{background:rgba(255,0,255,.3)}
  #btnSave{left:50%;transform:translateX(-50%);bottom:8px;width:24%;height:112px;border-radius:14px;
    background:rgba(80,255,120,.10);border:1px solid rgba(80,255,120,.5);color:#bfffb0;
    font-size:12px;font-weight:700;letter-spacing:1px}
  #btnSave:active{transform:translateX(-50%) scale(.96);background:rgba(80,255,120,.35)}
  #btnLaunch{right:12px;bottom:132px;width:64px;height:64px;border-radius:50%;font-size:11px;font-weight:700;
    letter-spacing:1px;color:#ffb3b3;background:rgba(255,60,60,.14);border:1px solid rgba(255,90,90,.55)}
  #btnLaunch:active{background:rgba(255,60,60,.45)}
  #btnNudge{left:12px;bottom:132px;width:64px;height:44px;font-size:11px;letter-spacing:1px;
    color:#ffe9a0;background:rgba(255,220,80,.10);border:1px solid rgba(255,220,80,.45)}
  #keysBar{position:absolute;bottom:2px;left:0;right:0;text-align:center;z-index:4;pointer-events:none;
    font-size:11px;color:#5f7fb8;letter-spacing:.5px;text-shadow:0 1px 2px #000}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="hg"><span class="l">SCORE</span><span class="v" id="hScore">0</span></div>
      <div class="hg"><span class="l">BALLS</span><span class="v" id="hBalls">3</span></div>
      <div class="hg"><span class="l">LEVEL</span><span class="v" id="hLevel">1</span></div>
      <div class="hg"><span class="l">TARGETS</span><span class="v" id="hTgt">4</span></div>
      <div class="hg"><span class="l">MULT</span><span class="v" id="hMult">x1</span></div>
      <div class="sp"></div>
      <button class="hbtn" id="btnMusic">&#9835;</button>
      <button class="hbtn" id="btnPause">&#10074;&#10074;</button>
      <button class="hbtn" id="btnNew">&#10227;</button>
    </div>

    <div id="msg"></div>

    <div id="touchUI" class="hidden">
      <div class="tbtn" id="btnL">&#9664;</div>
      <div class="tbtn" id="btnSave">SAVE</div>
      <div class="tbtn" id="btnR">&#9654;</div>
      <div class="tbtn" id="btnLaunch">PULL</div>
      <div class="tbtn" id="btnNudge">NUDGE</div>
    </div>

    <div id="keysBar">A/&larr; left &nbsp; D/&rarr; right &nbsp; SPACE launch &nbsp; K/&darr; save-kick &nbsp; &uarr; nudge &nbsp; N new &nbsp; M music &nbsp; P pause</div>

    <div id="overlay"></div>
  </div>
</div>

<script>
(function(){'use strict';
/* ================= helpers ================= */
const el=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= config ================= */
const LW=540,LH=960,R=11,GRAV=1150,REST=0.45,STEP=1/120,VMAX=1500;
const FL={px:168,py:812,len:86,rest:0.48,fire:-0.55,a:0.48,w:0,pressed:false};
const FR={px:372,py:812,len:86,rest:Math.PI-0.48,fire:Math.PI+0.55,a:Math.PI-0.48,w:0,pressed:false};
const FWSPD=30,RWSPD=13,FRAD=9;
const QUAL=[{ps:.8,parts:24,trail:false,glow:false},{ps:1.15,parts:60,trail:true,glow:true},
            {ps:1.7,parts:120,trail:true,glow:true}];
let view={q:2,k:1,cw:0,ch:0,cssW:0,cssH:0};
const isCoarse=window.matchMedia&&matchMedia('(pointer: coarse)').matches;
(function(){const low=(navigator.deviceMemory&&navigator.deviceMemory<=2)||
  (navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=3);
  view.q=low?0:(isCoarse?1:2);})();

/* ================= table geometry =================
   FIX: right deflector now spans lane-wall -> sling top (480,566)->(440,640).
   It no longer crosses the shooter lane (ball was sealed in at start), and it
   seals the top of the right outlane channel so balls can no longer fall into
   an un-flippable death chute: they are funnelled onto the sling / inlane.   */
const segs=[];
function S(x1,y1,x2,y2,type){segs.push({x1,y1,x2,y2,type:type||'wall',drop:false,cool:0});}
for(let i=0;i<18;i++){const a1=Math.PI*(1-i/18),a2=Math.PI*(1-(i+1)/18);
  S(270+240*Math.cos(a1),340-240*Math.sin(a1),270+240*Math.cos(a2),340-240*Math.sin(a2));}
S(30,340,30,880);            // left outer wall
S(510,340,510,940);          // right outer wall
S(480,940,480,432);          // shooter lane wall
S(480,890,510,890);          // lane floor
const GATE={x1:480,y1:432,x2:510,y2:408,type:'gate'};segs.push(GATE);
S(30,566,100,640);           // left deflector (outer wall -> sling top)
S(480,566,440,640);          // right deflector (lane wall -> sling top)  [FIXED]
S(100,640,100,770);S(100,770,168,770);S(168,770,100,640,'sling');
S(440,640,440,770);S(440,770,372,770);S(372,770,440,640,'sling');
S(168,770,168,812);S(372,770,372,812);
S(230,118,230,180);S(310,118,310,180);
const TD=(function(){const ax=80,ay=420,bx=150,by=520,dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy),
  ux=dx/L,uy=dy/L,nx=0.819,ny=-0.573,out=[];
  S(ax-nx*8,ay-ny*8,bx-nx*8,by-ny*8,'backing');
  for(let i=0;i<4;i++){const t0=4+i*30;
    out.push({x1:ax+ux*t0,y1:ay+uy*t0,x2:ax+ux*(t0+24),y2:ay+uy*(t0+24),hit:false,hitT:-9});}
  return out;})();
S(398,470,432,540,'standup');
S(404,552,430,604,'standup');   // [FIXED] moved: no wedge-gap vs deflector
const bumpers=[{x:175,y:295,r:26,hitT:-9},{x:340,y:285,r:26,hitT:-9},{x:255,y:408,r:26,hitT:-9}];
const lanes=[{x:185,y:160,lit:false,cool:0},{x:270,y:145,lit:false,cool:0},{x:355,y:160,lit:false,cool:0}];
const SPIN={x:120,y:240,r:24,a:0,vel:0,cool:0};

/* ================= game state ================= */
let state='menu',paused=false;
let score=0,ballsLeft=3,level=1,mult=1,combo=0,comboT=0;
let balls=[],parts=[],charge=0,charging=false;
let saveT=0,skillLane=-1,skillT=0,multiballUsed=false,lanesDone=0;
let nudges=[],tilted=false,shakeT=0,now=0,hiScore=+(localStorage.getItem('pin_hi')||0);
let saves=2,rescueCool=0;                 // [NEW] save-kicker charges
let lastBumpSfx=0,lastWallSfx=0;

function targetsLeft(){let n=0;TD.forEach(t=>{if(!t.hit)n++});return n;}
function resetTargets(){TD.forEach(t=>t.hit=false);}
function hud(){el('hScore').textContent=score.toLocaleString();el('hBalls').textContent=ballsLeft;
  el('hLevel').textContent=level;el('hTgt').textContent=targetsLeft();
  el('hMult').textContent='x'+mult;el('hMult').style.color=mult>1?'#ff5fd0':'#ffb32b';}
let msgTO=0;
function say(txt,big,dur){const m=el('msg');m.textContent=txt;m.className='';void m.offsetWidth;
  m.className='show'+(big?' big':'');clearTimeout(msgTO);msgTO=setTimeout(()=>m.className='',dur||1300);}
function addScore(base,label){combo++;comboT=2;mult=1+Math.min(5,(combo/5)|0);
  const v=base*mult;score+=v;hud();if(label)say(label+(mult>1?'  x'+mult:''));return v;}
function burst(x,y,c,n,sp){const cap=QUAL[view.q].parts;
  for(let i=0;i<n&&parts.length<cap;i++){const a=rand(0,6.28),s=rand(.3,1)*sp;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,t:0,life:rand(.3,.7),c});}}

/* ================= audio ================= */
const AU={ctx:null,sfxG:null,musG:null,noiseBuf:null,dly:null,on:true,chargeO:null,
init(){if(this.ctx)return;try{const A=this.ctx=new (window.AudioContext||window.webkitAudioContext)();
  const m=A.createGain();m.gain.value=.85;m.connect(A.destination);
  this.sfxG=A.createGain();this.sfxG.gain.value=.9;this.sfxG.connect(m);
  this.musG=A.createGain();this.musG.gain.value=.4;this.musG.connect(m);
  const nb=A.createBuffer(1,A.sampleRate,A.sampleRate),d=nb.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.noiseBuf=nb;
  this.dly=A.createDelay(.6);this.dly.delayTime.value=.28;
  const fb=A.createGain();fb.gain.value=.3;this.dly.connect(fb);fb.connect(this.dly);
  const wet=A.createGain();wet.gain.value=.35;this.dly.connect(wet);wet.connect(this.musG);
  MUS.next=A.currentTime+.1;setInterval(()=>MUS.tick(),40);
  if(A.state==='suspended')A.resume().catch(()=>{});}catch(e){}},
resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});},
tone(f,dur,type,g,f2,when,dest){const A=this.ctx;if(!A)return;const t=when||A.currentTime;
  const o=A.createOscillator(),v=A.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.006);
  v.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(v);v.connect(dest||this.sfxG);o.start(t);o.stop(t+dur+.06);},
noise(dur,g,ft,fq,q,when){const A=this.ctx;if(!A)return;const t=when||A.currentTime;
  const s=A.createBufferSource();s.buffer=this.noiseBuf;s.loop=true;
  const f=A.createBiquadFilter();f.type=ft;f.frequency.value=fq;f.Q.value=q||1;
  const v=A.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(f);f.connect(v);v.connect(this.sfxG);s.start(t);s.stop(t+dur+.05);},
flip(){this.tone(150,.05,'square',.22,70);this.noise(.03,.12,'highpass',2500,1);},
bump(){this.tone(280+rand(-30,30),.09,'sine',.5,95);this.noise(.05,.25,'bandpass',900,2);},
sling(){this.tone(430,.07,'triangle',.4,140);this.noise(.04,.18,'bandpass',1400,2);},
wall(v){if(now-lastWallSfx<.05)return;lastWallSfx=now;this.noise(.04,clamp(v/3000,.03,.2),'lowpass',500,1);},
target(){this.tone(1244,.16,'square',.14);this.tone(1864,.14,'square',.09);this.noise(.03,.1,'highpass',4000,1);},
stand(){this.tone(660,.12,'triangle',.3,520);},
roll(){this.tone(880,.09,'sine',.25);this.tone(1318,.08,'sine',.15,0,this.ctx.currentTime+.06);},
skill(){[880,1108,1318,1760].forEach((f,i)=>this.tone(f,.15,'square',.16,0,this.ctx.currentTime+i*.07));},
fanfare(){[523,659,784,1046].forEach((f,i)=>this.tone(f,.2,'square',.2,0,this.ctx.currentTime+i*.09));},
multiball(){[392,523,659,784,1046,1318].forEach((f,i)=>this.tone(f,.22,'sawtooth',.12,0,this.ctx.currentTime+i*.08));
  this.noise(.5,.2,'lowpass',900,1);},
launch(){this.noise(.3,.4,'bandpass',600,.7);this.tone(220,.3,'sine',.5,60);},
kick(){this.tone(160,.25,'square',.4,60);this.noise(.15,.3,'bandpass',500,1);},   // [NEW]
drain(){this.tone(220,.25,'sawtooth',.3,110);this.tone(110,.4,'sawtooth',.25,55,this.ctx?this.ctx.currentTime+.2:0);},
tiltS(){this.tone(110,.6,'square',.3,108);},
over(){[440,349,293,220].forEach((f,i)=>this.tone(f,.3,'triangle',.25,0,this.ctx.currentTime+i*.18));},
levelup(){[523,659,784,1046,1318].forEach((f,i)=>this.tone(f,.14,'triangle',.22,0,this.ctx.currentTime+i*.06));},
chargeStart(){const A=this.ctx;if(!A||this.chargeO)return;const o=A.createOscillator(),v=A.createGain();
  o.type='sawtooth';o.frequency.value=70;v.gain.value=.08;o.connect(v);v.connect(this.sfxG);
  o.start();this.chargeO={o,v};},
chargeSet(p){if(this.chargeO)this.chargeO.o.frequency.setTargetAtTime(70+p*380,this.ctx.currentTime,.05);},
chargeEnd(){if(this.chargeO){const c=this.chargeO;c.v.gain.setTargetAtTime(0,this.ctx.currentTime,.02);
  c.o.stop(this.ctx.currentTime+.15);this.chargeO=null;}}
};
const PENT=[440,523.25,587.33,659.25,783.99,880,1046.5,1318.51];
const PROG=[{root:110,pad:[220,261.63,329.63]},{root:87.31,pad:[174.61,220,261.63]},
            {root:130.81,pad:[261.63,329.63,392]},{root:98,pad:[196,246.94,293.66]}];
const MUS={bpm:118,idx:0,next:0,intensity:0,melody:[],seed:1,
regen(seed){this.seed=seed;const rng=mulberry32(seed);this.melody=[];let ix=3;
  for(let i=0;i<32;i++){if(rng()<.72){ix=clamp(ix+((rng()*5)|0)-2,0,7);this.melody.push(ix);}
    else this.melody.push(-1);}},
mtone(t,f,dur,type,g,a,dest){const A=AU.ctx,o=A.createOscillator(),v=A.createGain();
  o.type=type;o.frequency.value=f;v.gain.setValueAtTime(0,t);
  v.gain.linearRampToValueAtTime(g,t+(a||.01));v.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(v);v.connect(dest||AU.musG);o.start(t);o.stop(t+dur+.05);return v;},
mnoise(t,dur,g,ft,fq){const A=AU.ctx,s=A.createBufferSource();s.buffer=AU.noiseBuf;s.loop=true;
  const f=A.createBiquadFilter();f.type=ft;f.frequency.value=fq;
  const v=A.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(f);f.connect(v);v.connect(AU.musG);s.start(t);s.stop(t+dur+.05);},
step(i,t){const s=i&7,bar=(i>>3)&3,I=this.intensity,ch=PROG[bar];
  if(s===0){ch.pad.forEach(f=>{this.mtone(t,f,1.9,'triangle',I===0?.035:.05,.35);
    if(I>=2)this.mtone(t,f*1.005,1.9,'triangle',.03,.35);});}
  if(s===0||s===4)this.mtone(t,s===4?ch.root*1.5:ch.root,.3,'triangle',.22,.005);
  if(I>=1&&(s===0||s===4)){const A=AU.ctx,o=A.createOscillator(),v=A.createGain();
    o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
    v.gain.setValueAtTime(.5,t);v.gain.exponentialRampToValueAtTime(.001,t+.14);
    o.connect(v);v.connect(AU.musG);o.start(t);o.stop(t+.2);}
  if(I>=2&&(s===2||s===6)){this.mnoise(t,.12,.16,'bandpass',1800);this.mtone(t,190,.06,'triangle',.12,.004);}
  if(I>=1)this.mnoise(t,s%2?.025:.035,s%2?.03:.06,'highpass',6500);
  const m=this.melody[i];if(m>=0&&I>=1){const f=PENT[m],g=I>=2?.09:.06;
    const A=AU.ctx,o=A.createOscillator(),v=A.createGain(),lp=A.createBiquadFilter();
    lp.type='lowpass';lp.frequency.value=2400;o.type='square';o.frequency.value=f;
    v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.01);
    v.gain.exponentialRampToValueAtTime(.0008,t+.22);
    o.connect(lp);lp.connect(v);v.connect(AU.musG);v.connect(AU.dly);o.start(t);o.stop(t+.3);}
},
tick(){const A=AU.ctx;if(!A)return;
  if(!AU.on||A.state!=='running'){this.next=A.currentTime+.1;return;}
  const spb=60/this.bpm/2;
  while(this.next<A.currentTime+.16){this.step(this.idx,this.next);
    this.idx=(this.idx+1)%32;this.next+=spb;}}
};
MUS.regen(7919);
const unlockAudio=()=>{if(!AU.ctx)AU.init();
  if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});};
['keydown','mousedown','touchstart','pointerdown'].forEach(evt=>
  window.addEventListener(evt,unlockAudio,{passive:true}));

/* ================= textures ================= */
const cv=el('game'),ctx=cv.getContext('2d');
let pfTex=null,ballSpr=null,flipSpr=null,bumperSpr=null,glows={};
function makeGlow(c){const g=document.createElement('canvas');g.width=g.height=64;
  const x=g.getContext('2d'),gr=x.createRadialGradient(32,32,2,32,32,32);
  gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fillRect(0,0,64,64);return g;}
function buildSprites(){
  ballSpr=document.createElement('canvas');ballSpr.width=ballSpr.height=44;
  let x=ballSpr.getContext('2d'),g=x.createRadialGradient(15,13,2,22,22,22);
  g.addColorStop(0,'#ffffff');g.addColorStop(.25,'#dfe6f2');g.addColorStop(.6,'#8b97ad');
  g.addColorStop(.85,'#3d4557');g.addColorStop(1,'#181c26');
  x.fillStyle=g;x.beginPath();x.arc(22,22,21,0,7);x.fill();

/* ================= physics ================= */
function collideSeg(b,s){
  const dx=s.x2-s.x1,dy=s.y2-s.y1,l2=dx*dx+dy*dy;
  let t=((b.x-s.x1)*dx+(b.y-s.y1)*dy)/l2;t=t<0?0:t>1?1:t;
  const cx=s.x1+dx*t,cy=s.y1+dy*t;
  let nx=b.x-cx,ny=b.y-cy;const d2=nx*nx+ny*ny;
  if(d2>=R*R)return null;
  const d=Math.sqrt(d2)||.001;nx/=d;ny/=d;
  b.x=cx+nx*R;b.y=cy+ny*R;
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){b.vx-=(1+REST)*vn*nx;b.vy-=(1+REST)*vn*ny;}
  return{nx,ny,vn};
}
function collideFlipper(b,f){
  const dx=Math.cos(f.a),dy=Math.sin(f.a);
  let t=(b.x-f.px)*dx+(b.y-f.py)*dy;t=clamp(t,0,f.len);
  const cx=f.px+dx*t,cy=f.py+dy*t;
  let nx=b.x-cx,ny=b.y-cy;const d2=nx*nx+ny*ny,rr=R+FRAD;
  if(d2>=rr*rr)return;
  const d=Math.sqrt(d2)||.001;nx/=d;ny/=d;
  b.x=cx+nx*rr;b.y=cy+ny*rr;
  const rx=cx-f.px,ry=cy-f.py;
  const vcx=-f.w*ry,vcy=f.w*rx;
  const rel=(b.vx-vcx)*nx+(b.vy-vcy)*ny;
  if(rel<0){const j=(1+.42)*rel;b.vx-=j*nx;b.vy-=j*ny;}
}
function stepBall(b,dt){
  b.vy+=GRAV*dt;
  const sp=Math.hypot(b.vx,b.vy);
  if(sp>VMAX){b.vx*=VMAX/sp;b.vy*=VMAX/sp;}
  const n=clamp(Math.ceil(sp*dt/(R*.85)),1,4);
  for(let i=0;i<n;i++){
    b.x+=b.vx*dt/n;b.y+=b.vy*dt/n;
    for(const s of segs){
      if(s.type==='target')continue;
      if(s.type==='gate'&&b.vy<-60)continue;
      const h=collideSeg(b,s);
      if(!h)continue;
      if(s.type==='sling'&&h.vn<-120&&now>s.cool){s.cool=now+.15;
        b.vx+=h.nx*430;b.vy+=h.ny*430;addScore(75);AU.sling();
        burst(b.x,b.y,'#ff5fa0',6,240);}
      else if(s.type==='standup'&&now>s.cool){s.cool=now+.3;
        b.vx+=h.nx*160;b.vy+=h.ny*160;addScore(500);AU.stand();
        burst(b.x,b.y,'#ffe27a',6,220);}
      else if(h.vn<-260)AU.wall(-h.vn);
    }
    for(const tg of TD){
      if(tg.hit)continue;
      const dx=tg.x2-tg.x1,dy=tg.y2-tg.y1,l2=dx*dx+dy*dy;
      let t=((b.x-tg.x1)*dx+(b.y-tg.y1)*dy)/l2;t=clamp(t,0,1);
      const cx=tg.x1+dx*t,cy=tg.y1+dy*t;
      let nx2=b.x-cx,ny2=b.y-cy;const dd=nx2*nx2+ny2*ny2;
      if(dd<R*R){const d=Math.sqrt(dd)||.001;nx2/=d;ny2/=d;
        b.x=cx+nx2*R;b.y=cy+ny2*R;
        const vn=b.vx*nx2+b.vy*ny2;
        if(vn<0){b.vx-=1.5*vn*nx2;b.vy-=1.5*vn*ny2;}
        tg.hit=true;tg.hitT=now;AU.target();addScore(500);
        burst(b.x,b.y,'#ff3860',8,260);hud();
        if(targetsLeft()===0)completeBank();}
    }
    for(const bp of bumpers){
      const dx=b.x-bp.x,dy=b.y-bp.y,d=Math.hypot(dx,dy);
      if(d<bp.r+R){const nx2=dx/(d||.001),ny2=dy/(d||.001);
        b.x=bp.x+nx2*(bp.r+R);b.y=bp.y+ny2*(bp.r+R);
        const vn=b.vx*nx2+b.vy*ny2;
        if(vn<0){b.vx-=(1+.4)*vn*nx2;b.vy-=(1+.4)*vn*ny2;}
        const kick=Math.min(820,560+level*35)*rand(.9,1.1),a=Math.atan2(ny2,nx2)+rand(-.06,.06);
        b.vx+=Math.cos(a)*kick;b.vy+=Math.sin(a)*kick;
        bp.hitT=now;addScore(100);
        if(now-lastBumpSfx>.03){AU.bump();lastBumpSfx=now;}
        burst(b.x,b.y,'#5efcff',QUAL[view.q].glow?8:4,300);}
    }
    collideFlipper(b,FL);collideFlipper(b,FR);
  }
  lanes.forEach((ln,i)=>{
    if(Math.hypot(b.x-ln.x,b.y-ln.y)<R+20&&now>ln.cool){ln.cool=now+.5;
      AU.roll();addScore(300);burst(ln.x,ln.y,'#7cff6b',5,180);
      if(skillT>0){skillT=0;
        if(i===skillLane){addScore(2500,'SKILL SHOT +'+(2500*mult));AU.skill();}
        skillLane=-1;}
      if(!ln.lit){ln.lit=true;if(lanes.every(l=>l.lit))allLanes();}
      hud();}});
  if(Math.hypot(b.x-SPIN.x,b.y-SPIN.y)<R+SPIN.r&&now>SPIN.cool){
    SPIN.cool=now+.09;SPIN.vel=14;addScore(50);}
  if(b.plunger){b.x=clamp(b.x,485,505);
    if(b.y<560){b.plunger=false;}}
  /* [NEW] automatic kickbacks in the sealed outlane pockets: safety net so a
     ball can never die or rest in a place the player cannot reach. */
  if((b.x<105&&b.y>760)||(b.x>433&&b.x<486&&b.y>760)){
    b.pocketT=(b.pocketT||0)+dt;
    if(b.pocketT>.4){b.pocketT=0;b.vy=-950;b.vx=b.x<270?260:-260;
      AU.kick();burst(b.x,b.y,'#7cff6b',10,280);}
  }else b.pocketT=0;
  if(!b.plunger&&Math.hypot(b.vx,b.vy)<6){b.stuck=(b.stuck||0)+dt;
    if(b.stuck>1.5){b.stuck=0;b.vx+=rand(-40,40);b.vy-=50;}}else b.stuck=0;
}
function physics(dt){
  now+=dt;
  [[FL,input.l],[FR,input.r]].forEach(([f,p])=>{
    const dead=tilted;const pressed=p&&!dead;
    const tgt=pressed?f.fire:f.rest,sp=pressed?FWSPD:RWSPD;
    const prev=f.a;
    if(f.a<tgt)f.a=Math.min(tgt,f.a+sp*dt);else f.a=Math.max(tgt,f.a-sp*dt);
    f.w=(f.a-prev)/dt;
    if(pressed&&!f.wasP&&!dead)AU.flip();
    f.wasP=pressed;});
  if(charging){charge=Math.min(1,charge+dt/0.9);AU.chargeSet(charge);}
  comboT-=dt;if(comboT<=0){combo=0;mult=1;hud();}
  if(saveT>0)saveT-=dt;if(skillT>0)skillT-=dt;
  for(let i=balls.length-1;i>=0;i--){const b=balls[i];stepBall(b,dt);
    if(b.y>1010){balls.splice(i,1);ballEnded();}}
  SPIN.a+=SPIN.vel*dt;SPIN.vel*=Math.pow(.2,dt);
  shakeT=Math.max(0,shakeT-dt);
}

    ctx.stroke();
    if(charge>0){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(465,700,7,160);
      const hg=ctx.createLinearGradient(0,860,0,700);
      hg.addColorStop(0,'#3dff6b');hg.addColorStop(.6,'#ffe27a');hg.addColorStop(1,'#ff4d4d');
      ctx.fillStyle=hg;ctx.fillRect(466,858-156*charge,5,156*charge);}}
  /* save-kick charge lamps [NEW] */
  if(state==='play'){
    for(let i=0;i<2;i++){
      ctx.beginPath();ctx.arc(252+i*18,918,5,0,7);
      if(i<saves){ctx.fillStyle='#7cff6b';ctx.fill();
        glowDraw(glows.yel,252+i*18,918,0);}
      else{ctx.strokeStyle='rgba(124,255,107,.4)';ctx.lineWidth=1.5;ctx.stroke();}}
    if(saves>0&&balls.some(b=>b.y>820&&b.x>140&&b.x<400)){
      ctx.globalAlpha=.5+.5*Math.sin(now*12);
      ctx.strokeStyle='#7cff6b';ctx.lineWidth=2;ctx.strokeRect(215,905,110,26);
      ctx.globalAlpha=1;}}
  if(saveT>0&&state==='play'){ctx.globalAlpha=.4+.4*Math.sin(now*8);
    ctx.fillStyle='#7cff6b';ctx.font='700 15px monospace';ctx.textAlign='center';
    ctx.fillText('● BALL SAVE ●',270,632);ctx.globalAlpha=1;}
  if(tilted){ctx.fillStyle='#ff4040';ctx.font='900 20px monospace';ctx.textAlign='center';
    ctx.fillText('TILT',270,600);}
  balls.forEach(b=>{
    if(QUAL[view.q].trail){b.trail.push({x:b.x,y:b.y});if(b.trail.length>9)b.trail.shift();
      ctx.globalCompositeOperation='lighter';
      b.trail.forEach((tp,i)=>{const a=(i/b.trail.length)*.25;
        ctx.fillStyle='rgba(140,200,255,'+a+')';
        ctx.beginPath();ctx.arc(tp.x,tp.y,R*(i/b.trail.length),0,7);ctx.fill();});
      ctx.globalCompositeOperation='source-over';}
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath();ctx.ellipse(b.x+3,b.y+5,R,R*.8,0,0,7);ctx.fill();
    ctx.drawImage(ballSpr,b.x-11,b.y-11,22,22);});
  [FL,FR].forEach(f=>{ctx.save();ctx.translate(f.px,f.py);ctx.rotate(f.a);
    ctx.drawImage(flipSpr,-10,-11,115,22);ctx.restore();
    ctx.fillStyle='#101828';ctx.beginPath();ctx.arc(f.px,f.py,6,0,7);ctx.fill();});
  ctx.globalCompositeOperation='lighter';
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    p.t+=rdt;if(p.t>=p.life){parts[i]=parts[parts.length-1];parts.pop();continue;}
    p.x+=p.vx*rdt;p.y+=p.vy*rdt;p.vy+=400*rdt;
    ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;
    ctx.fillRect(p.x-1.5,p.y-1.5,3,3);}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

/* ================= input ================= */
const input={l:false,r:false};
function press(side,down){if(side==='l')input.l=down;else input.r=down;touchSeen();}
function startCharge(){if(state!=='play'||paused)return;
  if(!balls.some(b=>b.plunger))return;charging=true;charge=0;AU.chargeStart();}
function endCharge(){if(!charging)return;if(charge>.03)launchBall();
  else{charging=false;charge=0;AU.chargeEnd();}}
window.addEventListener('keydown',e=>{
  if(e.repeat)return;touchHidden=true;hideTouchUI();
  const c=e.code;
  if(c==='ArrowLeft'||c==='KeyA')press('l',1);
  else if(c==='ArrowRight'||c==='KeyD')press('r',1);
  else if(c==='Space'){e.preventDefault();
    if(state==='menu'||state==='over'){begin();}else startCharge();}
  else if(c==='ArrowUp'||c==='KeyW')nudge();
  else if(c==='KeyK'||c==='KeyS'||c==='ArrowDown')rescue();
  else if(c==='KeyN')begin();
  else if(c==='KeyM')toggleMusic();
  else if(c==='KeyP')togglePause();
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(c))e.preventDefault();
});
window.addEventListener('keyup',e=>{const c=e.code;
  if(c==='ArrowLeft'||c==='KeyA')press('l',0);
  else if(c==='ArrowRight'||c==='KeyD')press('r',0);
  else if(c==='Space')endCharge();});

const touchCapable=('ontouchstart' in window)||(isCoarse);
let touchHidden=false,idleTO=0;
function hideTouchUI(){el('touchUI').classList.add('hidden');}
function showTouchUI(){if(!touchCapable)return;el('touchUI').classList.remove('hidden');
  clearTimeout(idleTO);idleTO=setTimeout(hideTouchUI,3500);}
function touchSeen(){touchHidden=false;showTouchUI();}
document.addEventListener('touchstart',touchSeen,{passive:true});
if(!touchCapable){el('touchUI').style.display='none';el('keysBar').style.display='block';}
else el('keysBar').style.display='none';

function bindPress(elm,down,up){
  if(window.PointerEvent){
    elm.addEventListener('pointerdown',e=>{e.preventDefault();elm.setPointerCapture&&elm.setPointerCapture(e.pointerId);down();});
    elm.addEventListener('pointerup',e=>{e.preventDefault();up&&up();});
    elm.addEventListener('pointercancel',()=>up&&up());
  }else{
    elm.addEventListener('touchstart',e=>{e.preventDefault();down();},{passive:false});
    elm.addEventListener('touchend',e=>{e.preventDefault();up&&up();});
    elm.addEventListener('mousedown',down);elm.addEventListener('mouseup',()=>up&&up());
  }
  elm.addEventListener('contextmenu',e=>e.preventDefault());
}
bindPress(el('btnL'),()=>press('l',1),()=>press('l',0));
bindPress(el('btnR'),()=>press('r',1),()=>press('r',0));
bindPress(el('btnSave'),rescue);
bindPress(el('btnLaunch'),startCharge,endCharge);
bindPress(el('btnNudge'),nudge);
el('btnMusic').addEventListener('click',toggleMusic);
el('btnPause').addEventListener('click',togglePause);
el('btnNew').addEventListener('click',begin);
cv.addEventListener('pointerdown',e=>{
  AU.init();AU.resume();
  if(state==='menu'||state==='over'){begin();return;}
  if(paused){togglePause();return;}
  if(!touchCapable)return;
  const r=cv.getBoundingClientRect();
  press((e.clientX-r.left)<r.width/2?'l':'r',1);
});
cv.addEventListener('pointerup',()=>{press('l',0);press('r',0);});
cv.addEventListener('pointercancel',()=>{press('l',0);press('r',0);});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
let lastShake=0;
window.addEventListener('devicemotion',e=>{
  const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
  if(Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z)>30&&now-lastShake>1){lastShake=now;nudge();}});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&state==='play'&&!paused)togglePause();AU.resume();});

function toggleMusic(){AU.on=!AU.on;el('btnMusic').textContent=AU.on?'♪':'✕';}
function togglePause(){if(state!=='play')return;paused=!paused;
  if(paused)showOverlay('pause');else el('overlay').classList.add('hidden');}
function begin(){
  AU.init();AU.resume();
  if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission&&touchCapable)
    DeviceMotionEvent.requestPermission().catch(()=>{});
  newGame();
}

/* ================= overlays ================= */
function showOverlay(mode,rec){
  const o=el('overlay');o.classList.remove('hidden');
  if(mode==='menu'){
    o.innerHTML='<h1>3D ARCADE PINBALL</h1><h2>◆ DX EDITION ◆</h2>'+
    '<div class="ctl"><b>KEYBOARD</b> — A/← · D/→ flippers | SPACE launch | K/↓ save-kick | ↑ nudge<br>'+
    '<b>TOUCH</b> — ◀ ▶ flip · PULL launch · SAVE rescues a draining ball · shake = nudge<br>'+
    'Clear targets to level up · light all lanes for <b>MULTIBALL</b> · lit lane = <b>SKILL SHOT</b><br>'+
    '2 save-kicks per ball · outlane kickbacks auto-fire</div>'+
    '<div class="coin">▶ TAP OR PRESS SPACE ◀</div>'+
    '<div class="hi">HIGH SCORE — '+hiScore.toLocaleString()+'</div>';
  }else if(mode==='over'){
    o.innerHTML='<h1>GAME OVER</h1><h2>'+(rec?'★ NEW RECORD ★':'')+'</h2>'+
    '<div class="ctl" style="font-size:22px;color:#ffb32b">FINAL SCORE<br><b style="font-size:34px">'+
    score.toLocaleString()+'</b><br><span style="font-size:13px;color:#7df3ff">REACHED LEVEL '+level+'</span></div>'+
    '<div class="coin">▶ TAP OR PRESS N ◀</div>'+
    '<div class="hi">HIGH SCORE — '+hiScore.toLocaleString()+'</div>';
  }else if(mode==='pause'){
    o.innerHTML='<h1>PAUSED</h1><div class="coin">▶ TAP TO RESUME ◀</div>';
  }
}
el('overlay').addEventListener('pointerdown',e=>{
  e.stopPropagation();
  if(state==='menu'||state==='over')begin();
  else if(paused)togglePause();});
showOverlay('menu');hud();

/* ================= main loop ================= */
let last=performance.now(),acc=0,ema=16,frames=0;
function frame(t){
  requestAnimationFrame(frame);
  let dt=(t-last)/1000;last=t;if(dt>.1)dt=.1;
  ema=ema*.95+dt*1000*.05;
  if(++frames%120===0&&ema>30&&view.q>0){view.q--;resize();ema=16;}
  if(state==='play'&&!paused){
    acc+=dt;let n=0;
    while(acc>=STEP&&n<6){physics(STEP);acc-=STEP;n++;}
    if(n===6)acc=0;
  }else now+=dt;
  render(dt);
}
requestAnimationFrame(frame);
})();
</script>
