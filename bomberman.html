<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070911">
<title>BOMB BLASTER</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#070911;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:#dfe8ff;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;touch-action:none}
  canvas#c{display:block;position:fixed;left:0;width:100vw;top:80px;
    height:calc(100vh - 106px);z-index:1}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;
    gap:2px;padding:2px;background:rgba(4,7,14,0.9);
    border-bottom:1px solid rgba(120,180,255,0.35);
    z-index:5;pointer-events:none;max-height:22vh;overflow:hidden}
  .pcard{flex:1 1 0;min-width:0;padding:2px 5px;
    border:1px solid rgba(120,180,255,0.32);border-radius:4px;
    background:rgba(0,0,0,0.4);overflow:hidden;
    font-size:9.5px;line-height:1.15;text-shadow:0 1px 2px #000}
  .pcard.cpu{border-color:rgba(255,180,120,0.42)}
  .pcard.human{border-color:rgba(120,200,255,0.55)}
  .pcHead{display:flex;flex-wrap:wrap;gap:4px;
    justify-content:space-between;color:#cfe2ff;align-items:baseline}
  .pcHead .name{font-weight:700;color:#7ff0ff;letter-spacing:.8px}
  .pcard.cpu .pcHead .name{color:#ffb24d}
  .pcHead .hp{color:#ff8899}
  .pcHead .score{color:#ffd479;font-weight:700;margin-left:auto}
  .pcIcons{display:flex;flex-wrap:wrap;gap:1px;margin-top:1px;
    max-height:36px;overflow:hidden}
  .pcIcons .bi{position:relative;width:14px;height:14px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(120,180,255,0.4);border-radius:2px;
    background:rgba(0,0,0,0.55);flex-shrink:0}
  .pcIcons .bi canvas{width:11px;height:11px;image-rendering:pixelated;display:block}
  .pcIcons .bi .lv{position:absolute;right:-2px;bottom:-2px;
    font-size:7px;background:rgba(0,0,0,0.92);color:#ffd479;
    padding:0 1px;border-radius:1px;line-height:8px;min-width:8px;
    text-align:center;text-shadow:0 0 2px #000}
  #hudTotal{flex:0 0 auto;padding:4px 8px;
    border:1px solid rgba(120,180,255,0.42);border-radius:4px;
    background:rgba(0,0,0,0.5);display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    font-size:8.5px;color:#cfe2ff;letter-spacing:1px}
  #hudTotal b{color:#ffd479;font-size:14px;line-height:1.1}
  #arrows{position:fixed;left:0;top:0;width:100vw;height:calc(100vh - 26px);
    pointer-events:none;z-index:8;overflow:hidden}
  #ticker{position:fixed;left:0;right:0;bottom:0;height:26px;
    background:linear-gradient(180deg,rgba(8,12,24,0.72),rgba(6,9,18,0.95));
    border-top:1px solid rgba(120,180,255,0.22);overflow:hidden;
    z-index:6;pointer-events:none}
  #tickerStrip{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden}
  .tickItem{position:absolute;top:0;left:0;height:100%;display:inline-flex;
    align-items:center;gap:2px;padding:0 12px;
    font-size:11px;letter-spacing:.2px;color:#dfe8ff;
    white-space:nowrap;text-shadow:0 1px 3px #000;
    border-right:1px solid rgba(120,180,255,0.18);will-change:transform}
  .tickItem canvas{width:16px;height:16px;image-rendering:pixelated;display:block}
  .tickItem .sep{opacity:.55;margin:0 4px;color:#9fb4d8}
  .tickItem b{color:#ffd479}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 32%,rgba(28,44,96,.82),rgba(3,5,12,.97));
    z-index:10;padding:12px;overflow-y:auto}
  .panel{text-align:center;padding:16px 14px;border:1px solid rgba(120,180,255,.22);
    border-radius:14px;background:rgba(10,16,32,.9);
    box-shadow:0 20px 60px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.07);
    max-width:min(94vw,460px);width:100%}
  h1{font-size:clamp(20px,6.5vw,30px);letter-spacing:3px;line-height:1.05;margin-bottom:4px;
    color:#fff;text-shadow:0 0 22px rgba(90,180,255,.85)}
  h1 span{color:#ffb24d;text-shadow:0 0 22px rgba(255,150,40,.85)}
  .sub{font-size:9.5px;opacity:.6;margin-bottom:12px;letter-spacing:1.5px;line-height:1.6}
  .big{font-size:20px;color:#ffd479;letter-spacing:2px;margin:6px 0 8px}
  .lbl{font-size:10px;opacity:.65;letter-spacing:1.4px;margin:10px 0 5px;text-align:left}
  input{width:100%;padding:9px 10px;margin-bottom:8px;border-radius:9px;
    border:1px solid rgba(120,180,255,.28);background:rgba(0,0,0,.45);color:#dfe8ff;
    font-family:inherit;font-size:13px;text-align:center;outline:none}
  input:focus{border-color:#5ac8ff;box-shadow:0 0 0 3px rgba(90,200,255,.14)}
  input.code{font-size:10px;letter-spacing:.5px;padding:7px 8px}
  button{width:100%;padding:10px;margin-top:5px;border-radius:10px;border:none;
    cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;
    letter-spacing:1.2px;background:linear-gradient(180deg,#38b6ff,#1565c0);color:#fff;
    box-shadow:0 4px 0 #0b3f7a,0 8px 16px rgba(0,80,200,.42);
    transition:transform .06s,box-shadow .06s}
  button:active,button:focus-visible{transform:translateY(3px);
    box-shadow:0 1px 0 #0b3f7a;outline:2px solid #7ff0ff;outline-offset:2px}
  button.alt{background:linear-gradient(180deg,#6b7a94,#39445c);
    box-shadow:0 4px 0 #222a3c,0 8px 16px rgba(0,0,0,.4)}
  button.alt:active,button.alt:focus-visible{box-shadow:0 1px 0 #222a3c}
  button.home{background:linear-gradient(180deg,#ffb24d,#cc6a00);
    box-shadow:0 4px 0 #804000,0 8px 16px rgba(200,80,0,.4)}
  button.home:active,button.home:focus-visible{box-shadow:0 1px 0 #804000}
  .row2{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .row2 button,.row3 button,.row4 button{padding:7px 3px;font-size:10.5px;
    letter-spacing:.6px;margin-top:0}
  .row2 button.on,.row3 button.on,.row4 button.on{
    background:linear-gradient(180deg,#ffb24d,#cc6a00);
    box-shadow:0 4px 0 #804000,0 8px 16px rgba(200,80,0,.4)}
  .hint{margin-top:10px;font-size:9.5px;opacity:.55;letter-spacing:1.1px;line-height:1.7}
  #touch{position:fixed;inset:0;z-index:7;pointer-events:none;display:none}
  #touch.on{display:block}
  #dpad1{position:absolute;left:10px;bottom:calc(26px + 12px);
    display:grid;grid-template-columns:48px 48px 48px;
    grid-template-rows:48px 48px 48px;gap:2px;pointer-events:auto}
  #dpad1 button{width:48px;height:48px;padding:0;margin:0;border-radius:10px;
    background:rgba(70,120,200,0.35);border:1px solid rgba(140,200,255,0.4);
    box-shadow:none;color:#e8f2ff;font-size:17px;line-height:1;
    font-family:inherit;font-weight:700;letter-spacing:0;pointer-events:none}
  #dpad1 button.act{background:rgba(120,190,255,0.7)}
  #dpad1 [data-d="0"]{grid-column:2;grid-row:1}
  #dpad1 [data-d="3"]{grid-column:1;grid-row:2}
  #dpad1 [data-d="1"]{grid-column:3;grid-row:2}
  #dpad1 [data-d="2"]{grid-column:2;grid-row:3}
  #rightCol{position:absolute;right:10px;bottom:calc(26px + 12px);
    display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-end;
    pointer-events:auto}
  #rightCol button{width:68px;height:68px;border-radius:50%;padding:0;margin:0;
    font-size:24px;line-height:1;font-family:inherit;letter-spacing:0;color:#fff;
    border:1px solid rgba(255,180,120,0.55);background:rgba(255,120,60,0.32);
    box-shadow:0 0 20px rgba(255,120,40,0.28);pointer-events:auto}
  #rightCol button.act{background:rgba(255,150,80,0.75)}
  #rightCol button.small{width:50px;height:50px;font-size:17px;
    border-color:rgba(255,120,255,0.55);background:rgba(200,60,200,0.32);
    box-shadow:0 0 16px rgba(200,60,200,0.28)}
  #rightCol button.small.act{background:rgba(230,90,230,0.72)}
  #p2wrap{position:absolute;right:10px;bottom:calc(26px + 12px);
    display:none;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto}
  #p2wrap.on{display:flex}
  #dpad2{display:grid;grid-template-columns:40px 40px 40px;
    grid-template-rows:40px 40px 40px;gap:2px;pointer-events:auto}
  #dpad2 button{width:40px;height:40px;padding:0;margin:0;border-radius:9px;
    background:rgba(200,120,60,0.35);border:1px solid rgba(255,190,140,0.4);
    box-shadow:none;color:#fff2e8;font-size:14px;line-height:1;
    font-family:inherit;font-weight:700;letter-spacing:0;pointer-events:none}
  #dpad2 button.act{background:rgba(255,170,110,0.72)}
  #dpad2 [data-d="0"]{grid-column:2;grid-row:1}
  #dpad2 [data-d="3"]{grid-column:1;grid-row:2}
  #dpad2 [data-d="1"]{grid-column:3;grid-row:2}
  #dpad2 [data-d="2"]{grid-column:2;grid-row:3}
  #p2bombRow{display:flex;gap:6px}
  #p2bombRow button{width:54px;height:54px;border-radius:50%;padding:0;margin:0;
    font-size:20px;line-height:1;font-family:inherit;color:#fff;letter-spacing:0;
    border:1px solid rgba(255,190,120,0.55);background:rgba(255,140,60,0.32);
    pointer-events:auto}
  #p2bombRow button.act{background:rgba(255,170,90,0.75)}
  #p2bombRow button.small{width:42px;height:42px;font-size:14px;
    border-color:rgba(255,120,255,0.55);background:rgba(200,60,200,0.32)}
  #p2bombRow button.small.act{background:rgba(230,90,230,0.72)}
  .err{padding:20px;font-size:13px;line-height:1.8;color:#ff9aa9}
  #pauseBtn{position:fixed;top:6px;right:6px;z-index:9;
    width:40px;height:40px;border-radius:8px;
    background:rgba(4,7,14,0.88);border:1px solid rgba(120,180,255,0.42);
    color:#dfe8ff;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:inherit;padding:0;margin:0;line-height:1;
    box-shadow:0 2px 8px rgba(0,0,0,0.55);
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,transform .06s}
  #pauseBtn:hover{background:rgba(20,40,80,0.9)}
  #pauseBtn:active{background:rgba(40,70,140,0.95);transform:scale(0.94)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="arrows"></div>
<div id="ticker"><div id="tickerStrip"></div></div>
<button id="pauseBtn" type="button" aria-label="Pause" title="Pause (Esc)">⏸</button>
<div id="touch">
  <div id="dpad1">
    <button data-d="0">▲</button><button data-d="3">◀</button>
    <button data-d="1">▶</button><button data-d="2">▼</button>
  </div>
  <div id="rightCol">
    <button class="small" id="b1remote" type="button">⇩</button>
    <button id="b1" type="button">💣</button>
  </div>
  <div id="p2wrap">
    <div id="p2bombRow">
      <button class="small" id="b2remote" type="button">⇩</button>
      <button id="b2" type="button">💣</button>
    </div>
    <div id="dpad2">
      <button data-d="0">▲</button><button data-d="3">◀</button>
      <button data-d="1">▶</button><button data-d="2">▼</button>
    </div>
  </div>
</div>
<div id="overlay"><div class="panel" id="panel"></div></div>
<script>
(function(){
"use strict";

/* ============== UTIL ============== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
var PASSCODE_KEY='bb_passcode_v1';
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function b64Encode(str){try{var u=unescape(encodeURIComponent(str));return btoa(u).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}catch(e){return '';}}
function b64Decode(str){try{var s=str.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}catch(e){return null;}}

/* ============== ATLAS ============== */
var TS=32, ATLAS=256, INSET=0.5/ATLAS;
var T={FLOOR_A:0,FLOOR_B:1,WALL:2,BRICK:3,BOMB0:4,BOMB1:5,BOMB2:6,
  EXP_C:7,EXP_H:8,EXP_V:9,
  P1_D:10,P1_U:11,P1_L:12,P1_R:13,P2_D:14,P2_U:15,P2_L:16,P2_R:17,
  E0A:18,E0B:19,E1A:20,E1B:21,E2A:22,E2B:23,E3A:24,E3B:25,E4A:26,E4B:27,E5A:28,E5B:29,
  PORTAL_ON:54,PORTAL_OFF:55,SHADOW:56,WHITE:57};

var PU_DEFS=[
  {id:'bomb',     tile:30,c1:'#5ad2ff',c2:'#0d4d9e',w:10,text:'<b>Bomb Up</b> — Drop one more bomb.'},
  {id:'fire',     tile:31,c1:'#ffb14d',c2:'#a83a10',w:10,text:'<b>Fire Up</b> — Blast radius +1.'},
  {id:'speed',    tile:32,c1:'#9dff6b',c2:'#1b7a26',w:8, text:'<b>Speed Up</b> — Move faster.'},
  {id:'fullfire', tile:33,c1:'#ffdd00',c2:'#c04a00',w:3, text:'<b>Full Fire</b> — Max blast radius.'},
  {id:'heart',    tile:34,c1:'#ff5577',c2:'#99001e',w:6, text:'<b>Heart</b> — Absorbs one hit.'},
  {id:'oneup',    tile:35,c1:'#88ff88',c2:'#008040',w:4, text:'<b>1-Up</b> — Extra life.'},
  {id:'vest',     tile:36,c1:'#aaffee',c2:'#1e7a9c',w:4, text:'<b>Invincibility</b> — Brief immunity.'},
  {id:'remote',   tile:37,c1:'#ff88ff',c2:'#7d007d',w:6, text:'<b>Remote Control</b> — Manual detonation.'},
  {id:'power',    tile:38,c1:'#ff5522',c2:'#5c0000',w:5, text:'<b>Power Bomb</b> — Next bomb has max radius.'},
  {id:'spike',    tile:39,c1:'#dcdcdc',c2:'#2e2e2e',w:5, text:'<b>Spike Bomb</b> — Pierces bricks.'},
  {id:'bouncy',   tile:40,c1:'#ffcc44',c2:'#7a4a00',w:5, text:'<b>Bouncy Bomb</b> — Bounces off walls.'},
  {id:'mine',     tile:41,c1:'#996644',c2:'#2b0e00',w:4, text:'<b>Land Mine</b> — Triggers on enemies.'},
  {id:'cluster',  tile:42,c1:'#ff6688',c2:'#7d0028',w:5, text:'<b>Cluster Bomb</b> — Secondary blasts.'},
  {id:'danger',   tile:44,c1:'#ff0033',c2:'#2b0000',w:4, text:'<b>Dangerous Bomb</b> — 3x3 explosion.'},
  {id:'kick',     tile:45,c1:'#aaffaa',c2:'#1e5c1e',w:6, text:'<b>Bomb Kick</b> — Slide bombs.'},
  {id:'glove',    tile:46,c1:'#ffaa00',c2:'#5c2a00',w:5, text:'<b>Power Glove</b> — Walk through bombs.'},
  {id:'bpass',    tile:47,c1:'#aabbcc',c2:'#1c2c3e',w:5, text:'<b>Bomb Pass</b> — Walk through bombs.'},
  {id:'wpass',    tile:48,c1:'#ddccaa',c2:'#4a3a1a',w:4, text:'<b>Wall Pass</b> — Phase through bricks.'},
  {id:'fpass',    tile:49,c1:'#ffccaa',c2:'#7a2a00',w:4, text:'<b>Fire Pass</b> — Immune to explosions.'},
  {id:'line',     tile:50,c1:'#ccff44',c2:'#2e7a00',w:4, text:'<b>Line Bomb</b> — Drop all bombs in a line.'},
  {id:'clock',    tile:51,c1:'#ffffff',c2:'#556688',w:3, text:'<b>Timer</b> — Freezes all enemies.'},
  {id:'gem',      tile:53,c1:'#44ddff',c2:'#004a77',w:8, text:'<b>Gem</b> — Bonus points.'},
  {id:'key',      tile:52,c1:'#ffd700',c2:'#7a4a00',w:1, text:'<b>Door Pass</b> — Reveals the exit portal!'}
];
var PU_BY_ID={};
var PU_TOTAL_W=0;
for(var _pi=0;_pi<PU_DEFS.length;_pi++){PU_BY_ID[PU_DEFS[_pi].id]=PU_DEFS[_pi];PU_TOTAL_W+=PU_DEFS[_pi].w;}
function pickRandomPrize(){
  var r=Math.random()*PU_TOTAL_W;
  for(var i=0;i<PU_DEFS.length;i++){r-=PU_DEFS[i].w;if(r<=0)return PU_DEFS[i];}
  return PU_DEFS[0];
}

var ENEMY_TYPES=[
  {name:'slime',speed:1.8,hp:1,throughBricks:false,throughBombs:false,smart:false},
  {name:'runner',speed:2.9,hp:1,throughBricks:false,throughBombs:false,smart:false},
  {name:'hunter',speed:2.1,hp:1,throughBricks:false,throughBombs:false,smart:true},
  {name:'bomber',speed:2.0,hp:1,throughBricks:false,throughBombs:true,smart:false},
  {name:'ghost',speed:1.6,hp:1,throughBricks:true,throughBombs:true,smart:false},
  {name:'tank',speed:1.2,hp:2,throughBricks:false,throughBombs:false,smart:false}];

var ICON_CACHE={};
var atlasFullCanvas=null;

function drawWallTile(g,x,y){
  g.save();g.beginPath();g.rect(x,y,TS,TS);g.clip();
  g.fillStyle='#0e1116';g.fillRect(x,y,TS,TS);
  var grd=g.createLinearGradient(x,y,x,y+TS);
  grd.addColorStop(0.00,'#e8ecf3');grd.addColorStop(0.06,'#f4f7fb');
  grd.addColorStop(0.16,'#c8d0dd');grd.addColorStop(0.42,'#8a94a8');
  grd.addColorStop(0.68,'#5c6678');grd.addColorStop(0.90,'#3a4252');
  grd.addColorStop(1.00,'#222834');
  g.fillStyle=grd;g.fillRect(x+1,y+1,TS-2,TS-2);
  g.strokeStyle='rgba(255,255,255,0.07)';g.lineWidth=1;
  for(var i=-TS;i<TS;i+=3){g.beginPath();g.moveTo(x+i,y);g.lineTo(x+i+TS,y+TS);g.stroke();}
  g.strokeStyle='rgba(0,0,0,0.08)';
  for(var j=-TS;j<TS;j+=7){g.beginPath();g.moveTo(x+j,y);g.lineTo(x+j+TS,y+TS);g.stroke();}
  var hl=g.createLinearGradient(x,y+3,x,y+12);
  hl.addColorStop(0,'rgba(255,255,255,0.55)');hl.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=hl;g.fillRect(x+2,y+2,TS-4,10);
  g.fillStyle='rgba(255,255,255,0.5)';
  g.fillRect(x+1,y+1,TS-2,1);g.fillRect(x+1,y+1,1,TS-2);
  g.fillStyle='rgba(0,0,0,0.55)';
  g.fillRect(x+1,y+TS-2,TS-2,1);g.fillRect(x+TS-2,y+1,1,TS-2);
  g.strokeStyle='rgba(0,0,0,0.75)';g.lineWidth=1;
  g.strokeRect(x+0.5,y+0.5,TS-1,TS-1);
  g.restore();
}

function buildAtlas(){
  var cv=document.createElement('canvas');cv.width=cv.height=ATLAS;
  var g=cv.getContext('2d');
  var R=mulberry32(1337);
  function px(i){return (i&7)*TS;}
  function py(i){return (i>>3)*TS;}
  for(var f=0;f<2;f++){
    var i=f?T.FLOOR_B:T.FLOOR_A,x=px(i),y=py(i);
    g.save();g.beginPath();g.rect(x,y,TS,TS);g.clip();
    g.fillStyle=f?'#161b30':'#1a2140';g.fillRect(x,y,TS,TS);
    var grd=g.createLinearGradient(x,y,x+TS,y+TS);

  tickerStrip.appendChild(el);
  var w=el.offsetWidth||200;
  var cw=tickerContainer.clientWidth||400;
  var startX=cw;
  for(var j=0;j<tickerItems.length;j++){
    var it2=tickerItems[j];
    var right=it2.x+it2.w+GAP;
    if(right>startX && it2.x < cw+it2.w) startX=Math.max(startX,right);

  tickerItems.length=0;

}

  if(tickerItems.length===0) return;

    var it=tickerItems[i];
    it.x-=TICKER_SPEED*dt;
    it.el.style.transform='translateX('+it.x+'px)';
    if(it.x+it.w<0){

          cv.width=11;cv.height=11;
          drawIconInto(cv.getContext('2d'),items[j].tile,11);
          bi.appendChild(cv);
          if(items[j].level>1){
            var lv=document.createElement('span');
            lv.className='lv';lv.textContent=items[j].level;
            bi.appendChild(lv);
          }
          c.icons.appendChild(bi);
        }
      }
    }
  }
  if(hudTotalEl){
    var t=totalScore();
    if(hudTotalEl._lastVal!==t){hudTotalEl._lastVal=t;hudTotalEl.textContent=t;}
  }
  refreshLayoutIfHudChanged();
}

/* ============== CANVAS / LAYOUT ============== */
function updateCanvasLayout(){
  var h=hudEl.offsetHeight;
  if(h<20)h=40;
  var hpx=h+'px';
  var hh='calc(100vh - '+(h+26)+'px)';
  var changed=false;
  if(canvas.style.top!==hpx){canvas.style.top=hpx;changed=true;}
  if(canvas.style.height!==hh){canvas.style.height=hh;changed=true;}
  return changed;
}

function applyCanvasSize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  var rect=canvas.getBoundingClientRect();
  var cw=rect.width||window.innerWidth;
  var ch=rect.height||Math.max(120,window.innerHeight-106);
  var w=Math.max(320,Math.floor(cw*DPR));
  var h=Math.max(200,Math.floor(ch*DPR));
  var MAXPIX=1400000;
  if(w*h>MAXPIX){var s=Math.sqrt(MAXPIX/(w*h));w=Math.max(320,Math.floor(w*s));h=Math.max(180,Math.floor(h*s));}
  canvas.width=w;canvas.height=h;
  gl.viewport(0,0,w,h);
  gl.uniform2f(U_RES,w,h);
}

function computeLevelDimension(){
  var w=canvas.width, h=canvas.height;
  var availW=w-16*DPR;
  var availH=h-16*DPR;
  if(levelSize==='fit'){
    var targetTs=Math.max(14,Math.min(36,Math.floor(Math.sqrt(availW*availH/200))));
    GW=Math.max(13,Math.min(21,Math.floor(availW/targetTs)));
    GH=Math.max(11,Math.min(17,Math.floor(availH/targetTs)));
  } else {
    var preset=SIZE_PRESETS[levelSize]||[15,11];
    GW=preset[0];GH=preset[1];
  }
}

function computeTileSize(){
  var w=canvas.width, h=canvas.height;
  var availW=w-16*DPR;
  var availH=h-16*DPR;
  if(levelSize==='fit'){
    ts=Math.max(8,Math.floor(Math.min(availW/GW, availH/GH)));
  } else {
    var minDim=Math.min(w,h);
    ts=clamp(Math.floor(minDim/12),20,60);
  }
}

function refreshLayoutIfHudChanged(){
  var prevTop=canvas.style.top;
  var prevHeight=canvas.style.height;
  var changed=updateCanvasLayout();
  if(changed){
    applyCanvasSize();
    computeTileSize();
  }
}

function onWindowResize(){
  updateCanvasLayout();
  applyCanvasSize();
  computeTileSize();
}

window.addEventListener('resize',function(){onWindowResize();},false);
window.addEventListener('orientationchange',function(){setTimeout(onWindowResize,120);},false);

/* ============== LEVEL GEN ============== */
function pickEnemyType(lv,rng){
  var w=[10,Math.min(8,lv),Math.max(0,lv-2),Math.max(0,lv-4),Math.max(0,lv-6)*0.7,Math.max(0,lv-8)*0.5];
  var t=0;for(var i=0;i<w.length;i++)t+=w[i];
  var r=rng()*t;
  for(var j=0;j<w.length;j++){r-=w[j];if(r<=0)return j;}
  return 0;
}
function inB(i,j){return i>=0&&j>=0&&i<GW&&j<GH;}
function ensureSpawnEscape(spawnI,spawnJ){
  var dirs=[[0,-1],[1,0],[0,1],[-1,0]];
  function corridorClear(d){
    for(var r=1;r<=3;r++){
      var ni=spawnI+dirs[d][0]*r,nj=spawnJ+dirs[d][1]*r;
      if(!inB(ni,nj))return false;
      if(grid[nj*GW+ni]!==0)return false;
    }
    return true;
  }
  var open=0;
  for(var d=0;d<4;d++) if(corridorClear(d)) open++;
  if(open>=2) return;
  for(var d2=0;d2<4 && open<2;d2++){
    var wallBlocked=false;
    for(var r2=1;r2<=3;r2++){
      var ni2=spawnI+dirs[d2][0]*r2,nj2=spawnJ+dirs[d2][1]*r2;
      if(!inB(ni2,nj2)||grid[nj2*GW+ni2]===1){wallBlocked=true;break;}
    }
    if(wallBlocked) continue;
    for(var r3=1;r3<=3;r3++){
      var ni3=spawnI+dirs[d2][0]*r3,nj3=spawnJ+dirs[d2][1]*r3;
      if(grid[nj3*GW+ni3]===2) grid[nj3*GW+ni3]=0;
    }
    open++;
  }
}
function buildLevel(resume){
  applyCanvasSize();
  computeLevelDimension();
  var rng=mulberry32(hashStr(seedStr+'|'+level+'|'+GW+'x'+GH+'|'+playerMode+'|'+cpuHostile));
  grid=new Uint8Array(GW*GH);
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
    var v=0;
    if(x===0||y===0||x===GW-1||y===GH-1)v=1;
    else if((x&1)===0&&(y&1)===0)v=1;
    grid[y*GW+x]=v;
  }
  var safe={};
  function markSafe(cx,cy){
    for(var dy=-1;dy<=2;dy++)for(var dx=-1;dx<=2;dx++){
      var sx=cx+dx,sy=cy+dy;
      if(sx>0&&sy>0&&sx<GW-1&&sy<GH-1)safe[sy*GW+sx]=1;
    }
  }
  markSafe(0,0);markSafe(GW-1,0);markSafe(GW-1,GH-1);markSafe(0,GH-1);
  var dens=clamp(0.40+(level-1)*0.026,0.40,0.62);
  for(var yy=1;yy<GH-1;yy++)for(var xx=1;xx<GW-1;xx++){
    var k=yy*GW+xx;
    if(grid[k]!==0||safe[k])continue;
    if(rng()<dens)grid[k]=2;
  }
  ensureSpawnEscape(1,1);
  if(playerMode!=='1p') ensureSpawnEscape(GW-2,1);
  if(playerMode==='cpu2'||playerMode==='cpu3') ensureSpawnEscape(GW-2,GH-2);
  if(playerMode==='cpu3') ensureSpawnEscape(1,GH-2);

  var free=[];
  for(var y2=1;y2<GH-1;y2++)for(var x2=1;x2<GW-1;x2++){
    var k2=y2*GW+x2;
    if(grid[k2]===0)free.push(k2);
  }
  for(var i=free.length-1;i>0;i--){var j=(rng()*(i+1))|0;var tmp=free[i];free[i]=free[j];free[j]=tmp;}
  var ek=free.length?free.pop():((GH-2)*GW+(GW-2));
  exitPos.i=ek%GW;exitPos.j=(ek/GW)|0;exitPos.active=false;exitPos.hitCooldown=0;

  var corners=[{i:1,j:1},{i:GW-2,j:1},{i:GW-2,j:GH-2},{i:1,j:GH-2}];
  var oldPlayers=players.slice();
  players=[];
  var numHumans=1,numCPUs=0;
  if(playerMode==='2p'){numHumans=2;}
  else if(playerMode==='cpu1'){numHumans=1;numCPUs=1;}
  else if(playerMode==='cpu2'){numHumans=1;numCPUs=2;}
  else if(playerMode==='cpu3'){numHumans=1;numCPUs=3;}

  for(var pp=0;pp<numHumans+numCPUs;pp++){
    var isCpu=pp>=numHumans;
    var old=oldPlayers[pp]||makePlayer(pp+1,corners[pp].i,corners[pp].j,isCpu);
    old.id=pp+1;old.cpu=isCpu;
    old.px=corners[pp].i+0.5;old.py=corners[pp].j+0.5;
    old.tx=old.px;old.ty=old.py;old.moving=false;old.dir=2;old.alive=true;
    old.input.dirs[0]=false;old.input.dirs[1]=false;old.input.dirs[2]=false;old.input.dirs[3]=false;
    old.input.dirOrder.length=0;
    old.invuln=1.8;old.vestT=0;old.powerBombReady=false;
    old.aiStuckFrames=0;old.aiLastTile=-1;old.aiLastDir=-1;old.aiReversalCount=0;old.aiEscaping=false;
    old.camX=old.px;old.camY=old.py;old.camTargetX=old.px;old.camTargetY=old.py;
    if(old.lives<=0)old.lives=3;
    if(typeof old.score!=='number') old.score=0;
    players.push(old);
  }
  if(resume && resume.p){
    for(var ri=0;ri<players.length && ri<resume.p.length;ri++){
      var pd=resume.p[ri];
      if(typeof pd.lv==='number') players[ri].lives=pd.lv;
      if(typeof pd.s==='number') players[ri].score=pd.s;
    }
  }
  var humanCount=0,ax=0,ay=0;
  for(var q=0;q<players.length;q++){
    if(!players[q].cpu){ax+=players[q].px;ay+=players[q].py;humanCount++;}
  }
  if(humanCount>0){singleCamX=ax/humanCount;singleCamY=ay/humanCount;}
  else {singleCamX=players[0].px;singleCamY=players[0].py;}
  splitScreenOn=false;wasSplitLastFrame=false;

  enemies.length=0;
  var baseCount=2+Math.floor(level*0.6)+Math.floor((GW*GH)/350);
  var n=Math.min(24,baseCount);
  var safeDist=6;
  for(var e=0;e<n;e++){
    if(free.length===0)break;
    var fk=-1;
    for(var attempt=0;attempt<30;attempt++){
      var cand=free[(Math.random()*free.length)|0];
      var ci=cand%GW,cj=(cand/GW)|0;
      var ok=true;
      for(var pq=0;pq<players.length;pq++){
        var pi=Math.round(players[pq].px-0.5),pj=Math.round(players[pq].py-0.5);
        if(Math.abs(ci-pi)+Math.abs(cj-pj)<safeDist){ok=false;break;}
      }
      if(ok){fk=cand;break;}
    }
    if(fk<0)fk=free[free.length-1];
    var idx=free.indexOf(fk);if(idx>=0)free.splice(idx,1);
    var ex=fk%GW,ey=(fk/GW)|0;
    var typeIdx=pickEnemyType(level,rng);
    var type=ENEMY_TYPES[typeIdx];
    enemies.push({
      px:ex+0.5,py:ey+0.5,tx:ex+0.5,ty:ey+0.5,
      moving:false,dir:2,speed:type.speed*(1+level*0.02),
      hp:type.hp,type:type,typeIdx:typeIdx,alive:true,t:0});
  }
  bombs.length=0;blasts.length=0;powerups.length=0;
  for(var pc=0;pc<PART_MAX;pc++) particlePool[pc].life=0;
  allocBuffers();
  buildHudStructure();
  computeTileSize();
  updateCanvasLayout();
  applyCanvasSize();
  computeTileSize();
}

/* ============== HELPERS ============== */
function bombAt(i,j){for(var k=0;k<bombs.length;k++){var b=bombs[k];if(b.i===i&&b.j===j&&!b.dead)return b;}return null;}
function powerupAt(i,j){for(var k=0;k<powerups.length;k++){var p=powerups[k];if(p.i===i&&p.j===j)return p;}return null;}
function canWalkPlayer(i,j,pl){
  if(!inB(i,j))return false;
  var gv=grid[j*GW+i];
  if(gv===1)return false;
  if(gv===2&&!pl.wallPass)return false;
  var b=bombAt(i,j);
  if(b){
    if(b.isLandMine && b.owner===pl) return true;
    if(pl.bombPass||pl.glove)return true;
    return false;
  }
  return true;
}
function canWalkEnemy(i,j,en){
  if(!inB(i,j))return false;
  var gv=grid[j*GW+i];
  if(gv===1)return false;
  if(gv===2&&!en.type.throughBricks)return false;
  var b=bombAt(i,j);
  if(b){
    if(b.isLandMine) return true;
    if(!en.type.throughBombs)return false;
  }
  return true;
}
function tileOfPl(pl){return {i:Math.round(pl.px-0.5),j:Math.round(pl.py-0.5)};}
function brickDropChance(){
  var area=GW*GH;
  if(area<=180) return 0.40;
  if(area<=300) return 0.32;
  if(area<=500) return 0.24;
  return 0.20;
}
function addScore(pl,amt){
  if(!pl) return;
  if(!pl.score) pl.score=0;
  pl.score += amt;
}
function destroyBrick(i,j,owner){
  grid[j*GW+i]=0;
  spawnParticles(i,j,5,1.0,0.62,0.30);
  addScore(owner,10);
  if(Math.random()<brickDropChance()){
    var def=pickRandomPrize();
    powerups.push({i:i,j:j,def:def,t:0,spawnGrace:0.4});
  }
}

/* ============== EXPLOSION ============== */
function blastDestroysPowerups(tiles){
  for(var i=powerups.length-1;i>=0;i--){
    var p=powerups[i];
    if(p.spawnGrace>0) continue;
    for(var j=0;j<tiles.length;j++){
      if(tiles[j].i===p.i && tiles[j].j===p.j){
        spawnParticles(p.i,p.j,8,1.0,0.7,0.3);
        Audio_.prizeBreak();
        powerups.splice(i,1);
        break;
      }
    }
  }
}
function spawnEnemiesFromPortal(count){
  var candidates=[];
  for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++){
    var sx=exitPos.i+dx,sy=exitPos.j+dy;
    if(!inB(sx,sy))continue;
    if(grid[sy*GW+sx]!==0)continue;
    if(bombAt(sx,sy))continue;
    var onPlayer=false;
    for(var q=0;q<players.length;q++){
      if(Math.round(players[q].px-0.5)===sx && Math.round(players[q].py-0.5)===sy){onPlayer=true;break;}
    }
    if(onPlayer)continue;
    candidates.push({i:sx,j:sy});
  }
  var made=0;
  for(var e=0;e<count;e++){
    if(candidates.length===0)break;
    var idx=(Math.random()*candidates.length)|0;
    var sp=candidates[idx];candidates.splice(idx,1);
    var typeIdx=pickEnemyType(level,Math.random);
    var type=ENEMY_TYPES[typeIdx];
    enemies.push({
      px:sp.i+0.5,py:sp.j+0.5,tx:sp.i+0.5,ty:sp.j+0.5,
      moving:false,dir:2,speed:type.speed*(1+level*0.02),
      hp:type.hp,type:type,typeIdx:typeIdx,alive:true,t:0});
    spawnParticles(sp.i,sp.j,8,1.0,0.4,0.9);
    made++;
  }
  return made;
}
function detonateSingle(bomb,queue){
  var owner=bomb.owner;
  var tiles=[];
  var cx=bomb.i,cy=bomb.j;
  tiles.push({i:cx,j:cy,d:-1});
  if(bomb.isDangerous){
    for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++){
      if(dx===0&&dy===0)continue;
      var ni=cx+dx,nj=cy+dy;
      if(!inB(ni,nj))continue;
      var gv=grid[nj*GW+ni];
      if(gv===1)continue;
      if(gv===2){destroyBrick(ni,nj,owner);tiles.push({i:ni,j:nj,d:-1});continue;}
      tiles.push({i:ni,j:nj,d:-1});
      var ob=bombAt(ni,nj);
      if(ob&&!ob.dead&&ob!==bomb){ob.dead=true;queue.push(ob);}
    }
  } else {
    for(var d=0;d<4;d++){
      var ddx=DIRS[d][0],ddy=DIRS[d][1];
      for(var r=1;r<=bomb.fire;r++){
        var nx=cx+ddx*r,ny=cy+ddy*r;
        if(!inB(nx,ny))break;
        var gv2=grid[ny*GW+nx];
        if(gv2===1)break;
        if(gv2===2){destroyBrick(nx,ny,owner);tiles.push({i:nx,j:ny,d:d});
          if(!bomb.isSpike)break; else continue;}
        tiles.push({i:nx,j:ny,d:d});
        var ob2=bombAt(nx,ny);
        if(ob2&&!ob2.dead&&ob2!==bomb){ob2.dead=true;queue.push(ob2);}
      }
    }
  }
  blasts.push({tiles:tiles,t:BLAST_TIME,max:BLAST_TIME,owner:owner});
  spawnParticles(cx,cy,8,1.0,0.8,0.35);
  Audio_.boom();
  shake=Math.min(1,shake+0.6);
  blastDestroysPowerups(tiles);
  if(exitPos.active && exitPos.hitCooldown<=0){
    var hitExit=false;
    for(var ti=0;ti<tiles.length;ti++){
      if(tiles[ti].i===exitPos.i && tiles[ti].j===exitPos.j){hitExit=true;break;}
    }
    if(hitExit){
      exitPos.hitCooldown=6.0;
      var spawned=spawnEnemiesFromPortal(2+((Math.random()*2)|0));
      if(spawned>0) tickerPush(null,'<b>Portal hit!</b> '+spawned+' enemies emerged.');
    }
  }
  if(bomb.isCluster){
    for(var cd=0;cd<4;cd++){
      var cnx=cx+DIRS[cd][0],cny=cy+DIRS[cd][1];
      if(!inB(cnx,cny))continue;
      if(grid[cny*GW+cnx]===1)continue;
      (function(ni,nj,own){
        setTimeout(function(){
          if(state!=='playing')return;
          var small=[{i:ni,j:nj,d:-1}];
          for(var dd=0;dd<4;dd++){
            var sx=ni+DIRS[dd][0],sy=nj+DIRS[dd][1];
            if(!inB(sx,sy))continue;
            var gv=grid[sy*GW+sx];
            if(gv===1)continue;
            if(gv===2){destroyBrick(sx,sy,own);small.push({i:sx,j:sy,d:dd});continue;}
            small.push({i:sx,j:sy,d:dd});
            var ob=bombAt(sx,sy);
            if(ob&&!ob.dead){ob.dead=true;queue.push(ob);}
          }
          blasts.push({tiles:small,t:0.28,max:0.28,owner:own});
          spawnParticles(ni,nj,5,1.0,0.5,0.2);
          blastDestroysPowerups(small);
          Audio_.boom();
        },140);
      })(cnx,cny,owner);
    }
  }
}
function detonate(bomb){
  if(bomb.dead)return;
  bomb.dead=true;
  var queue=[bomb];
  var guard=0;
  while(queue.length && guard++<128){
    detonateSingle(queue.pop(),queue);
  }
}

/* ============== BOMBS ============== */
function countActiveBombs(pl){
  var n=0;for(var i=0;i<bombs.length;i++)if(bombs[i].owner===pl&&!bombs[i].dead)n++;return n;
}
function createBombAt(pl,i,j){
  var fire=pl.fire;
  if(pl.powerBombReady&&countActiveBombs(pl)===0){
    fire=Math.max(GW,GH);pl.powerBombReady=false;
    if(!pl.cpu) tickerPush(38,'<b>Power Bomb!</b> Max blast radius.');
  }
  bombs.push({
    i:i,j:j,
    px:i+0.5,py:j+0.5,
    t:BOMB_FUSE,fire:fire,dead:false,owner:pl,
    isRemote:pl.remoteControl,isSpike:pl.spikeBomb,isCluster:pl.clusterBomb,
    isDangerous:pl.dangerousBomb,isLandMine:pl.landMine,isBouncy:pl.bouncyBomb,
    kickVX:0,kickVY:0,age:0});
  Audio_.place();
}
function placeBomb(pl){
  if(!pl.alive||state!=='playing')return;
  var t=tileOfPl(pl);
  if(bombAt(t.i,t.j))return;
  if(countActiveBombs(pl)>=pl.maxBombs)return;
  createBombAt(pl,t.i,t.j);
}
function lineDrop(pl){
  if(!pl.alive||state!=='playing')return;
  var t=tileOfPl(pl);var dx=DIRS[pl.dir][0],dy=DIRS[pl.dir][1];
  var can=pl.maxBombs-countActiveBombs(pl);
  for(var k=0;k<can;k++){
    var ni=t.i+dx*k,nj=t.j+dy*k;
    if(!inB(ni,nj)||grid[nj*GW+ni]!==0||bombAt(ni,nj))break;
    createBombAt(pl,ni,nj);
  }
}
function detonateRemote(pl){
  if(!pl) return;
  var oldest=null,oldestAge=-1;
  for(var i=0;i<bombs.length;i++){
    var b=bombs[i];
    if(b.owner===pl && !b.dead && b.isRemote){
      if(b.age>oldestAge){oldestAge=b.age;oldest=b;}
    }
  }
  if(oldest){ detonate(oldest); shake=Math.min(1,shake+0.3); }
}

/* ============== PICKUPS ============== */
function isPrizeUseful(pl,def){
  var id=def.id;
  if(id==='bomb') return pl.maxBombs<8;
  if(id==='fire') return pl.fire<10;
  if(id==='speed') return pl.speed<8.5;
  if(id==='fullfire') return pl.fire<Math.max(GW,GH);
  if(id==='heart') return pl.hearts<3;
  if(id==='oneup') return pl.lives<9;
  if(id==='vest') return true;
  if(id==='remote') return !pl.remoteControl;
  if(id==='power') return !pl.powerBombReady;
  if(id==='spike') return !pl.spikeBomb;
  if(id==='bouncy') return !pl.bouncyBomb;
  if(id==='mine') return !pl.landMine;
  if(id==='cluster') return !pl.clusterBomb;
  if(id==='danger') return !pl.dangerousBomb;
  if(id==='kick') return !pl.bombKick;
  if(id==='glove') return !pl.glove;
  if(id==='bpass') return !pl.bombPass;
  if(id==='wpass') return !pl.wallPass;
  if(id==='fpass') return !pl.firePass;
  if(id==='line') return !pl.lineBomb;
  if(id==='clock') return true;
  if(id==='key') return !pl.hasKey;
  return true;
}
function applyPU(pl,p){
  var id=p.def.id;
  if(id==='bomb')pl.maxBombs=Math.min(8,pl.maxBombs+1);
  else if(id==='fire')pl.fire=Math.min(10,pl.fire+1);
  else if(id==='speed')pl.speed=Math.min(8.5,pl.speed+0.55);
  else if(id==='fullfire')pl.fire=Math.max(GW,GH);
  else if(id==='heart')pl.hearts=Math.min(3,pl.hearts+1);
  else if(id==='oneup')pl.lives=Math.min(9,pl.lives+1);
  else if(id==='vest')pl.vestT=10;
  else if(id==='remote')pl.remoteControl=true;
  else if(id==='power')pl.powerBombReady=true;
  else if(id==='spike')pl.spikeBomb=true;
  else if(id==='bouncy')pl.bouncyBomb=true;
  else if(id==='mine')pl.landMine=true;
  else if(id==='cluster')pl.clusterBomb=true;
  else if(id==='danger')pl.dangerousBomb=true;
  else if(id==='kick')pl.bombKick=true;
  else if(id==='glove')pl.glove=true;
  else if(id==='bpass')pl.bombPass=true;
  else if(id==='wpass')pl.wallPass=true;
  else if(id==='fpass')pl.firePass=true;
  else if(id==='line')pl.lineBomb=true;
  else if(id==='clock')frozenT=Math.max(frozenT,4);
  else if(id==='key'){pl.hasKey=true;exitPos.active=true;}
  else if(id==='gem')addScore(pl,500);
  addScore(pl,50);
  Audio_.pickup();
  spawnParticles(p.i,p.j,6,0.5,1.0,0.8);
  updateHud();
  if(!pl.cpu) tickerPush(p.def.tile, p.def.text);
}
function checkPickups(){
  for(var pi=0;pi<players.length;pi++){
    var pl=players[pi];
    if(!pl.alive)continue;
    var ci=Math.round(pl.px-0.5),cj=Math.round(pl.py-0.5);
    for(var i=powerups.length-1;i>=0;i--){
      var p=powerups[i];
      if(p.spawnGrace>0) continue;
      if(p.i===ci&&p.j===cj){
        if(isPrizeUseful(pl,p.def)){
          applyPU(pl,p);
          powerups.splice(i,1);
        }
      }
    }
  }
}
function playerDropPrizes(pl){
  var deathI=Math.round(pl.px-0.5);
  var deathJ=Math.round(pl.py-0.5);
  var items=[];
  for(var i=1;i<pl.maxBombs;i++) items.push('bomb');
  for(var f=0;f<pl.fire-2;f++) items.push('fire');
  var spdLv=Math.round((pl.speed-4.4)/0.55);
  for(var s=0;s<spdLv;s++) items.push('speed');
  if(pl.remoteControl) items.push('remote');
  if(pl.spikeBomb) items.push('spike');
  if(pl.bouncyBomb) items.push('bouncy');
  if(pl.landMine) items.push('mine');
  if(pl.clusterBomb) items.push('cluster');
  if(pl.dangerousBomb) items.push('danger');
  if(pl.bombKick) items.push('kick');
  if(pl.glove) items.push('glove');
  if(pl.bombPass) items.push('bpass');
  if(pl.wallPass) items.push('wpass');
  if(pl.firePass) items.push('fpass');
  if(pl.lineBomb) items.push('line');

  pl.maxBombs=1;pl.fire=2;pl.speed=4.4;
  pl.remoteControl=false;pl.spikeBomb=false;pl.bouncyBomb=false;
  pl.landMine=false;pl.clusterBomb=false;pl.dangerousBomb=false;
  pl.bombKick=false;pl.glove=false;pl.bombPass=false;
  pl.wallPass=false;pl.firePass=false;pl.lineBomb=false;

  if(items.length===0) return;
  var dirs=[[0,-1],[1,0],[0,1],[-1,0]];
  var placed=0;
  var maxDist=Math.max(GW,GH)+2;
  for(var dist=2; dist<=maxDist && placed<items.length; dist++){
    for(var d=0; d<4 && placed<items.length; d++){
      var baseI=deathI+dirs[d][0]*dist;
      var baseJ=deathJ+dirs[d][1]*dist;
      var offsets=[[0,0],[1,0],[-1,0],[0,1],[0,-1]];
      for(var c=0;c<5;c++){
        var ci=baseI+offsets[c][0], cj=baseJ+offsets[c][1];
        if(!inB(ci,cj)) continue;
        if(grid[cj*GW+ci]!==0) continue;
        if(bombAt(ci,cj)) continue;
        if(powerupAt(ci,cj)) continue;
        var def=PU_BY_ID[items[placed]];
        if(def){
          powerups.push({i:ci,j:cj,def:def,t:0,spawnGrace:0.5});
          placed++;
          break;
        }
      }
    }
  }
}
function maybeDropOneUp(pl){
  if(!cpuHostile) return;
  var chance;
  if(pl.lives<=0) chance=0.55;
  else if(pl.lives===1) chance=0.35;
  else if(pl.lives===2) chance=0.20;
  else if(pl.lives===3) chance=0.12;
  else chance=0.06;
  if(Math.random()>=chance) return;
  var deathI=Math.round(pl.px-0.5);
  var deathJ=Math.round(pl.py-0.5);
  var dirs=[[0,-1],[1,0],[0,1],[-1,0]];
  for(var dist=1; dist<=5; dist++){
    for(var d=0; d<4; d++){
      var ni=deathI+dirs[d][0]*dist;
      var nj=deathJ+dirs[d][1]*dist;
      if(!inB(ni,nj)) continue;
      if(grid[nj*GW+ni]!==0) continue;
      if(bombAt(ni,nj)) continue;
      if(powerupAt(ni,nj)) continue;
      powerups.push({i:ni,j:nj,def:PU_BY_ID['oneup'],t:0,spawnGrace:0.5});
      tickerPush(35,'<b>1-Up dropped!</b> Grab it!');
      return;
    }
  }
}

/* ============== PLAYER UPDATE ============== */
function updatePlayer(pl,dt){
  if(!pl.alive)return;
  if(pl.invuln>0)pl.invuln=Math.max(0,pl.invuln-dt);
  if(pl.vestT>0)pl.vestT=Math.max(0,pl.vestT-dt);
  if(pl.moving){
    var dx=pl.tx-pl.px,dy=pl.ty-pl.py;
    var dist=Math.sqrt(dx*dx+dy*dy);
    var step=pl.speed*dt;
    if(step>=dist){pl.px=pl.tx;pl.py=pl.ty;pl.moving=false;checkPickups();}
    else{pl.px+=dx/dist*step;pl.py+=dy/dist*step;}
    return;
  }
  var d=pl.input.dirOrder.length?pl.input.dirOrder[pl.input.dirOrder.length-1]:-1;
  if(d>=0){
    pl.dir=d;
    var ci=Math.round(pl.px-0.5),cj=Math.round(pl.py-0.5);
    var nx=ci+DIRS[d][0],ny=cj+DIRS[d][1];
    var b=bombAt(nx,ny);
    if(b&&!b.dead&&pl.bombKick&&!pl.glove&&!b.kickVX&&!b.kickVY){
      if(pl.bouncyBomb){
        var dirsTmp=[[1,0],[-1,0],[0,1],[0,-1]];
        for(var si=dirsTmp.length-1;si>0;si--){
          var sj=(Math.random()*(si+1))|0;
          var tp=dirsTmp[si];dirsTmp[si]=dirsTmp[sj];dirsTmp[sj]=tp;
        }
        for(var di=0;di<4;di++){
          var rx=dirsTmp[di][0],ry=dirsTmp[di][1];
          var rti=nx+rx,rtj=ny+ry;
          if(inB(rti,rtj)&&grid[rtj*GW+rti]===0&&!bombAt(rti,rtj)){
            b.kickVX=rx;b.kickVY=ry;break;
          }
        }
        if(!b.kickVX&&!b.kickVY){ b.kickVX=DIRS[d][0]; b.kickVY=DIRS[d][1]; }
      } else {
        b.kickVX=DIRS[d][0];
        b.kickVY=DIRS[d][1];
      }
    }
    if(canWalkPlayer(nx,ny,pl)){pl.tx=nx+0.5;pl.ty=ny+0.5;pl.moving=true;}
  }
}
var KICK_SPEED=7.0;
function updateBomb(b,dt){
  if(b.dead)return;
  b.age+=dt;
  if(b.isLandMine){
    for(var e=0;e<enemies.length;e++){
      var en=enemies[e];
      if(!en.alive)continue;
      if(Math.abs(en.px-(b.i+0.5))<0.45&&Math.abs(en.py-(b.j+0.5))<0.45){detonate(b);return;}
    }
  }
  if(b.kickVX||b.kickVY){
    var nx=b.px+b.kickVX*KICK_SPEED*dt;
    var ny=b.py+b.kickVY*KICK_SPEED*dt;
    var ti=Math.round(nx-0.5),tj=Math.round(ny-0.5);
    var blocked=false;
    if(!inB(ti,tj)||grid[tj*GW+ti]!==0) blocked=true;
    if(!blocked){
      var other=bombAt(ti,tj);
      if(other && other!==b) blocked=true;
    }
    if(blocked){
      if(b.isBouncy){
        var bounced=false;
        if(b.kickVX){
          var nx2=b.px-b.kickVX*KICK_SPEED*dt;
          var ti2=Math.round(nx2-0.5);
          if(inB(ti2,b.j)&&grid[b.j*GW+ti2]===0&&!bombAt(ti2,b.j)){
            b.kickVX=-b.kickVX;
            b.px=Math.max(0.5,Math.min(GW-0.5,b.px+b.kickVX*KICK_SPEED*dt));
            bounced=true;
          }
        }
        if(!bounced && b.kickVY){
          var ny2=b.py-b.kickVY*KICK_SPEED*dt;
          var tj2=Math.round(ny2-0.5);
          if(inB(b.i,tj2)&&grid[tj2*GW+b.i]===0&&!bombAt(b.i,tj2)){
            b.kickVY=-b.kickVY;
            b.py=Math.max(0.5,Math.min(GH-0.5,b.py+b.kickVY*KICK_SPEED*dt));
            bounced=true;
          }
        }
        if(!bounced){
          var allDirs=[[1,0],[-1,0],[0,1],[0,-1]];
          for(var di2=0;di2<4;di2++){
            var rx=allDirs[di2][0],ry=allDirs[di2][1];
            var rti=b.i+rx,rtj=b.j+ry;
            if(inB(rti,rtj)&&grid[rtj*GW+rti]===0&&!bombAt(rti,rtj)){
              b.kickVX=rx;b.kickVY=ry;
              b.px+=rx*KICK_SPEED*dt;
              b.py+=ry*KICK_SPEED*dt;
              bounced=true;break;
            }
          }
        }
        if(!bounced){
          b.kickVX=0;b.kickVY=0;
          b.i=Math.round(b.px-0.5);b.j=Math.round(b.py-0.5);
          b.px=b.i+0.5;b.py=b.j+0.5;
        }
      } else {
        b.kickVX=0;b.kickVY=0;
        b.i=Math.round(b.px-0.5);b.j=Math.round(b.py-0.5);
        b.px=b.i+0.5;b.py=b.j+0.5;
      }
    } else {
      b.px=nx;b.py=ny;
      b.i=ti;b.j=tj;
    }
  } else {
    b.px=b.i+0.5;b.py=b.j+0.5;
  }
  if(b.isRemote)return;
  b.t-=dt;
  if(b.t<=0)detonate(b);
}

/* ============== ENEMY UPDATE ============== */
function isDangerousTile(i,j){
  for(var k=0;k<blasts.length;k++){
    var tl=blasts[k].tiles;
    for(var m=0;m<tl.length;m++)if(tl[m].i===i&&tl[m].j===j)return true;
  }
  for(var b=0;b<bombs.length;b++){
    var bm=bombs[b];
    if(bm.dead)continue;
    if(bm.isRemote||bm.isLandMine)continue;
    if(bm.i===i&&bm.j===j)return true;
    if(bm.i===i){
      var d=bm.j-j;
      if(Math.abs(d)<=bm.fire){
        var st=d>0?1:-1,blocked=false;
        for(var r=1;r<Math.abs(d);r++)if(grid[(bm.j+st*r)*GW+bm.i]!==0){blocked=true;break;}
        if(!blocked)return true;
      }
    }
    if(bm.j===j){
      var d2=bm.i-i;
      if(Math.abs(d2)<=bm.fire){
        var st2=d2>0?1:-1,blocked2=false;
        for(var r2=1;r2<Math.abs(d2);r2++)if(grid[bm.j*GW+(bm.i+st2*r2)]!==0){blocked2=true;break;}
        if(!blocked2)return true;
      }
    }
  }
  return false;
}
function updateEnemy(en,dt){
  if(!en.alive)return;
  en.t+=dt;
  if(en.moving){
    var dx=en.tx-en.px,dy=en.ty-en.py;
    var dist=Math.sqrt(dx*dx+dy*dy);
    var step=en.speed*dt;
    if(step>=dist){en.px=en.tx;en.py=en.ty;en.moving=false;}
    else{en.px+=dx/dist*step;en.py+=dy/dist*step;}
    return;
  }
  var ci=Math.round(en.px-0.5),cj=Math.round(en.py-0.5);
  var dirs=[];
  for(var d=0;d<4;d++){
    var nx=ci+DIRS[d][0],ny=cj+DIRS[d][1];
    if(canWalkEnemy(nx,ny,en)&&!isDangerousTile(nx,ny))dirs.push(d);
  }
  if(dirs.length===0){
    for(var d2=0;d2<4;d2++){
      var nx2=ci+DIRS[d2][0],ny2=cj+DIRS[d2][1];
      if(canWalkEnemy(nx2,ny2,en))dirs.push(d2);
    }
  }
  if(dirs.length===0)return;
  var chosen=-1;
  if(en.type.smart){
    var best=null,bd=1e9;
    for(var pi=0;pi<players.length;pi++){
      var pl=players[pi];
      if(!pl.alive)continue;
      var ddx=pl.px-en.px,ddy=pl.py-en.py;
      var dd=ddx*ddx+ddy*ddy;
      if(dd<bd){bd=dd;best=pl;}
    }
    if(best){
      var pti=Math.round(best.px-0.5),ptj=Math.round(best.py-0.5);
      if(ci===pti){var s=ptj>cj?2:0;if(dirs.indexOf(s)>=0)chosen=s;}
      else if(cj===ptj){var s2=pti>ci?1:3;if(dirs.indexOf(s2)>=0)chosen=s2;}
      else{
        var dxp=pti-ci,dyp=ptj-cj;
        var pref=Math.abs(dxp)>Math.abs(dyp)?(dxp>0?1:3):(dyp>0?2:0);
        if(dirs.indexOf(pref)>=0)chosen=pref;
      }
    }
  }
  if(chosen<0){
    var rev=(en.dir+2)&3;var noRev=[];
    for(var i=0;i<dirs.length;i++)if(dirs[i]!==rev)noRev.push(dirs[i]);
    var pool=noRev.length?noRev:dirs;
    chosen=pool[(Math.random()*pool.length)|0];
  }
  en.dir=chosen;
  en.tx=ci+DIRS[chosen][0]+0.5;
  en.ty=cj+DIRS[chosen][1]+0.5;
  en.moving=true;
}

/* ============== CPU AI ============== */
function markBombDanger(danger,bi,bj,fire,isDangerous,isSpike,isCluster){
  if(!inB(bi,bj))return;
  danger[bj*GW+bi]=1;
  if(isDangerous){
    for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++){
      var ni=bi+dx,nj=bj+dy;
      if(inB(ni,nj))danger[nj*GW+ni]=1;
    }
    return;
  }
  var f=fire+(isCluster?1:0);
  for(var d=0;d<4;d++){
    var ddx=DIRS[d][0],ddy=DIRS[d][1];
    for(var r=1;r<=f;r++){
      var ni2=bi+ddx*r,nj2=bj+ddy*r;
      if(!inB(ni2,nj2))break;
      var gv=grid[nj2*GW+ni2];
      if(gv===1)break;
      danger[nj2*GW+ni2]=1;
      if(gv===2&&!isSpike)break;
    }
  }
}
function fillDangerMap(danger){
  danger.fill(0);
  for(var k=0;k<blasts.length;k++){
    var tl=blasts[k].tiles;
    for(var m=0;m<tl.length;m++)danger[tl[m].j*GW+tl[m].i]=1;
  }
  for(var b=0;b<bombs.length;b++){
    var bm=bombs[b];
    if(bm.dead||bm.isRemote||bm.isLandMine)continue;
    markBombDanger(danger,bm.i,bm.j,bm.fire,bm.isDangerous,bm.isSpike,bm.isCluster);
  }
}
function fillThreatMap(t,self,includePlayers){
  t.fill(0);
  for(var e=0;e<enemies.length;e++){
    var en=enemies[e];
    if(!en.alive)continue;
    var ei=Math.round(en.px-0.5),ej=Math.round(en.py-0.5);
    for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++){
      var ni=ei+dx,nj=ej+dy;
      if(inB(ni,nj))t[nj*GW+ni]=1;
    }
    if(en.moving){
      var ti=Math.round(en.tx-0.5),tj=Math.round(en.ty-0.5);
      if(inB(ti,tj))t[tj*GW+ti]=1;
    }
  }
  if(includePlayers){
    for(var p=0;p<players.length;p++){
      var o=players[p];
      if(!o.alive||o===self)continue;
      var oi=Math.round(o.px-0.5),oj=Math.round(o.py-0.5);
      for(var dx2=-1;dx2<=1;dx2++)for(var dy2=-1;dy2<=1;dy2++){
        var ni2=oi+dx2,nj2=oj+dy2;
        if(inB(ni2,nj2))t[nj2*GW+ni2]=1;
      }
    }
  }
}
function findEscapeDirection(pl,ci,cj,danger,maxDepth){
  if(maxDepth===undefined)maxDepth=10;
  if(!inB(ci,cj))return -1;
  _bfsVisited.fill(0);
  var qi=_bfsQ,qj=_bfsQD,qf=_bfsQF;
  qi[0]=ci;qj[0]=cj;qf[0]=-1;
  var depths=[0];
  _bfsVisited[cj*GW+ci]=1;
  var head=0,tail=1;
  while(head<tail){
    var curI=qi[head],curJ=qj[head],curF=qf[head],curD=depths[head];
    head++;
    if(curD>0 && !danger[curJ*GW+curI] && !bombAt(curI,curJ)) return curF;
    if(curD>=maxDepth)continue;
    for(var d=0;d<4;d++){
      var nx=curI+DIRS[d][0],ny=curJ+DIRS[d][1];
      if(!inB(nx,ny))continue;
      if(_bfsVisited[ny*GW+nx])continue;
      var b=bombAt(nx,ny);
      if(b && !(pl.bombPass||pl.glove))continue;
      if(!canWalkPlayer(nx,ny,pl))continue;
      _bfsVisited[ny*GW+nx]=1;
      qi[tail]=nx;qj[tail]=ny;qf[tail]=curF>=0?curF:d;
      depths[tail]=curD+1;
      tail++;
    }
  }
  return -1;
}
function findLeastBadDirection(pl,ci,cj,danger){
  var best=-1,bestCount=999;
  for(var d=0;d<4;d++){
    var nx=ci+DIRS[d][0],ny=cj+DIRS[d][1];
    if(!canWalkPlayer(nx,ny,pl))continue;
    if(bombAt(nx,ny))continue;
    var cnt=0;
    for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++){
      var ti=nx+dx,tj=ny+dy;
      if(inB(ti,tj)&&danger[tj*GW+ti])cnt++;
    }
    if(cnt<bestCount){bestCount=cnt;best=d;}
  }
  return best;
}
function setCpuDir(pl,d,isEscape){
  pl.input.dirOrder.length=0;
  pl.input.dirOrder.push(d);
  pl.aiEscaping=!!isEscape;
}
function cancelMove(pl){
  pl.tx=Math.round(pl.px-0.5)+0.5;
  pl.ty=Math.round(pl.py-0.5)+0.5;
}
function bfsPathTo(pl,ci,cj,ti,tj,danger,maxDepth){
  if(ci===ti && cj===tj) return -1;
  _bfsVisited.fill(0);
  var qi=_bfsQ,qj=_bfsQD,qf=_bfsQF;
  qi[0]=ci;qj[0]=cj;qf[0]=-1;
  var depths=[0];
  _bfsVisited[cj*GW+ci]=1;
  var head=0,tail=1;
  while(head<tail){
    var curI=qi[head],curJ=qj[head],curF=qf[head],curD=depths[head];
    head++;
    if(curI===ti && curJ===tj)return curF;
    if(curD>=maxDepth)continue;
    for(var d=0;d<4;d++){
      var nx=curI+DIRS[d][0],ny=curJ+DIRS[d][1];
      if(!inB(nx,ny))continue;
      if(_bfsVisited[ny*GW+nx])continue;
      if(!canWalkPlayer(nx,ny,pl))continue;
      if(danger[ny*GW+nx])continue;
      _bfsVisited[ny*GW+nx]=1;
      qi[tail]=nx;qj[tail]=ny;qf[tail]=curF>=0?curF:d;
      depths[tail]=curD+1;
      tail++;
    }
  }
  return -1;
}
function tileInBlast(bomb,ti,tj){
  if(bomb.i===ti && bomb.j===tj)return true;
  if(bomb.isDangerous)return Math.abs(bomb.i-ti)<=1 && Math.abs(bomb.j-tj)<=1;
  if(bomb.i===ti){
    var d=Math.abs(bomb.j-tj);
    if(d>bomb.fire)return false;
    var st=tj>bomb.j?1:-1;
    for(var r=1;r<d;r++) if(grid[(bomb.j+st*r)*GW+bomb.i]!==0) return false;
    return true;
  }
  if(bomb.j===tj){
    var d2=Math.abs(bomb.i-ti);
    if(d2>bomb.fire)return false;
    var st2=ti>bomb.i?1:-1;
    for(var r2=1;r2<d2;r2++) if(grid[bomb.j*GW+(bomb.i+st2*r2)]!==0) return false;
    return true;
  }
  return false;
}
function tryRemoteDetonate(pl,ci,cj){
  if(!pl.remoteControl)return false;
  var myRemotes=[];
  for(var i=0;i<bombs.length;i++){
    var b=bombs[i];
    if(b.owner===pl && b.isRemote && !b.dead) myRemotes.push(b);
  }
  if(myRemotes.length===0)return false;
  var best=null;
  for(var j=0;j<myRemotes.length;j++){
    var bm=myRemotes[j];
    var worth=false;
    for(var k=0;k<enemies.length;k++){
      var en=enemies[k];
      if(!en.alive)continue;
      var ei=Math.round(en.px-0.5),ej=Math.round(en.py-0.5);
      if(tileInBlast(bm,ei,ej)){worth=true;break;}
    }
    if(!worth && bm.age>5) worth=true;
    if(worth){best=bm;break;}
  }
  if(!best)return false;
  var sim=_combinedBuf;sim.fill(0);
  for(var n=0;n<blasts.length;n++){
    for(var t=0;t<blasts[n].tiles.length;t++){
      sim[blasts[n].tiles[t].j*GW+blasts[n].tiles[t].i]=1;
    }
  }
  markBombDanger(sim,best.i,best.j,best.fire,best.isDangerous,best.isSpike,best.isCluster);
  if(sim[cj*GW+ci])return false;
  pl.input.detonate=true;
  return true;
}
function pickCpuTarget(pl,ci,cj){
  var bestPU=null,bestPUD=1e9;
  for(var p=0;p<powerups.length;p++){
    var pu=powerups[p];
    if(!isPrizeUseful(pl,pu.def)) continue;
    var nearHuman=false;
    for(var q=0;q<players.length;q++){
      var o=players[q];
      if(!o.alive || o.cpu) continue;
      var d=Math.abs(Math.round(o.px-0.5)-pu.i)+Math.abs(Math.round(o.py-0.5)-pu.j);
      if(d<6){nearHuman=true;break;}
    }
    if(nearHuman) continue;
    var ddx2=pu.i-ci,ddy2=pu.j-cj;
    var dd2=ddx2*ddx2+ddy2*ddy2;
    if(dd2<bestPUD){bestPUD=dd2;bestPU={i:pu.i,j:pu.j};}
  }
  var enemyNear=false;
  for(var e=0;e<enemies.length;e++){
    var en=enemies[e];
    if(!en.alive)continue;
    var edx=en.px-pl.px,edy=en.py-pl.py;
    if(edx*edx+edy*edy<9.0){enemyNear=true;break;}
  }
  if(bestPU && bestPUD<16 && !enemyNear) return bestPU;
  var bestE=null,bestED=1e9;
  for(var e2=0;e2<enemies.length;e2++){
    var en2=enemies[e2];
    if(!en2.alive)continue;
    var dx=en2.px-pl.px,dy=en2.py-pl.py;
    var d2=dx*dx+dy*dy;
    if(d2<bestED){bestED=d2;bestE={i:Math.round(en2.px-0.5),j:Math.round(en2.py-0.5),d2:d2};}
  }
  var bestOp=null,bestOpD=1e9;
  if(cpuHostile){
    for(var op=0;op<players.length;op++){
      var o=players[op];
      if(!o.alive||o===pl)continue;
      var odx=o.px-pl.px,ody=o.py-pl.py;
      var od2=odx*odx+ody*ody;
      if(od2<bestOpD){bestOpD=od2;bestOp={i:Math.round(o.px-0.5),j:Math.round(o.py-0.5),d2:od2};}
    }
  }
  if(bestOp && bestOp.d2 < bestED) return bestOp;
  if(bestE) return bestE;
  if(bestPU && bestPUD<64) return bestPU;
  if(exitPos.active || pl.hasKey) return {i:exitPos.i,j:exitPos.j};
  var bestB=null,bestBD=1e9;
  for(var by=1;by<GH-1;by++)for(var bx=1;bx<GW-1;bx++){
    if(grid[by*GW+bx]!==2)continue;
    var ddx3=bx-ci,ddy3=by-cj;
    var dd3=ddx3*ddx3+ddy3*ddy3;
    if(dd3<bestBD){bestBD=dd3;bestB={i:bx,j:by};}
  }
  return bestB;
}
function isBombUseful(pl,ci,cj){
  for(var e=0;e<enemies.length;e++){
    var en=enemies[e];
    if(!en.alive)continue;
    var ddx=en.px-(ci+0.5),ddy=en.py-(cj+0.5);
    if(ddx*ddx+ddy*ddy<6.25)return true;
  }
  if(cpuHostile){
    for(var o=0;o<players.length;o++){
      var p=players[o];
      if(!p.alive||p===pl)continue;
      var dx=p.px-(ci+0.5),dy=p.py-(cj+0.5);
      if(dx*dx+dy*dy<9.0)return true;
    }
  }
  for(var dd=0;dd<4;dd++){
    var bx=ci+DIRS[dd][0],by=cj+DIRS[dd][1];
    if(inB(bx,by)&&grid[by*GW+bx]===2)return true;
  }
  return false;
}
function avoidOscillation(pl,ci,cj,dir,target,danger){
  if(pl.aiLastDir<0)return dir;
  var rev=(pl.aiLastDir+2)&3;
  if(dir!==rev)return dir;
  var bestAlt=dir,bestScore=1e9;
  for(var d=0;d<4;d++){
    if(d===dir)continue;
    var nx=ci+DIRS[d][0],ny=cj+DIRS[d][1];
    if(canWalkPlayer(nx,ny,pl)&&!danger[ny*GW+nx]&&!bombAt(nx,ny)){
      var dxt=target.i-nx,dyt=target.j-ny;
      var score=dxt*dxt+dyt*dyt;
      if(score<bestScore){bestScore=score;bestAlt=d;}
    }
  }
  return bestAlt;
}
function updateCPU(pl,dt){
  if(!pl.alive)return;
  if(pl.moving){
    var destI=Math.round(pl.tx-0.5),destJ=Math.round(pl.ty-0.5);
    if(inB(destI,destJ)){
      var destBomb=bombAt(destI,destJ);
      if(destBomb && !(pl.bombPass||pl.glove)){cancelMove(pl);return;}
      if(!pl.firePass){
        for(var k=0;k<blasts.length;k++){
          var tl=blasts[k].tiles;
          for(var m=0;m<tl.length;m++){
            if(tl[m].i===destI && tl[m].j===destJ){cancelMove(pl);return;}
          }
        }
      }
      for(var e0=0;e0<enemies.length;e0++){
        var en0=enemies[e0];
        if(!en0.alive)continue;
        var e0i=Math.round(en0.px-0.5),e0j=Math.round(en0.py-0.5);
        if(e0i===destI && e0j===destJ){cancelMove(pl);return;}
      }
      if(cpuHostile){
        for(var op0=0;op0<players.length;op0++){
          var o0=players[op0];
          if(!o0.alive||o0===pl)continue;
          if(Math.round(o0.px-0.5)===destI && Math.round(o0.py-0.5)===destJ){cancelMove(pl);return;}
        }
      }
    }
    return;
  }
  var ci=Math.round(pl.px-0.5),cj=Math.round(pl.py-0.5);
  if(!inB(ci,cj))return;
  var tileCode=cj*GW+ci;
  if(pl.aiLastTile===tileCode)pl.aiStuckFrames++;
  else{pl.aiStuckFrames=0;pl.aiLastTile=tileCode;}
  var danger=_dangerBuf,threat=_threatBuf,combined=_combinedBuf;
  fillDangerMap(danger);
  fillThreatMap(threat,pl,cpuHostile);
  var n=GW*GH;
  for(var i=0;i<n;i++) combined[i]=(danger[i]||threat[i])?1:0;
  var onBombTile=!!bombAt(ci,cj);
  var inDangerNow;
  if(pl.firePass){inDangerNow=onBombTile && !(pl.bombPass||pl.glove);}
  else{inDangerNow=onBombTile || !!danger[cj*GW+ci];}

  var nearestThreatD2=1e9;
  for(var e=0;e<enemies.length;e++){
    var en=enemies[e];
    if(!en.alive)continue;
    var ddx=en.px-pl.px,ddy=en.py-pl.py;
    var d2=ddx*ddx+ddy*ddy;
    if(d2<nearestThreatD2)nearestThreatD2=d2;
  }
  if(cpuHostile){
    for(var o=0;o<players.length;o++){
      var p=players[o];
      if(!p.alive||p===pl)continue;
      var odx=p.px-pl.px,ody=p.py-pl.py;
      var od2=odx*odx+ody*ody;
      if(od2<nearestThreatD2)nearestThreatD2=od2;
    }
  }
  if(nearestThreatD2<3.5){
    var fleeBest=-1,fleeScore=-1e9;
    for(var fd=0;fd<4;fd++){
      var fnx=ci+DIRS[fd][0],fny=cj+DIRS[fd][1];
      if(!canWalkPlayer(fnx,fny,pl))continue;
      if(bombAt(fnx,fny) && !(pl.bombPass||pl.glove))continue;
      if(danger[fny*GW+fnx])continue;
      var mind=1e9;
      for(var q=0;q<enemies.length;q++){
        var en2=enemies[q];
        if(!en2.alive)continue;
        var qx=en2.px-(fnx+0.5),qy=en2.py-(fny+0.5);
        var qd=qx*qx+qy*qy;
        if(qd<mind)mind=qd;
      }
      if(cpuHostile){
        for(var q2=0;q2<players.length;q2++){
          var o2=players[q2];
          if(!o2.alive||o2===pl)continue;
          var q2x=o2.px-(fnx+0.5),q2y=o2.py-(fny+0.5);
          var q2d=q2x*q2x+q2y*q2y;
          if(q2d<mind)mind=q2d;
        }
      }
      if(threat[fny*GW+fnx])mind-=4;
      if(pl.aiLastDir>=0 && fd===((pl.aiLastDir+2)&3))mind-=1.5;
      if(mind>fleeScore){fleeScore=mind;fleeBest=fd;}
    }
    if(fleeBest>=0){pl.aiLastDir=fleeBest;setCpuDir(pl,fleeBest,true);return;}
  }
  pl.aiCooldown-=dt;
  if(!inDangerNow && pl.aiCooldown>0) return;
  pl.aiCooldown=0.05;
  if(inDangerNow){
    var esc=findEscapeDirection(pl,ci,cj,combined,10);
    if(esc<0)esc=findEscapeDirection(pl,ci,cj,danger,10);
    if(esc>=0){pl.aiLastDir=esc;pl.aiReversalCount=0;setCpuDir(pl,esc,true);return;}
    var lb=findLeastBadDirection(pl,ci,cj,danger);
    if(lb>=0){pl.aiLastDir=lb;setCpuDir(pl,lb,true);return;}
    for(var dd=0;dd<4;dd++){
      var nx0=ci+DIRS[dd][0],ny0=cj+DIRS[dd][1];
      if(canWalkPlayer(nx0,ny0,pl)&&!bombAt(nx0,ny0)){setCpuDir(pl,dd,true);return;}
    }
    return;
  }
  if(pl.aiStuckFrames>10){
    pl.aiStuckFrames=0;
    var opts=[];
    for(var d5=0;d5<4;d5++){
      var sx5=ci+DIRS[d5][0],sy5=cj+DIRS[d5][1];
      if(canWalkPlayer(sx5,sy5,pl)&&!danger[sy5*GW+sx5]&&!bombAt(sx5,sy5))opts.push(d5);
    }
    if(opts.length){
      var revStuck=(pl.aiLastDir>=0)?((pl.aiLastDir+2)&3):-1;
      var filt=opts.filter(function(x){return x!==revStuck;});
      var poolS=filt.length?filt:opts;
      var chosenS=poolS[(Math.random()*poolS.length)|0];
      pl.aiLastDir=chosenS;setCpuDir(pl,chosenS,false);return;
    }
  }
  if(tryRemoteDetonate(pl,ci,cj)) return;
  var myActive=countActiveBombs(pl);
  if(myActive<pl.maxBombs && !bombAt(ci,cj)){
    if(isBombUseful(pl,ci,cj)){
      var simFire=pl.fire;
      if(pl.powerBombReady&&myActive===0)simFire=Math.max(GW,GH);
      if(pl.firePass){
        createBombAt(pl,ci,cj);
      } else {
        var sim=new Uint8Array(danger);
        markBombDanger(sim,ci,cj,simFire,pl.dangerousBomb,pl.spikeBomb,pl.clusterBomb);
        var simCombined=new Uint8Array(GW*GH);
        for(var sc=0;sc<GW*GH;sc++)simCombined[sc]=(sim[sc]||threat[sc])?1:0;
        var escapeDir=findEscapeDirection(pl,ci,cj,simCombined,10);
        if(escapeDir<0)escapeDir=findEscapeDirection(pl,ci,cj,sim,10);
        if(escapeDir>=0){
          createBombAt(pl,ci,cj);
          pl.aiLastDir=escapeDir;
          pl.aiReversalCount=0;
          setCpuDir(pl,escapeDir,true);
          return;
        }
      }
    }
  }
  var target=pickCpuTarget(pl,ci,cj);
  if(target){
    var dir=bfsPathTo(pl,ci,cj,target.i,target.j,combined,24);
    if(dir<0){
      var anyThreat=false;
      for(var ae=0;ae<enemies.length;ae++) if(enemies[ae].alive){anyThreat=true;break;}
      if(!anyThreat && !cpuHostile){
        dir=bfsPathTo(pl,ci,cj,target.i,target.j,danger,24);
      }
    }
    if(dir>=0){
      dir=avoidOscillation(pl,ci,cj,dir,target,danger);
      if(pl.aiLastDir>=0 && dir===((pl.aiLastDir+2)&3))pl.aiReversalCount++;
      else pl.aiReversalCount=0;
      if(pl.aiReversalCount>2){
        pl.aiReversalCount=0;
        var lat=[];
        for(var dl=0;dl<4;dl++){
          if(dl===dir)continue;
          var lx=ci+DIRS[dl][0],ly=cj+DIRS[dl][1];
          if(canWalkPlayer(lx,ly,pl)&&!combined[ly*GW+lx]&&!bombAt(lx,ly))lat.push(dl);
        }
        if(lat.length){dir=lat[(Math.random()*lat.length)|0];}
      }
      pl.aiLastDir=dir;setCpuDir(pl,dir,false);return;
    }
  }
  var safeDirs=[],saferDirs=[];
  for(var d7=0;d7<4;d7++){
    var nx7=ci+DIRS[d7][0],ny7=cj+DIRS[d7][1];
    if(canWalkPlayer(nx7,ny7,pl)&&!danger[ny7*GW+nx7]&&!bombAt(nx7,ny7)){
      safeDirs.push(d7);
      if(!threat[ny7*GW+nx7])saferDirs.push(d7);
    }
  }
  var pickPool=saferDirs.length?saferDirs:safeDirs;
  if(pickPool.length){
    var rev7=(pl.aiLastDir>=0)?((pl.aiLastDir+2)&3):-1;
    var filt7=pickPool.filter(function(x){return x!==rev7;});
    var pool7=filt7.length?filt7:pickPool;
    var pick7=pool7[(Math.random()*pool7.length)|0];
    pl.aiLastDir=pick7;setCpuDir(pl,pick7,false);return;
  }
  var lb2=findLeastBadDirection(pl,ci,cj,danger);
  if(lb2>=0)setCpuDir(pl,lb2,true);
}

/* ============== DEATH & RESPAWN ============== */
function killPlayer(pl){
  if(!pl.alive||pl.invuln>0||pl.vestT>0)return;
  if(pl.hearts>0){
    pl.hearts--;pl.invuln=1.8;Audio_.hurt();
    spawnParticles(Math.round(pl.px-0.5),Math.round(pl.py-0.5),8,1,0.7,0.3);
    if(!pl.cpu) tickerPush(34,'<b>Heart consumed!</b> One fatal hit absorbed.');
    return;
  }
  playerDropPrizes(pl);
  pl.alive=false;pl.lives--;
  maybeDropOneUp(pl);
  flash=1;shake=1;
  Audio_.die();
  updateHud();
  spawnParticles(Math.round(pl.px-0.5),Math.round(pl.py-0.5),12,0.6,0.9,1.0);
  pl.respawnT=1.3;
  var allDead=true;
  for(var j=0;j<players.length;j++){
    var p=players[j];
    if(p.alive||p.lives>0)allDead=false;
  }
  if(allDead){
    state='gameover';
    setTimeout(function(){
      if(state!=='gameover')return;
      showPanel('<h1>GAME<span> OVER</span></h1>'+
        '<div class="sub">THE COURSE WINS THIS ROUND</div>'+
        '<div class="big">TOTAL '+totalScore()+'</div>'+
        '<div class="hint">Reached level '+level+'</div>'+
        '<button data-act="retry">TRY AGAIN</button>'+
        '<div class="row2">'+
        '<button class="alt" data-act="menu">MAIN MENU</button>'+
        '<button class="home" data-act="home">HOME</button>'+
        '</div>');
    },650);
  }
}
function respawnPlayer(pl){
  var idx=pl.id-1;
  var corners=[
    {i:1,j:1},{i:GW-2,j:1},{i:GW-2,j:GH-2},{i:1,j:GH-2}];
  var c=corners[idx]||corners[0];
  pl.px=c.i+0.5;pl.py=c.j+0.5;pl.tx=pl.px;pl.ty=pl.py;
  pl.moving=false;pl.dir=2;pl.alive=true;pl.invuln=2.6;
  pl.input.dirs[0]=false;pl.input.dirs[1]=false;pl.input.dirs[2]=false;pl.input.dirs[3]=false;
  pl.input.dirOrder.length=0;
  pl.aiStuckFrames=0;pl.aiLastTile=-1;pl.aiLastDir=-1;pl.aiReversalCount=0;pl.aiEscaping=false;
  pl.camX=pl.px;pl.camY=pl.py;pl.camTargetX=pl.px;pl.camTargetY=pl.py;
  updateHud();
}

/* ============== CAMERAS ============== */
function updateCameras(dt){
  var f=1-Math.exp(-dt/0.14);
  var W=canvas.width,H=canvas.height;
  var split=splitScreenOn && players.length===2 && !players[0].cpu && !players[1].cpu &&
            players[0].alive && players[1].alive;
  if(split && !wasSplitLastFrame){
    players[0].camX=singleCamX;players[0].camY=singleCamY;
    players[1].camX=singleCamX;players[1].camY=singleCamY;
    if(players[0].px<=players[1].px){players[0].splitSide=0;players[1].splitSide=1;}
    else{players[0].splitSide=1;players[1].splitSide=0;}
  }
  if(!split && wasSplitLastFrame){
    var ax=0,ay=0,n=0;
    for(var t2=0;t2<players.length;t2++){
      if(players[t2].alive){ax+=players[t2].camX;ay+=players[t2].camY;n++;}
    }
    if(n>0){singleCamX=ax/n;singleCamY=ay/n;}
  }
  wasSplitLastFrame=split;
  var cx=0,cy=0,cnt=0;
  for(var i=0;i<players.length;i++){
    if(players[i].alive && !players[i].cpu){cx+=players[i].px;cy+=players[i].py;cnt++;}
  }
  if(cnt===0){
    for(var i2=0;i2<players.length;i2++){
      if(players[i2].alive){cx+=players[i2].px;cy+=players[i2].py;cnt++;}
    }
  }
  if(cnt>0){
    cx/=cnt;cy/=cnt;
    singleCamX+=(cx-singleCamX)*f;
    singleCamY+=(cy-singleCamY)*f;
  }
  if(split){
    var landscape=W>=H;
    for(var k=0;k<2;k++){
      var pl=players[k];
      if(!pl.alive)continue;
      var tx,ty;
      if(landscape){
        var screenCx=(pl.splitSide===0)?(W/4):(3*W/4);
        tx=pl.px-(screenCx)/ts;
        ty=pl.py-(H/2)/ts;
      } else {
        var screenCy2=(pl.splitSide===0)?(H/4):(3*H/4);
        tx=pl.px-(W/2)/ts;
        ty=pl.py-(screenCy2)/ts;
      }
      pl.camTargetX=tx;pl.camTargetY=ty;
    }
  } else {
    for(var j=0;j<players.length;j++){
      players[j].camTargetX=players[j].px;
      players[j].camTargetY=players[j].py;
    }
  }
  for(var kk=0;kk<players.length;kk++){
    var pl2=players[kk];
    pl2.camX+=(pl2.camTargetX-pl2.camX)*f;
    pl2.camY+=(pl2.camTargetY-pl2.camY)*f;
  }
}

/* ============== ARROWS ============== */
var arrowsEl=document.getElementById('arrows');
var arrowCanvases=[];
var arrowAccum=0;
function updateArrows(dt){
  arrowAccum+=dt;
  if(arrowAccum<0.1) return;
  arrowAccum=0;
  while(arrowsEl.firstChild)arrowsEl.removeChild(arrowsEl.firstChild);
  if(state!=='playing'&&state!=='paused') return;
  var human=null,cpus=[];
  for(var i=0;i<players.length;i++){
    if(!players[i].alive) continue;
    if(players[i].cpu) cpus.push(players[i]); else if(!human) human=players[i];
  }
  if(!human || cpus.length===0) return;
  var W=canvas.width,H=canvas.height;
  var cssW=canvas.clientWidth, cssH=canvas.clientHeight;
  var scaleX=cssW/W, scaleY=cssH/H;
  var worldW=GW*ts, worldH=GH*ts;
  var camX,camY;
  if(worldW>W)camX=clamp(singleCamX*ts-W/2,0,worldW-W);
  else camX=(worldW-W)/2;
  if(worldH>H)camY=clamp(singleCamY*ts-H/2,0,worldH-H);
  else camY=(worldH-H)/2;
  var hx=human.px*ts - camX;
  var hy=human.py*ts - camY;
  var margin=48;
  var colors=['#ffb24d','#6fff4d','#ff6bff'];
  for(var ci=0;ci<cpus.length;ci++){
    var cpu=cpus[ci];
    var cx=cpu.px*ts - camX;
    var cy=cpu.py*ts - camY;
    if(cx>20 && cx<W-20 && cy>20 && cy<H-20) continue;
    var dx=cx-hx, dy=cy-hy;
    if(Math.abs(dx)<0.5 && Math.abs(dy)<0.5) continue;
    var t=1e9;
    if(dx>0) t=Math.min(t,(W-margin-hx)/dx);
    if(dx<0) t=Math.min(t,(margin-hx)/dx);
    if(dy>0) t=Math.min(t,(H-margin-hy)/dy);
    if(dy<0) t=Math.min(t,(margin-hy)/dy);
    if(t<=0 || t===1e9) continue;
    var ax=hx+t*dx, ay=hy+t*dy;
    ax=clamp(ax,margin,W-margin);
    ay=clamp(ay,margin,H-margin);
    var cssX=ax*scaleX, cssY=ay*scaleY;
    var angle=Math.atan2(dy,dx);
    var col=colors[ci%3];
    var c=arrowCanvases[ci];
    if(!c){
      c=document.createElement('canvas');
      c.width=48;c.height=48;
      c.style.position='absolute';
      c.style.pointerEvents='none';
      arrowCanvases[ci]=c;
    }
    var ctx=c.getContext('2d');
    ctx.clearRect(0,0,48,48);
    ctx.save();
    ctx.translate(24,24);
    ctx.rotate(angle);
    ctx.strokeStyle=col;ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(18,0);ctx.stroke();
    ctx.fillStyle=col;
    ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(16,-5);ctx.lineTo(16,5);
    ctx.closePath();ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(24,24);
    ctx.fillStyle='rgba(0,0,0,0.82)';
    ctx.beginPath();ctx.arc(0,0,10,0,6.2832);ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,10,0,6.2832);ctx.stroke();
    ctx.fillStyle=col;
    ctx.font='bold 11px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(''+(cpu.id),0,1);
    ctx.restore();
    c.style.left=(cssX-24)+'px';
    c.style.top=(cssY-24)+'px';
    arrowsEl.appendChild(c);
  }
}

/* ============== PASSCODE ============== */
function encodePasscode(){
  var obj={
    v:1,
    s:seedStr,
    l:level,
    m:playerMode,
    h:cpuHostile?1:0,
    z:levelSize,
    p:players.map(function(p){
      return {c:p.cpu?1:0,lv:p.lives,s:p.score||0};
    })
  };
  return b64Encode(JSON.stringify(obj));
}
function decodePasscode(code){
  if(!code) return null;
  var json=b64Decode(code.trim());
  if(!json) return null;
  try{
    var obj=JSON.parse(json);
    if(!obj || obj.v!==1) return null;
    return obj;
  }catch(e){return null;}
}

/* ============== UPDATE ============== */
function update(dt){
  time+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*3.4);
  if(flash>0)flash=Math.max(0,flash-dt*2.6);
  if(hintT>0)hintT-=dt;
  if(frozenT>0)frozenT=Math.max(0,frozenT-dt);
  if(exitPos.hitCooldown>0)exitPos.hitCooldown=Math.max(0,exitPos.hitCooldown-dt);
  for(var gp=0;gp<powerups.length;gp++){
    if(powerups[gp].spawnGrace>0) powerups[gp].spawnGrace-=dt;
  }
  for(var pp=0;pp<PART_MAX;pp++){
    var pa=particlePool[pp];
    if(pa.life<=0)continue;
    pa.life-=dt;
    pa.x+=pa.vx*dt;pa.y+=pa.vy*dt;
    pa.vx*=0.93;pa.vy*=0.93;pa.vy+=dt*1.4;
  }
  if(state!=='playing'){Audio_.updateMusic();updatePauseBtn();return;}
  for(var pi=0;pi<players.length;pi++){
    var pl=players[pi];
    if(pl.alive){
      if(pl.cpu)updateCPU(pl,dt);
      updatePlayer(pl,dt);
      if(pl.input.bomb){
        pl.input.bomb=false;
        if(pl.lineBomb)lineDrop(pl);
        else placeBomb(pl);
      }
      if(pl.input.detonate){
        pl.input.detonate=false;
        detonateRemote(pl);
      }
    } else if(pl.respawnT>0){
      pl.respawnT-=dt;
      if(pl.respawnT<=0&&pl.lives>0)respawnPlayer(pl);
    }
  }
  for(var b=bombs.length-1;b>=0;b--)updateBomb(bombs[b],dt);
  for(var b2=bombs.length-1;b2>=0;b2--)if(bombs[b2].dead)bombs.splice(b2,1);
  for(var bl=blasts.length-1;bl>=0;bl--){
    var blast=blasts[bl];
    blast.t-=dt;
    for(var ti=0;ti<blast.tiles.length;ti++){
      var tile=blast.tiles[ti];
      var cx=tile.i+0.5,cy=tile.j+0.5;
      for(var pi2=0;pi2<players.length;pi2++){
        var pl2=players[pi2];
        if(!pl2.alive||pl2.invuln>0||pl2.vestT>0||pl2.firePass)continue;
        if(Math.abs(pl2.px-cx)<0.5&&Math.abs(pl2.py-cy)<0.5)killPlayer(pl2);
      }
      for(var ei=0;ei<enemies.length;ei++){
        var en=enemies[ei];
        if(!en.alive)continue;
        if(Math.abs(en.px-cx)<0.52&&Math.abs(en.py-cy)<0.52){
          en.hp--;
          if(en.hp<=0){
            en.alive=false;
            addScore(blast.owner,150+en.typeIdx*40);
            spawnParticles(tile.i,tile.j,8,1.0,0.5,0.9);
            Audio_.hurt();
          }
        }
      }
    }
    if(blast.t<=0)blasts.splice(bl,1);
  }
  var aliveEnemies=0;
  for(var e=0;e<enemies.length;e++){
    var en2=enemies[e];
    if(!en2.alive)continue;
    aliveEnemies++;
    if(frozenT>0)continue;
    updateEnemy(en2,dt);
    for(var pj=0;pj<players.length;pj++){
      var pl3=players[pj];
      if(!pl3.alive||pl3.invuln>0||pl3.vestT>0)continue;
      var ddx=en2.px-pl3.px,ddy=en2.py-pl3.py;
      if(ddx*ddx+ddy*ddy<0.30)killPlayer(pl3);
    }
  }
  if(!exitPos.active&&aliveEnemies===0){
    exitPos.active=true;hintT=3.0;
    spawnParticles(exitPos.i,exitPos.j,14,0.5,1.0,1.0);
    Audio_.win();
    tickerPush(null,'<b>Portal Active!</b> Reach the exit!');
  }
  if(exitPos.active){
    for(var pk=0;pk<players.length;pk++){
      var pl4=players[pk];
      if(!pl4.alive)continue;
      var edx=pl4.px-(exitPos.i+0.5),edy=pl4.py-(exitPos.j+0.5);
      if(Math.abs(edx)<0.55&&Math.abs(edy)<0.55){
        state='levelclear';
        addScore(pl4,500+level*120);
        updateHud();
        Audio_.win();
        var cap=level;
        setTimeout(function(){
          if(state!=='levelclear')return;
          showPanel('<h1>LEVEL<span> CLEAR</span></h1>'+
            '<div class="sub">COURSE '+cap+' COMPLETE</div>'+
            '<div class="big">TOTAL '+totalScore()+'</div>'+
            '<button data-act="next">NEXT COURSE</button>'+
            '<button class="home" data-act="home" style="margin-top:5px">HOME</button>');
        },550);
        break;
      }
    }
  }
  splitScreenOn=shouldSplitScreen();
  updateCameras(dt);
  updateHud();
  Audio_.updateMusic();
  updatePauseBtn();
}
function shouldSplitScreen(){
  if(playerMode!=='2p') return false;
  if(players.length!==2) return false;
  if(players[0].cpu || players[1].cpu) return false;
  if(state!=='playing') return false;
  var p1=players[0],p2=players[1];
  if(!p1.alive||!p2.alive) return false;
  var playH=canvas.height;
  var dxPx=Math.abs(p1.px-p2.px)*ts;
  var dyPx=Math.abs(p1.py-p2.py)*ts;
  var margin=1.5*ts;
  return (dxPx+margin*2>canvas.width)||(dyPx+margin*2>playH);
}

/* ============== RENDER ============== */
function drawWorldScene(offsetX,offsetY,vw,vh){
  var S=ts,OX=offsetX,OY=offsetY;
  tileQuad(T.WHITE,0,0,vw,vh,0.024,0.032,0.058,1);
  var minI=Math.max(0,Math.floor(-OX/S)-1);
  var maxI=Math.min(GW,Math.ceil((-OX+vw)/S)+1);
  var minJ=Math.max(0,Math.floor(-OY/S)-1);
  var maxJ=Math.min(GH,Math.ceil((-OY+vh)/S)+1);
  for(var j=minJ;j<maxJ;j++){
    var rowOffset=j*GW;
    for(var i=minI;i<maxI;i++){
      var v=grid[rowOffset+i];
      var dx=OX+i*S,dy=OY+j*S;
      if(v===1)tileQuad(T.WALL,dx,dy,S,S,1,1,1,1);
      else if(v===2)tileQuad(T.BRICK,dx,dy,S,S,1,1,1,1);
      else tileQuad(((i+j)&1)?T.FLOOR_A:T.FLOOR_B,dx,dy,S,S,1,1,1,1);
    }
  }
  if(exitPos.i>=minI-1 && exitPos.i<maxI+1 && exitPos.j>=minJ-1 && exitPos.j<maxJ+1){
    var pulse=exitPos.active?0.80+0.20*Math.sin(time*7):0.38+0.06*Math.sin(time*2);
    tileQuad(exitPos.active?T.PORTAL_ON:T.PORTAL_OFF,
      OX+exitPos.i*S, OY+exitPos.j*S, S, S, 1,1,1,pulse);
  }
  for(var pu=0;pu<powerups.length;pu++){
    var pw=powerups[pu];
    if(pw.i<minI-1||pw.i>maxI||pw.j<minJ-1||pw.j>maxJ)continue;
    var bob=Math.sin(time*4.2+pw.i*0.9)*0.07;
    var psz=S*0.88;
    tileQuad(pw.def.tile, OX+pw.i*S+(S-psz)/2, OY+pw.j*S+(S-psz)/2+bob*S, psz, psz, 1,1,1,1);
  }
  for(var bb=0;bb<bombs.length;bb++){
    var bmb=bombs[bb];
    if(bmb.i<minI-1||bmb.i>maxI||bmb.j<minJ-1||bmb.j>maxJ)continue;
    var age=BOMB_FUSE-bmb.t;
    var fr=Math.floor(Math.abs(age)*8)%3;
    var sc=1+0.07*Math.sin(age*17);
    var bsz=S*0.88*sc;
    var alpha=1;
    if(bmb.isLandMine) alpha=0.25+0.15*Math.sin(time*3);
    var bpx=bmb.px||(bmb.i+0.5), bpy=bmb.py||(bmb.j+0.5);
    tileQuad(T.BOMB0+fr, OX+bpx*S-bsz/2, OY+bpy*S-bsz/2, bsz, bsz, 1,1,1,alpha);
  }
  for(var pi=0;pi<players.length;pi++){
    var pl=players[pi];
    if(!pl.alive)continue;
    if(pl.px<minI-1||pl.px>maxI||pl.py<minJ-1||pl.py>maxJ)continue;
    var psz2=S*0.92;
    var ppx=OX+pl.px*S, ppy=OY+pl.py*S;
    tileQuad(T.SHADOW, ppx-psz2*0.5, ppy-psz2*0.5, psz2, psz2, 1,1,1,0.7);
    var blink=(pl.invuln>0)&&(Math.floor(time*16)%2===0);
    if(!blink){
      var sprSet;
      if(pl.id===2 || pl.id===4){
        sprSet=[T.P2_U,T.P2_R,T.P2_D,T.P2_L];
      } else {
        sprSet=[T.P1_U,T.P1_R,T.P1_D,T.P1_L];
      }
      var spr=sprSet[pl.dir];
      var tr=1,tg=1,tb=1;
      if(pl.id===3){tr=0.55;tg=1.35;tb=0.55;}
      else if(pl.id===4){tr=1.35;tg=0.55;tb=1.35;}
      if(pl.vestT>0){tb=0.5+0.3*Math.sin(time*12);}
      tileQuad(spr, ppx-psz2/2, ppy-psz2/2, psz2, psz2, tr,tg,tb,1);
    }
  }
  for(var eni=0;eni<enemies.length;eni++){
    var e=enemies[eni];
    if(!e.alive)continue;
    if(e.px<minI-1||e.px>maxI||e.py<minJ-1||e.py>maxJ)continue;
    var esz=S*0.92;
    var ex=OX+e.px*S, ey=OY+e.py*S;
    tileQuad(T.SHADOW, ex-esz/2, ey-esz/2, esz, esz, 1,1,1,0.7);
    var frame=Math.floor(time*6+eni)&1;
    var baseSPR=[T.E0A,T.E1A,T.E2A,T.E3A,T.E4A,T.E5A][e.typeIdx];
    var altSPR=[T.E0B,T.E1B,T.E2B,T.E3B,T.E4B,T.E5B][e.typeIdx];
    tileQuad(frame?altSPR:baseSPR, ex-esz/2, ey-esz/2, esz, esz, 1,1,1,1);
  }
  for(var bli=0;bli<blasts.length;bli++){
    var bl2=blasts[bli];
    var k=bl2.t/bl2.max;
    var grow=1-k;
    var sc2=0.5+0.62*Math.min(1,grow*3.6);
    var al=Math.min(1,k*2.6);
    for(var ti2=0;ti2<bl2.tiles.length;ti2++){
      var tt=bl2.tiles[ti2];
      if(tt.i<minI-1||tt.i>maxI||tt.j<minJ-1||tt.j>maxJ)continue;
      var idx;
      if(tt.d===-1)idx=T.EXP_C;
      else if(tt.d===1||tt.d===3)idx=T.EXP_H;
      else idx=T.EXP_V;
      var zs=S*sc2;
      tileQuad(idx, OX+tt.i*S+(S-zs)/2, OY+tt.j*S+(S-zs)/2, zs, zs, 1,1,1,al);
    }
  }
  for(var pai=0;pai<PART_MAX;pai++){
    var pa=particlePool[pai];
    if(pa.life<=0)continue;
    var la=clamp(pa.life/pa.max,0,1);
    var zs2=S*pa.sz*la;
    tileQuad(T.WHITE, OX+pa.x*S-zs2/2, OY+pa.y*S-zs2/2, zs2, zs2, pa.r,pa.g,pa.b,la);
  }
  if(flash>0) tileQuad(T.WHITE, 0, 0, vw, vh, 1, 0.85, 0.85, flash*0.35);
  if(frozenT>0) tileQuad(T.WHITE, 0, 0, vw, vh, 0.6, 0.8, 1, 0.06);
}
function computeSingleCamera(vw,vh){
  var worldW=GW*ts, worldH=GH*ts;
  var camX,camY;
  if(worldW>vw)camX=clamp(singleCamX*ts-vw/2,0,worldW-vw);
  else camX=(worldW-vw)/2;
  if(worldH>vh)camY=clamp(singleCamY*ts-vh/2,0,worldH-vh);
  else camY=(worldH-vh)/2;
  return {x:camX,y:camY};
}
function computeSplitCamera(pl,W,H){
  var landscape=W>=H;
  var camX,camY;
  if(landscape){
    var scx=(pl.splitSide===0)?(W/4):(3*W/4);
    camX=pl.camX*ts-scx;camY=pl.camY*ts-H/2;
  } else {
    camX=pl.camX*ts-W/2;
    var scy=(pl.splitSide===0)?(H/4):(3*H/4);
    camY=pl.camY*ts-scy;
  }
  return {x:camX,y:camY};
}
function renderSplitScreen(W,H,sx,sy){
  if(players.length!==2) return false;
  var landscape=W>=H;
  var p1=players[0],p2=players[1];
  var pL=(p1.splitSide===0)?p1:p2;
  var pR=(p1.splitSide===1)?p1:p2;
  gl.viewport(0,0,W,H);
  gl.uniform2f(U_RES,W,H);
  gl.uniform1i(U_CLIP_MODE,1);
  if(landscape){
    gl.uniform4f(U_CLIP_RECT,0,0,W/2,H);
    vcount=0;
    var cL=computeSplitCamera(pL,W,H);
    drawWorldScene(-cL.x+sx,-cL.y+sy,W,H);flush();
    gl.uniform4f(U_CLIP_RECT,W/2,0,W-W/2,H);
    vcount=0;
    var cR=computeSplitCamera(pR,W,H);
    drawWorldScene(-cR.x+sx,-cR.y+sy,W,H);flush();
  } else {
    gl.uniform4f(U_CLIP_RECT,0,H/2,W,H-H/2);
    vcount=0;
    var cT=computeSplitCamera(pL,W,H);
    drawWorldScene(-cT.x+sx,-cT.y+sy,W,H);flush();
    gl.uniform4f(U_CLIP_RECT,0,0,W,H/2);
    vcount=0;
    var cB=computeSplitCamera(pR,W,H);
    drawWorldScene(-cB.x+sx,-cB.y+sy,W,H);flush();
  }
  gl.uniform1i(U_CLIP_MODE,0);
  return true;
}
function render(){
  gl.clearColor(0.024,0.032,0.058,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  vcount=0;
  if(state==='menu'){
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.uniform2f(U_RES,canvas.width,canvas.height);
    gl.uniform1i(U_CLIP_MODE,0);
    flush();return;
  }
  var sx=shake>0?(Math.random()-0.5)*shake*8:0;
  var sy=shake>0?(Math.random()-0.5)*shake*8:0;
  var doSplit=splitScreenOn && players.length===2 && !players[0].cpu && !players[1].cpu &&
              players[0].alive && players[1].alive;
  if(doSplit && renderSplitScreen(canvas.width,canvas.height,sx,sy)){
    /* handled */
  } else {
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.uniform2f(U_RES,canvas.width,canvas.height);
    gl.uniform1i(U_CLIP_MODE,0);
    vcount=0;
    var cam=computeSingleCamera(canvas.width,canvas.height);
    drawWorldScene(-cam.x+sx,-cam.y+sy,canvas.width,canvas.height);
    flush();
  }
}
