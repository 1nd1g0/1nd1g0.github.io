<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070911">
<title>BOMB BLASTER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#070911;color:#dfe8ff;
 font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:1;image-rendering:pixelated;background:#060911}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:2px;padding:2px;z-index:5;
 background:rgba(4,7,14,.94);border-bottom:1px solid rgba(120,180,255,.35);
 max-height:22vh;overflow:hidden;align-items:stretch;pointer-events:none}
.card{flex:1 1 0;min-width:0;padding:2px 4px;border:1px solid rgba(120,180,255,.32);border-radius:4px;
 background:rgba(0,0,0,.4);overflow:hidden;font-size:9px;line-height:1.1;text-shadow:0 1px 2px #000}
.card.cpu{border-color:rgba(255,180,120,.42)}
.card.human{border-color:rgba(120,200,255,.55)}
.head{display:flex;flex-wrap:wrap;gap:3px;justify-content:space-between;align-items:baseline;color:#cfe2ff}
.name{font-weight:700;color:#7ff0ff}
.cpu .name{color:#ffb24d}
.hp{color:#ff8899}
.score{color:#ffd479;font-weight:700;margin-left:auto}
.icons{display:flex;flex-wrap:wrap;gap:1px;margin-top:1px;max-height:28px;overflow:hidden}
.bi{position:relative;width:13px;height:13px;display:flex;align-items:center;justify-content:center;
 border:1px solid rgba(120,180,255,.4);border-radius:2px;background:rgba(0,0,0,.55);flex-shrink:0}
.bi canvas{width:11px;height:11px;image-rendering:pixelated;display:block}
.lv{position:absolute;right:-2px;bottom:-2px;font-size:7px;background:rgba(0,0,0,.92);color:#ffd479;
 padding:0 1px;border-radius:1px;line-height:8px;min-width:8px;text-align:center}
#total{flex:0 0 auto;padding:3px 6px;border:1px solid rgba(120,180,255,.42);border-radius:4px;
 background:rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:center;align-items:center;
 font-size:8px;letter-spacing:1px;min-width:46px}
#total b{color:#ffd479;font-size:13px;line-height:1.1}
#pauseBtn{flex:0 0 38px;min-height:38px;border-radius:6px;border:1px solid rgba(120,180,255,.5);
 background:rgba(20,30,60,.88);color:#dfe8ff;font-size:16px;cursor:pointer;pointer-events:auto;
 display:flex;align-items:center;justify-content:center;padding:0;margin:0;line-height:1}
#pauseBtn:active{background:rgba(40,60,120,.95)}
#touch{position:fixed;inset:0;z-index:7;pointer-events:none;display:none}
#touch.on{display:block}
.dpad{position:absolute;display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px 44px;
 gap:2px;pointer-events:auto}
#dpad1{left:8px;bottom:10px}
#dpad2{right:8px;bottom:74px;display:none;grid-template-columns:38px 38px 38px;grid-template-rows:38px 38px 38px}
#dpad2.on{display:grid}
.dpad button{width:100%;height:100%;border-radius:9px;border:1px solid rgba(140,200,255,.35);
 background:rgba(70,120,200,.3);color:#e8f2ff;font-size:16px;pointer-events:auto;padding:0;margin:0}
.dpad button.act{background:rgba(120,190,255,.65)}
.dpad [data-d="0"]{grid-column:2;grid-row:1}
.dpad [data-d="3"]{grid-column:1;grid-row:2}

 background:rgba(255,120,60,.28);color:#fff;font-size:22px;pointer-events:auto;padding:0;margin:0}

.panel{text-align:center;padding:14px 12px;border:1px solid rgba(120,180,255,.22);border-radius:12px;

 max-width:min(92vw,460px);width:100%;margin:0 auto}
h1{font-size:clamp(18px,6vw,28px);letter-spacing:3px;line-height:1.05;margin-bottom:4px;color:#fff;

.sub{font-size:9px;opacity:.6;margin-bottom:10px;letter-spacing:1.5px;line-height:1.6}
.big{font-size:18px;color:#ffd479;letter-spacing:2px;margin:5px 0 7px}
.lbl{font-size:9.5px;opacity:.65;letter-spacing:1.4px;margin:8px 0 4px;text-align:left}
input{width:100%;padding:8px 10px;margin-bottom:6px;border-radius:8px;border:1px solid rgba(120,180,255,.28);
 background:rgba(0,0,0,.45);color:#dfe8ff;font-family:inherit;font-size:12px;text-align:center;outline:none}
input.code{font-size:9.5px;letter-spacing:.5px;padding:6px 8px}
button{width:100%;padding:9px;margin-top:4px;border-radius:9px;border:none;cursor:pointer;font-family:inherit;
 font-size:12px;font-weight:700;letter-spacing:1px;background:linear-gradient(180deg,#38b6ff,#1565c0);color:#fff;
 box-shadow:0 3px 0 #0b3f7a}

button.alt{background:linear-gradient(180deg,#6b7a94,#39445c);box-shadow:0 3px 0 #222a3c}

button.home:active{box-shadow:0 1px 0 #804000}
.row2{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}

.row5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.row2 button,.row3 button,.row5 button{padding:6px 2px;font-size:10px;letter-spacing:.5px;margin-top:0}
.row2 button.on,.row3 button.on,.row5 button.on{background:linear-gradient(180deg,#ffb24d,#cc6a00);
 box-shadow:0 3px 0 #804000}
.hint{margin-top:8px;font-size:9px;opacity:.55;letter-spacing:1px;line-height:1.6}
.err{padding:18px;font-size:12px;line-height:1.7;color:#ff9aa9}
.helpRow{display:flex;gap:8px;align-items:center;margin:4px 0;text-align:left;font-size:10px;line-height:1.35}
.helpRow canvas{width:30px;height:30px;image-rendering:pixelated;flex:0 0 30px;border:1px solid rgba(120,180,255,.25);
 border-radius:4px;background:#000}
.helpRow b{color:#ffd479}
</style>

    <button class="small" id="b2remote" type="button">⇩</button>

<div id="overlay"><div class="panel" id="panel"></div></div>

<script>
(function(){
"use strict";

/* helpers */
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rndSeed(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function b64e(s){try{return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}catch(e){return '';}}
function b64d(s){try{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}catch(e){return null;}}

/* constants */
var IS_MOBILE=('ontouchstart' in window)||navigator.maxTouchPoints>0;
var DPR_CAP=IS_MOBILE?1.5:2;
var TS=32,ATLAS=512,COLS=16;
var DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
var BOMB_FUSE=2.2,BLAST_TIME=.45;
var PASS_KEY='bombblaster_v9';

var T={
 FLOOR_A:0,FLOOR_B:1,WALL:2,BRICK:3,BOMB0:4,BOMB1:5,BOMB2:6,
 EXP_C:7,EXP_H:8,EXP_V:9,
 P1_D:10,P1_U:11,P1_L:12,P1_R:13,P2_D:14,P2_U:15,P2_L:16,P2_R:17,
 E0:18,PORTAL_ON:42,PORTAL_OFF:43,WHITE:44,
 P3_D:46,P3_U:47,P3_L:48,P3_R:49,P4_D:50,P4_U:51,P4_L:52,P4_R:53,
 PU:64
};

var PU=[
 {id:'bomb',w:10,c1:'#5ad2ff',c2:'#0d4d9e',name:'Bomb Up',text:'Carry one extra bomb at the same time.'},
 {id:'fire',w:10,c1:'#ffb14d',c2:'#a83a10',name:'Fire Up',text:'Increases blast radius by one tile.'},
 {id:'speed',w:8,c1:'#9dff6b',c2:'#1b7a26',name:'Speed Up',text:'Move faster.'},
 {id:'fullfire',w:3,c1:'#ffdd00',c2:'#c04a00',name:'Full Fire',text:'Blast radius becomes maximum.'},
 {id:'heart',w:6,c1:'#ff5577',c2:'#99001e',name:'Heart',text:'Absorbs one fatal hit.'},
 {id:'oneup',w:4,c1:'#88ff88',c2:'#008040',name:'1-Up',text:'Grants one extra life.'},
 {id:'shield',w:4,c1:'#aaffee',c2:'#1e7a9c',name:'Shield',text:'Temporary invincibility.'},
 {id:'remote',w:6,c1:'#ff88ff',c2:'#7d007d',name:'Remote',text:'Bombs must be detonated manually with the remote button.'},
 {id:'power',w:5,c1:'#ff5522',c2:'#5c0000',name:'Power Bomb',text:'Your next bomb has maximum blast radius.'},
 {id:'spike',w:5,c1:'#dcdcdc',c2:'#2e2e2e',name:'Spike Bomb',text:'Blasts continue through destroyed bricks.'},
 {id:'mine',w:4,c1:'#996644',c2:'#2b0e00',name:'Land Mine',text:'Explodes when an enemy touches it. Without remote it also explodes on a normal fuse.'},
 {id:'danger',w:4,c1:'#ff0033',c2:'#2b0000',name:'Danger Bomb',text:'Explodes in a 3x3 area.'},
 {id:'key',w:1,c1:'#ffd700',c2:'#7a4a00',name:'Key',text:'Immediately reveals and opens the exit portal.'},
 {id:'gem',w:8,c1:'#44ddff',c2:'#004a77',name:'Gem',text:'Bonus score.'},
 {id:'clock',w:3,c1:'#ffffff',c2:'#556688',name:'Clock',text:'Freezes all enemies for a short time.'}
];
var PU_BY_ID={},PU_TOTAL_W=0;
for(var puIndex=0;puIndex<PU.length;puIndex++){
 PU[puIndex].tile=T.PU+puIndex;
 PU_BY_ID[PU[puIndex].id]=PU[puIndex];
 PU_TOTAL_W+=PU[puIndex].w;
}
function pickPrize(){
 var r=Math.random()*PU_TOTAL_W;
 for(var i=0;i<PU.length;i++){
  r-=PU[i].w;
  if(r<=0)return PU[i];
 }
 return PU[0];
}

var ETYPES=[
 {name:'Blob',desc:'Slow and weak. Wanders around.',speed:1.6,hp:1,wall:0,bomb:0,smart:0,err:0},
 {name:'Sprinter',desc:'Very fast but fragile.',speed:3.0,hp:1,wall:0,bomb:0,smart:0,err:0},
 {name:'Hunter',desc:'Actively hunts players.',speed:2.1,hp:1,wall:0,bomb:0,smart:1,err:0},
 {name:'Bomber',desc:'Can pass through bombs.',speed:2.0,hp:1,wall:0,bomb:1,smart:0,err:0},
 {name:'Ghost',desc:'Passes through walls and bombs.',speed:1.5,hp:1,wall:1,bomb:1,smart:0,err:0},
 {name:'Tank',desc:'Slow, but takes several hits.',speed:1.0,hp:3,wall:0,bomb:0,smart:0,err:0},
 {name:'Balloon',desc:'Floats through obstacles, erratic.',speed:1.3,hp:1,wall:1,bomb:1,smart:0,err:1},
 {name:'Doll',desc:'Cautious. Tries to avoid blasts.',speed:1.9,hp:1,wall:0,bomb:0,smart:0,err:0},
 {name:'Bat',desc:'Fast and erratic. Passes bombs.',speed:2.8,hp:1,wall:0,bomb:1,smart:0,err:1},
 {name:'Skull',desc:'Smart and tougher. Avoids danger.',speed:2.0,hp:2,wall:0,bomb:0,smart:1,err:0},
 {name:'Knight',desc:'Very tough, slow.',speed:1.2,hp:4,wall:0,bomb:0,smart:0,err:0},
 {name:'Wizard',desc:'Smart. Phases through walls.',speed:1.8,hp:2,wall:1,bomb:0,smart:1,err:0}
];
var ECOLS=[
 {a:'#ff5f7a',b:'#a3102c',c:'#ffd0d8'},
 {a:'#ffdd44',b:'#aa7700',c:'#fff2b0'},
 {a:'#b06cff',b:'#5a1aa8',c:'#e6d0ff'},
 {a:'#44ffaa',b:'#008855',c:'#c8ffe6'},
 {a:'#88ccff',b:'#2255aa',c:'#d8ecff'},
 {a:'#ff8844',b:'#883300',c:'#ffd8b0'},
 {a:'#ff9ff3',b:'#8a1a7a',c:'#ffe6fb'},
 {a:'#54e0c7',b:'#0b6e60',c:'#d8fff7'},
 {a:'#7f8cff',b:'#202a88',c:'#dfe3ff'},
 {a:'#e8e8f0',b:'#555566',c:'#ffffff'},
 {a:'#d0a060',b:'#5c3d10',c:'#ffe0b0'},
 {a:'#ff55ff',b:'#6a006a',c:'#ffd6ff'}
];

/* dom/state */
var canvas=$('c'),ctx=canvas.getContext('2d');
var overlay=$('overlay'),panel=$('panel'),hud=$('hud');
if(!ctx){panel.innerHTML='<div class="err">Canvas 2D not available.</div>';return;}

var GW=15,GH=13,grid=null;
var players=[],enemies=[],bombs=[],blasts=[],powerups=[];
var exit={i:1,j:1,active:false};
var level=1,seedStr='',state='menu',time=0,last=performance.now();
var shake=0,flash=0,frozen=0;
var levelSize='fit',playerMode='1p',hostile=false;
var splitOn=false,wasSplit=false,camX=7.5,camY=6.5;
var DPR=1,ts=32;
var forceHud=true,lastHud=0,helpFrom='menu';
var bg=document.createElement('canvas'),bgx=bg.getContext('2d');
var atlas=null;
var hudCards=[],hudTotalEl=null;
var _vis=null,_q=null,_first=null,_sim=null,_time=null;

var PART=IS_MOBILE?60:90;
var particles=[],partFree=[];
for(var partIdx=0;partIdx<PART;partIdx++){
 particles.push({x:0,y:0,vx:0,vy:0,life:0,max:1,r:1,g:1,b:1,s:1});
 partFree.push(partIdx);
}

/* audio */
var Audio=(function(){
 var ac=null,master=null,noise=null;
 function init(){
  if(ac){resume();return;}
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  try{ac=new AC();}catch(e){return;}
  master=ac.createGain();master.gain.value=.35;master.connect(ac.destination);
  var len=Math.floor(ac.sampleRate*.5);
  noise=ac.createBuffer(1,len,ac.sampleRate);
  var d=noise.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
 }
 function resume(){if(ac&&ac.state==='suspended'){try{ac.resume();}catch(e){}}}
 function tone(f,dur,type,vol,slide){
  if(!ac)return;
  var t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||.15,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);
 }
 function boomNoise(dur,vol,f0,f1){
  if(!ac||!noise)return;
  var t=ac.currentTime,s=ac.createBufferSource();s.buffer=noise;
  var f=ac.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  var g=ac.createGain();g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.03);
 }
 return {
  init:init,resume:resume,
  place:function(){tone(240,.08,'square',.12,110);},
  boom:function(){boomNoise(.45,.35,1800,60);tone(80,.28,'sawtooth',.13,30);},
  pickup:function(){tone(680,.06,'square',.14,900);setTimeout(function(){tone(1020,.08,'square',.11,1300);},50);},
  die:function(){tone(420,.4,'sawtooth',.2,55);boomNoise(.3,.15,900,80);},
  win:function(){[523.25,659.25,783.99,1046.5].forEach(function(f,i){setTimeout(function(){tone(f,.15,'triangle',.16);},i*70);});},
  enemy:function(){tone(280,.12,'square',.1,140);}
 };
})();

/* atlas */
function tilePos(t){return {x:(t%COLS)*TS,y:Math.floor(t/COLS)*TS};}
function blit(g,t,x,y,w,h,a){
 var p=tilePos(t);
 if(a!==undefined)g.globalAlpha=a;
 g.drawImage(atlas,p.x,p.y,TS,TS,x,y,w,h);
 if(a!==undefined)g.globalAlpha=1;
}
function drawPowerIcon(g,id){
 var s,a;
 switch(id){
  case 'bomb':
   g.fillStyle='#111';g.beginPath();g.arc(0,2,6,0,6.283);g.fill();
   g.strokeStyle='#ffe6a0';g.lineWidth=1.6;g.lineCap='round';
   g.beginPath();g.moveTo(2,-3);g.quadraticCurveTo(6,-7,3,-10);g.stroke();
   g.fillStyle='#ffd257';g.beginPath();g.arc(3,-10,2,0,6.283);g.fill();
   break;
  case 'fire':
  case 'fullfire':
   var fg=g.createLinearGradient(0,-10,0,10);
   fg.addColorStop(0,'#fffbe0');fg.addColorStop(.45,'#ffcf4d');fg.addColorStop(1,'#ff4a10');
   g.fillStyle=fg;
   g.beginPath();g.moveTo(0,-10);
   g.quadraticCurveTo(7,-3,5,3);g.quadraticCurveTo(3,9,0,9);
   g.quadraticCurveTo(-3,9,-5,3);g.quadraticCurveTo(-7,-3,0,-10);g.fill();
   if(id==='fullfire'){
    g.fillStyle='rgba(255,255,255,.85)';
    g.beginPath();g.moveTo(0,-4);g.quadraticCurveTo(3,0,2,4);g.quadraticCurveTo(0,7,-2,4);g.quadraticCurveTo(-3,0,0,-4);g.fill();
   }
   break;
  case 'speed':
   g.fillStyle='#eaffe0';
   g.beginPath();g.moveTo(-4,-9);g.lineTo(2,-9);g.lineTo(0,-2);g.lineTo(5,-2);
   g.lineTo(-2,9);g.lineTo(0,1);g.lineTo(-5,1);g.closePath();g.fill();
   break;
  case 'heart':
   g.fillStyle='#fff';
   g.beginPath();g.moveTo(0,7);
   g.bezierCurveTo(-9,1,-9,-6,-4.5,-7);
   g.bezierCurveTo(-2,-7.5,0,-5.5,0,-3.5);
   g.bezierCurveTo(0,-5.5,2,-7.5,4.5,-7);
   g.bezierCurveTo(9,-6,9,1,0,7);g.fill();
   break;
  case 'oneup':
   g.fillStyle='#f2e2c8';g.fillRect(-3,0,6,8);
   g.fillStyle='#ff4455';
   g.beginPath();g.arc(0,0,8,Math.PI,0,true);g.closePath();g.fill();
   g.fillStyle='#fff';

/* layout */
function layout(){
 var h=hud.offsetHeight||40;
 if(h<20)h=40;
 canvas.style.top=h+'px';
 canvas.style.height='calc(100vh - '+h+'px)';
}
function sizeCanvas(){
 DPR=Math.min(window.devicePixelRatio||1,DPR_CAP);
 var r=canvas.getBoundingClientRect();
 var w=Math.max(320,Math.floor(r.width*DPR));
 var h=Math.max(200,Math.floor(r.height*DPR));
 if(canvas.width!==w||canvas.height!==h){
  canvas.width=w;canvas.height=h;
 }
 ctx.imageSmoothingEnabled=false;
}
function level_dims(){
 var w=canvas.width,h=canvas.height,aw=w-16*DPR,ah=h-16*DPR;
 if(levelSize==='fit'){
  var target=Math.max(14,Math.min(36,Math.floor(Math.sqrt(aw*ah/200))));
  GW=Math.max(13,Math.min(21,Math.floor(aw/target)));
  GH=Math.max(11,Math.min(17,Math.floor(ah/target)));
 }else{
  var p={wide:[31,15],tall:[15,23],large:[27,19],huge:[41,25]}[levelSize]||[15,13];
  GW=p[0];GH=p[1];
 }
}
function tile_size(){
 var w=canvas.width,h=canvas.height,aw=w-16*DPR,ah=h-16*DPR;
 if(levelSize==='fit')ts=Math.max(8,Math.floor(Math.min(aw/GW,ah/GH)));
 else ts=clamp(Math.floor(Math.min(w,h)/12),20,60);
}
function buildBackground(){
 if(!grid)return;
 bg.width=Math.max(1,GW*ts);bg.height=Math.max(1,GH*ts);
 bgx.imageSmoothingEnabled=false;
 bgx.clearRect(0,0,bg.width,bg.height);
 for(var j=0;j<GH;j++){
  for(var i=0;i<GW;i++){
   var v=grid[j*GW+i];
   blit(bgx,((i+j)&1)?T.FLOOR_A:T.FLOOR_B,i*ts,j*ts,ts,ts);
   if(v===1)blit(bgx,T.WALL,i*ts,j*ts,ts,ts);
   else if(v===2)blit(bgx,T.BRICK,i*ts,j*ts,ts,ts);
  }
 }
}
function resize(){
 layout();sizeCanvas();
 if(grid){tile_size();buildBackground();}
}

/* level */
function makePlayer(id,sx,sy,cpu){
 return {
  id:id,px:sx+.5,py:sy+.5,tx:sx+.5,ty:sy+.5,moving:false,dir:2,
  fromI:sx,fromJ:sy,
  speed:4.4,maxBombs:1,fire:2,alive:true,lives:3,hearts:0,invuln:0,vestT:0,
  remoteControl:false,spikeBomb:false,landMine:false,dangerBomb:false,powerReady:false,hasKey:false,
  score:0,cpu:cpu,activeBombs:0,aiT:0,aiLastDir:-1,aiRev:0,aiStuck:0,
  input:{dirs:[false,false,false,false],order:[],bomb:false,det:false},
  camX:sx+.5,camY:sy+.5,splitSide:0
 };
}
function pickEnemyType(lv,rng){
 var w=[10,Math.min(8,lv),Math.max(0,lv-2),Math.max(0,lv-3),Math.max(0,lv-4)*.8,
        Math.max(0,lv-5)*.7,Math.max(0,lv-2)*.8,Math.max(0,lv-3)*.7,
        Math.max(0,lv-4)*.6,Math.max(0,lv-5)*.6,Math.max(0,lv-6)*.5,Math.max(0,lv-7)*.4];
 var total=0;
 for(var i=0;i<w.length;i++)total+=w[i];
 if(total<=0)return 0;
 var r=rng()*total;
 for(i=0;i<w.length;i++){
  r-=w[i];
  if(r<=0)return i;
 }
 return 0;
}
function ensureEscape(si,sj){
 function clear(d){
  for(var r=1;r<=3;r++){
   var ni=si+DIRS[d][0]*r,nj=sj+DIRS[d][1]*r;
   if(!inB(ni,nj)||grid[nj*GW+ni]!==0)return false;
  }
  return true;
 }
 var open=0,d,r,ni,nj;
 for(d=0;d<4;d++)if(clear(d))open++;
 if(open>=2)return;
 for(d=0;d<4&&open<2;d++){
  var ok=true;
  for(r=1;r<=3;r++){
   ni=si+DIRS[d][0]*r;nj=sj+DIRS[d][1]*r;
   if(!inB(ni,nj)||grid[nj*GW+ni]===1){ok=false;break;}
  }
  if(!ok)continue;
  for(r=1;r<=3;r++){
   ni=si+DIRS[d][0]*r;nj=sj+DIRS[d][1]*r;
   if(grid[nj*GW+ni]===2)grid[nj*GW+ni]=0;
  }
  open++;
 }
}
function buildLevel(resume){
 layout();sizeCanvas();level_dims();
 var rng=rndSeed(hash(seedStr+'|'+level+'|'+GW+'x'+GH+'|'+playerMode+'|'+hostile));
 grid=new Uint8Array(GW*GH);
 var x,y,v,k;
 for(y=0;y<GH;y++){
  for(x=0;x<GW;x++){
   v=0;
   if(x===0||y===0||x===GW-1||y===GH-1)v=1;
   else if((x&1)===0&&(y&1)===0)v=1;
   grid[y*GW+x]=v;
  }
 }
 var safe={};
 function mark(cx,cy){
  for(var dy=-1;dy<=2;dy++)for(var dx=-1;dx<=2;dx++){
   var sx=cx+dx,sy=cy+dy;
   if(sx>0&&sy>0&&sx<GW-1&&sy<GH-1)safe[sy*GW+sx]=1;
  }
 }
 mark(0,0);mark(GW-1,0);mark(GW-1,GH-1);mark(0,GH-1);
 var dens=clamp(.40+(level-1)*.026,.40,.62);
 for(y=1;y<GH-1;y++){
  for(x=1;x<GW-1;x++){
   k=y*GW+x;
   if(grid[k]!==0||safe[k])continue;
   if(rng()<dens)grid[k]=2;
  }
 }
 ensureEscape(1,1);
 if(playerMode!=='1p')ensureEscape(GW-2,1);
 if(playerMode==='cpu2'||playerMode==='cpu3')ensureEscape(GW-2,GH-2);
 if(playerMode==='cpu3')ensureEscape(1,GH-2);

 var free=[];
 for(y=1;y<GH-1;y++){
  for(x=1;x<GW-1;x++){
   k=y*GW+x;
   if(grid[k]===0)free.push(k);
  }
 }
 for(var fi=free.length-1;fi>0;fi--){
  var fj=(rng()*(fi+1))|0;
  var tmp=free[fi];free[fi]=free[fj];free[fj]=tmp;
 }
 var ek=free.length?free.pop():((GH-2)*GW+(GW-2));
 exit.i=ek%GW;exit.j=(ek/GW)|0;exit.active=false;

 var corners=[{i:1,j:1},{i:GW-2,j:1},{i:GW-2,j:GH-2},{i:1,j:GH-2}];
 var old=players.slice();
 players=[];
 var humans=1,cpus=0;
 if(playerMode==='2p')humans=2;
 else if(playerMode==='cpu1')cpus=1;
 else if(playerMode==='cpu2')cpus=2;
 else if(playerMode==='cpu3')cpus=3;

 for(var pi=0;pi<humans+cpus;pi++){
  var cpu=pi>=humans;
  var pl=old[pi]||makePlayer(pi+1,corners[pi].i,corners[pi].j,cpu);
  pl.id=pi+1;pl.cpu=cpu;
  pl.px=pl.tx=corners[pi].i+.5;pl.py=pl.ty=corners[pi].j+.5;
  pl.fromI=corners[pi].i;pl.fromJ=corners[pi].j;
  pl.moving=false;pl.dir=2;pl.alive=true;pl.invuln=1.8;pl.vestT=0;pl.activeBombs=0;
  pl.input.dirs=[false,false,false,false];pl.input.order=[];pl.input.bomb=false;pl.input.det=false;
  pl.camX=pl.px;pl.camY=pl.py;pl.aiT=0;pl.aiLastDir=-1;pl.aiRev=0;pl.aiStuck=0;
  pl.hasKey=false;
  if(pl.lives<=0)pl.lives=3;
  if(typeof pl.score!=='number')pl.score=0;
  players.push(pl);
 }
 if(resume&&resume.p){
  for(var ri=0;ri<players.length&&ri<resume.p.length;ri++){
   if(typeof resume.p[ri].lv==='number')players[ri].lives=resume.p[ri].lv;
   if(typeof resume.p[ri].s==='number')players[ri].score=resume.p[ri].s;
  }
 }
 var ax=0,ay=0,hc=0;
 for(var ci=0;ci<players.length;ci++){
  if(!players[ci].cpu){ax+=players[ci].px;ay+=players[ci].py;hc++;}
 }
 if(hc){camX=ax/hc;camY=ay/hc;}else{camX=players[0].px;camY=players[0].py;}
 splitOn=wasSplit=false;

 enemies=[];
 var count=Math.min(IS_MOBILE?16:20,2+Math.floor(level*.7)+Math.floor(GW*GH/350));
 var spawnFree=free.slice();
 for(var enIdx=0;enIdx<count&&spawnFree.length>0;enIdx++){
  var idx=-1;
  for(var attempt=0;attempt<30;attempt++){
   var ri=(rng()*spawnFree.length)|0;
   var cand=spawnFree[ri];
   var ci2=cand%GW,cj2=(cand/GW)|0;
   var ok=true;
   for(var pq=0;pq<players.length;pq++){
    var pti=Math.round(players[pq].px-.5),ptj=Math.round(players[pq].py-.5);
    if(Math.abs(ci2-pti)+Math.abs(cj2-ptj)<6){ok=false;break;}
   }
   if(ok){idx=ri;break;}
  }
  if(idx<0)idx=(rng()*spawnFree.length)|0;
  var fk=spawnFree[idx];spawnFree.splice(idx,1);
  var ex=fk%GW,ey=(fk/GW)|0;
  var typeIdx=pickEnemyType(level,rng);
  enemies.push({
   px:ex+.5,py:ey+.5,tx:ex+.5,ty:ey+.5,moving:false,dir:2,
   speed:ETYPES[typeIdx].speed*(1+level*.02),hp:ETYPES[typeIdx].hp,
   type:ETYPES[typeIdx],typeIdx:typeIdx,alive:true,hitT:0,t:rng()*10
  });
 }

 bombs=[];blasts=[];powerups=[];
 for(var pc=0;pc<PART;pc++)particles[pc].life=0;
 partFree=[];
 for(var pf=0;pf<PART;pf++)partFree.push(pf);

 ensureBuffers();
 buildHud();
 tile_size();buildBackground();
 layout();sizeCanvas();tile_size();buildBackground();
}

/* game helpers */
function inB(i,j){return i>=0&&j>=0&&i<GW&&j<GH;}
function bombAt(i,j){
 for(var k=0;k<bombs.length;k++){
  var b=bombs[k];
  if(b.i===i&&b.j===j&&!b.dead)return b;
 }
 return null;
}
function addScore(p,n){if(p)p.score=(p.score||0)+n;}
function totalScore(){var s=0;for(var i=0;i<players.length;i++)s+=players[i].score||0;return s;}
function canWalkPlayer(i,j,pl){
 if(!inB(i,j))return false;
 var v=grid[j*GW+i];
 if(v===1||v===2)return false;
 var b=bombAt(i,j);
 if(b)return b.mine&&b.owner===pl;
 return true;
}
function canWalkEnemy(i,j,en){
 if(!inB(i,j))return false;
 var v=grid[j*GW+i];
 if(v===1)return false;
 if(v===2&&!en.type.wall)return false;
 var b=bombAt(i,j);
 if(b){
  if(b.mine)return true;
  if(!en.type.bomb)return false;
 }
 return true;
}
function spawnParts(ti,tj,n,r,g,b){
 var cx=ti+.5,cy=tj+.5;
 n=Math.min(n,partFree.length);
 for(var i=0;i<n;i++){
  var idx=partFree.pop(),p=particles[idx];
  var a=Math.random()*6.283,sp=1.2+Math.random()*3;
  p.x=cx;p.y=cy;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;
  p.life=.3+Math.random()*.4;p.max=.7;p.r=r;p.g=g;p.b=b;p.s=.1+Math.random()*.14;
 }
}
function destroyBrick(i,j,owner){
 grid[j*GW+i]=0;
 blit(bgx,((i+j)&1)?T.FLOOR_A:T.FLOOR_B,i*ts,j*ts,ts,ts);
 spawnParts(i,j,4,1,.62,.3);
 addScore(owner,10);
 if(Math.random()<.32)powerups.push({i:i,j:j,def:pickPrize(),grace:.4});
}
function destroyPowerups(tiles){
 for(var i=powerups.length-1;i>=0;i--){
  var p=powerups[i];
  if(p.grace>0)continue;
  for(var j=0;j<tiles.length;j++){
   if(tiles[j].i===p.i&&tiles[j].j===p.j){
    spawnParts(p.i,p.j,6,1,.7,.3);
    powerups.splice(i,1);
    break;
   }
  }
 }
}
function decBomb(p){if(p&&p.activeBombs>0)p.activeBombs--;}

/* powerups */
function useful(pl,def){
 var id=def.id;
 if(id==='bomb')return pl.maxBombs<8;
 if(id==='fire')return pl.fire<10;
 if(id==='speed')return pl.speed<8.5;
 if(id==='fullfire')return pl.fire<Math.max(GW,GH);
 if(id==='heart')return pl.hearts<3;
 if(id==='oneup')return pl.lives<9;
 if(id==='shield')return true;
 if(id==='remote')return !pl.remoteControl;
 if(id==='power')return !pl.powerReady;
 if(id==='spike')return !pl.spikeBomb;
 if(id==='mine')return !pl.landMine;
 if(id==='danger')return !pl.dangerBomb;
 if(id==='key')return !pl.hasKey;
 return true;
}
function applyPU(pl,p){
 var id=p.def.id;
 if(id==='bomb')pl.maxBombs=Math.min(8,pl.maxBombs+1);
 else if(id==='fire')pl.fire=Math.min(10,pl.fire+1);
 else if(id==='speed')pl.speed=Math.min(8.5,pl.speed+.55);
 else if(id==='fullfire')pl.fire=Math.max(GW,GH);
 else if(id==='heart')pl.hearts=Math.min(3,pl.hearts+1);
 else if(id==='oneup')pl.lives=Math.min(9,pl.lives+1);
 else if(id==='shield')pl.vestT=8;
 else if(id==='remote')pl.remoteControl=true;
 else if(id==='power')pl.powerReady=true;
 else if(id==='spike')pl.spikeBomb=true;
 else if(id==='mine')pl.landMine=true;
 else if(id==='danger')pl.dangerBomb=true;
 else if(id==='clock')frozen=Math.max(frozen,5);
 else if(id==='key'){
  pl.hasKey=true;
  exit.active=true;
  spawnParts(exit.i,exit.j,12,1,.9,.4);
 }
 else if(id==='gem')addScore(pl,500);
 addScore(pl,50);
 Audio.pickup();
 spawnParts(p.i,p.j,5,.5,1,.8);
 forceHud=true;
}
function checkPickups(){
 for(var pi=0;pi<players.length;pi++){
  var pl=players[pi];
  if(!pl.alive)continue;
  var ci=Math.round(pl.px-.5),cj=Math.round(pl.py-.5);
  for(var i=powerups.length-1;i>=0;i--){
   var p=powerups[i];
   if(p.grace>0)continue;
   if(p.i===ci&&p.j===cj&&useful(pl,p.def)){
    applyPU(pl,p);
    powerups.splice(i,1);
   }
  }
 }
}
function dropPrizes(pl){
 var items=[];
 var i;
 for(i=1;i<pl.maxBombs;i++)items.push('bomb');
 for(i=0;i<pl.fire-2;i++)items.push('fire');
 var sl=Math.round((pl.speed-4.4)/.55);
 for(i=0;i<sl;i++)items.push('speed');
 if(pl.remoteControl)items.push('remote');
 if(pl.spikeBomb)items.push('spike');
 if(pl.landMine)items.push('mine');
 if(pl.dangerBomb)items.push('danger');
 if(pl.powerReady)items.push('power');

 pl.maxBombs=1;pl.fire=2;pl.speed=4.4;
 pl.remoteControl=false;pl.spikeBomb=false;pl.landMine=false;pl.dangerBomb=false;pl.powerReady=false;
 if(!items.length)return;

 var di=Math.round(pl.px-.5),dj=Math.round(pl.py-.5),placed=0;
 for(var dist=1;dist<=Math.max(GW,GH)+2&&placed<items.length;dist++){
  for(var d=0;d<4&&placed<items.length;d++){
   var ni=di+DIRS[d][0]*dist,nj=dj+DIRS[d][1]*dist;
   if(!inB(ni,nj)||grid[nj*GW+ni]!==0||bombAt(ni,nj))continue;
   var exists=false;
   for(var q=0;q<powerups.length;q++){
    if(powerups[q].i===ni&&powerups[q].j===nj){exists=true;break;}
   }
   if(exists)continue;
   powerups.push({i:ni,j:nj,def:PU_BY_ID[items[placed]],grace:.5});
   placed++;
  }
 }
}

/* bombs/blasts */
function createBomb(pl,i,j){
 var fire=pl.fire;
 if(pl.powerReady&&pl.activeBombs===0){
  fire=Math.max(GW,GH);pl.powerReady=false;forceHud=true;
 }
 bombs.push({
  i:i,j:j,px:i+.5,py:j+.5,t:BOMB_FUSE,fire:fire,dead:false,owner:pl,
  remote:pl.remoteControl,spike:pl.spikeBomb,mine:pl.landMine,danger:pl.dangerBomb,age:0
 });
 pl.activeBombs++;
 Audio.place();
}
function placeBomb(pl){
 if(!pl.alive||state!=='playing')return;
 var t={i:Math.round(pl.px-.5),j:Math.round(pl.py-.5)};
 if(bombAt(t.i,t.j)||pl.activeBombs>=pl.maxBombs)return;
 createBomb(pl,t.i,t.j);
}
function detonateRemote(pl){
 if(!pl)return;
 var old=null,age=-1;
 for(var i=0;i<bombs.length;i++){
  var b=bombs[i];
  if(b.owner===pl&&!b.dead&&b.remote&&b.age>age){age=b.age;old=b;}
 }
 if(old){detonate(old);shake=Math.min(1,shake+.3);}
}
function detonateSingle(b,queue){
 var owner=b.owner,tiles=[{i:b.i,j:b.j,d:-1}],cx=b.i,cy=b.j;
 var dx,dy,ni,nj,gv,ob,d,ddx,ddy,r,nx,ny,gv2,ob2;
 if(b.danger){
  for(dx=-1;dx<=1;dx++){
   for(dy=-1;dy<=1;dy++){
    if(!dx&&!dy)continue;
    ni=cx+dx;nj=cy+dy;
    if(!inB(ni,nj))continue;
    gv=grid[nj*GW+ni];
    if(gv===1)continue;
    if(gv===2){destroyBrick(ni,nj,owner);tiles.push({i:ni,j:nj,d:-1});continue;}
    tiles.push({i:ni,j:nj,d:-1});
    ob=bombAt(ni,nj);
    if(ob&&!ob.dead&&ob!==b){ob.dead=true;decBomb(ob.owner);queue.push(ob);}
   }
  }
 }else{
  for(d=0;d<4;d++){
   ddx=DIRS[d][0];ddy=DIRS[d][1];
   for(r=1;r<=b.fire;r++){
    nx=cx+ddx*r;ny=cy+ddy*r;
    if(!inB(nx,ny))break;
    gv2=grid[ny*GW+nx];
    if(gv2===1)break;
    if(gv2===2){
     destroyBrick(nx,ny,owner);
     tiles.push({i:nx,j:ny,d:d});
     if(!b.spike)break;
     continue;
    }
    tiles.push({i:nx,j:ny,d:d});
    ob2=bombAt(nx,ny);
    if(ob2&&!ob2.dead&&ob2!==b){ob2.dead=true;decBomb(ob2.owner);queue.push(ob2);}
   }
  }
 }
 blasts.push({tiles:tiles,t:BLAST_TIME,max:BLAST_TIME,owner:owner});
 spawnParts(cx,cy,6,1,.8,.35);
 Audio.boom();
 shake=Math.min(1,shake+.5);
 destroyPowerups(tiles);
}
function detonate(b){
 if(b.dead)return;
 b.dead=true;decBomb(b.owner);
 var q=[b],guard=0;
 while(q.length&&guard++<128)detonateSingle(q.pop(),q);
}

/* simple danger for enemies */
function isDangerous(i,j){
 var k,m,b,d,st,blocked,d2,st2,blocked2,gg;
 for(k=0;k<blasts.length;k++){
  var tl=blasts[k].tiles;
  for(m=0;m<tl.length;m++)if(tl[m].i===i&&tl[m].j===j)return true;
 }
 for(k=0;k<bombs.length;k++){
  b=bombs[k];
  if(b.dead||b.remote||b.mine)continue;
  if(b.danger){
   if(Math.abs(b.i-i)<=1&&Math.abs(b.j-j)<=1)return true;
   continue;
  }
  if(b.i===i&&b.j===j)return true;
  if(b.i===i){
   d=b.j-j;
   if(Math.abs(d)<=b.fire){
    st=d>0?1:-1;blocked=false;
    for(m=1;m<Math.abs(d);m++){
     gg=grid[(b.j+st*m)*GW+b.i];
     if(gg!==0){
      if(!b.spike){blocked=true;break;}
     }
    }
    if(!blocked)return true;
   }
  }
  if(b.j===j){
   d2=b.i-i;
   if(Math.abs(d2)<=b.fire){
    st2=d2>0?1:-1;blocked2=false;
    for(m=1;m<Math.abs(d2);m++){
     gg=grid[b.j*GW+(b.i+st2*m)];
     if(gg!==0){
      if(!b.spike){blocked2=true;break;}
     }
    }
    if(!blocked2)return true;
   }
  }
 }
 return false;
}

/* ================================
   AI temporal danger model
   ================================ */
var AI_TICK=.05;
var AI_MARGIN=.18;

function threatNearTile(pl,i,j,r2){
 var cx=i+.5,cy=j+.5,e,p,dx,dy;
 for(e=0;e<enemies.length;e++){
  if(!enemies[e].alive)continue;
  dx=enemies[e].px-cx;dy=enemies[e].py-cy;
  if(dx*dx+dy*dy<r2)return true;
 }
 if(hostile){
  for(p=0;p<players.length;p++){
   var o=players[p];
   if(!o.alive||o===pl)continue;
   dx=o.px-cx;dy=o.py-cy;
   if(dx*dx+dy*dy<r2)return true;
  }
 }
 return false;
}
function nearestThreatD2(pl,i,j){
 var cx=i+.5,cy=j+.5,best=1e9,e,p,dx,dy,d2;
 for(e=0;e<enemies.length;e++){
  if(!enemies[e].alive)continue;
  dx=enemies[e].px-cx;dy=enemies[e].py-cy;d2=dx*dx+dy*dy;
  if(d2<best)best=d2;
 }
 if(hostile){
  for(p=0;p<players.length;p++){
   var o=players[p];
   if(!o.alive||o===pl)continue;
   dx=o.px-cx;dy=o.py-cy;d2=dx*dx+dy*dy;
   if(d2<best)best=d2;
  }
 }
 return best;
}
function fireRemAt(i,j){
 if(!inB(i,j))return 0;
 var rem=0,k,m,tl;
 for(k=0;k<blasts.length;k++){
  if(blasts[k].t<=0)continue;
  tl=blasts[k].tiles;
  for(m=0;m<tl.length;m++){
   if(tl[m].i===i&&tl[m].j===j){
    if(blasts[k].t>rem)rem=blasts[k].t;
    break;
   }
  }
 }
 return rem;
}
function bombCoversTile(b,i,j){
 if(b.dead)return false;
 if(b.danger)return Math.abs(b.i-i)<=1&&Math.abs(b.j-j)<=1;
 if(b.i===i){
  var d=Math.abs(b.j-j);
  if(d>b.fire)return false;
  var st=j>b.j?1:-1;
  for(var r=1;r<d;r++){
   var gg=grid[(b.j+st*r)*GW+b.i];
   if(gg===1)return false;
   if(gg===2&&!b.spike)return false;
  }
  return true;
 }
 if(b.j===j){
  var d2=Math.abs(b.i-i);
  if(d2>b.fire)return false;
  var st2=i>b.i?1:-1;
  for(var r2=1;r2<d2;r2++){
   var gg2=grid[b.j*GW+(b.i+st2*r2)];
   if(gg2===1)return false;
   if(gg2===2&&!b.spike)return false;
  }
  return true;
 }
 return false;
}
function schedStartAt(i,j,extraSim,extraStart){
 if(!inB(i,j))return Infinity;
 if(extraStart===undefined)extraStart=Infinity;
 var start=Infinity,k,b;
 for(k=0;k<bombs.length;k++){
  b=bombs[k];
  if(b.dead||b.remote||b.mine)continue;
  if(b.t<start&&bombCoversTile(b,i,j))start=b.t;
 }
 if(extraSim&&extraSim[j*GW+i]&&extraStart<start)start=extraStart;
 return start;
}
function enemyThreatAt(pl,i,j){
 return threatNearTile(pl,i,j,.36);
}
function aiWalkable(i,j){
 return inB(i,j)&&grid[j*GW+i]===0&&!bombAt(i,j);
}
function aiSafeNow(pl,i,j){
 return aiWalkable(i,j)&&fireRemAt(i,j)===0&&!enemyThreatAt(pl,i,j);
}
function aiSafeFuture(pl,i,j,extraSim,extraStart){
 return aiSafeNow(pl,i,j)&&schedStartAt(i,j,extraSim,extraStart)===Infinity;
}
function timedBFSDir(pl,si,sj,extraSim,extraStart,goalFuture,maxTime){
 ensureBuffers();
 var n=GW*GH;
 _vis.fill(0);
 var step=1/Math.max(1,pl.speed);
 if(maxTime<step)maxTime=step;
 var head=0,tail=0,start=sj*GW+si;
 _q[tail]=start;_first[tail]=-1;_time[start]=0;_vis[start]=1;tail++;

 while(head<tail){
  var id=_q[head],fd=_first[head],t=_time[id];head++;
  var i=id%GW,j=(id/GW)|0;

  if(fd!==-1){
   if(goalFuture){
    if(aiSafeNow(pl,i,j)&&schedStartAt(i,j,extraSim,extraStart)===Infinity)return fd;
   }else{
    if(aiSafeNow(pl,i,j))return fd;
   }
  }

  if(t+step>maxTime)continue;

  var hs=schedStartAt(i,j,extraSim,extraStart);
  if(hs!==Infinity&&t+step>hs-AI_MARGIN)continue;
  if(t>0&&fireRemAt(i,j)>0)continue;

  for(var d=0;d<4;d++){
   var nx=i+DIRS[d][0],ny=j+DIRS[d][1];
   if(!aiWalkable(nx,ny))continue;
   if(fireRemAt(nx,ny)>0)continue;
   if(enemyThreatAt(pl,nx,ny))continue;

   var arr=t+step;
   if(arr>maxTime)continue;

   var hsN=schedStartAt(nx,ny,extraSim,extraStart);
   if(hsN!==Infinity&&arr+step>hsN-AI_MARGIN)continue;

   var nid=ny*GW+nx;
   if(!_vis[nid]){
    _vis[nid]=1;
    _q[tail]=nid;
    _first[tail]=(fd===-1?d:fd);
    _time[nid]=arr;
    tail++;
   }
  }
 }
 return -1;
}
function findEscapeDirNoPanic(pl,ci,cj,extraSim,extraStart){
 var step=1/Math.max(1,pl.speed);
 var fireNow=fireRemAt(ci,cj)>0;
 var hs=schedStartAt(ci,cj,extraSim,extraStart);
 var maxT=fireNow?Math.max(step*2,.85):Math.max(step*4,2.0);
 if(hs!==Infinity)maxT=Math.min(maxT,hs-AI_MARGIN);
 if(maxT<step)return -1;
 if(maxT>step*14)maxT=step*14;

 var dir=timedBFSDir(pl,ci,cj,extraSim,extraStart,true,maxT);
 if(dir>=0)return dir;
 return timedBFSDir(pl,ci,cj,extraSim,extraStart,false,maxT);
}
function panicDir(pl,ci,cj,extraSim,extraStart){
 var best=-1,bestScore=1e9;
 for(var d=0;d<4;d++){
  var nx=ci+DIRS[d][0],ny=cj+DIRS[d][1];
  if(!aiWalkable(nx,ny))continue;
  if(fireRemAt(nx,ny)>0)continue;
  if(enemyThreatAt(pl,nx,ny))continue;

  var hs=schedStartAt(nx,ny,extraSim,extraStart);
  var hazardScore=(hs===Infinity)?0:Math.max(0,20-hs*4);
  var threat=nearestThreatD2(pl,nx,ny);
  var rev=(pl.aiLastDir>=0&&d===((pl.aiLastDir+2)&3))?18:0;
  var score=hazardScore-Math.min(threat,20)*.4+rev;
  if(score<bestScore){bestScore=score;best=d;}
 }
 return best;
}
function findEscapeDir(pl,ci,cj,extraSim,extraStart){
 var dir=findEscapeDirNoPanic(pl,ci,cj,extraSim,extraStart);
 if(dir>=0)return dir;
 return panicDir(pl,ci,cj,extraSim,extraStart);
}
function markSimBomb(pl,ci,cj){
 ensureBuffers();
 _sim.fill(0);
 var fire=pl.fire;
 if(pl.powerReady&&pl.activeBombs===0)fire=Math.max(GW,GH);
 _sim[cj*GW+ci]=1;
 var d,r,nx,ny,gv;
 if(pl.dangerBomb){
  for(var dx=-1;dx<=1;dx++){
   for(var dy=-1;dy<=1;dy++){
    nx=ci+dx;ny=cj+dy;
    if(inB(nx,ny)&&grid[ny*GW+nx]!==1)_sim[ny*GW+nx]=1;
   }
  }
 }else{
  for(d=0;d<4;d++){
   for(r=1;r<=fire;r++){
    nx=ci+DIRS[d][0]*r;ny=cj+DIRS[d][1]*r;
    if(!inB(nx,ny))break;
    gv=grid[ny*GW+nx];
    if(gv===1)break;
    _sim[ny*GW+nx]=1;
    if(gv===2&&!pl.spikeBomb)break;
   }
  }
 }
}
function simBombValue(pl,ci,cj){
 markSimBomb(pl,ci,cj);
 var val=0,i,idx;
 for(i=0;i<enemies.length;i++){
  if(!enemies[i].alive)continue;
  var ei=Math.round(enemies[i].px-.5),ej=Math.round(enemies[i].py-.5);
  if(inB(ei,ej)&&_sim[ej*GW+ei])val+=10;
 }
 if(hostile){
  for(i=0;i<players.length;i++){
   var o=players[i];
   if(!o.alive||o===pl)continue;
   var oi=Math.round(o.px-.5),oj=Math.round(o.py-.5);
   if(inB(oi,oj)&&_sim[oj*GW+oi])val+=12;
  }
 }
 var bricks=0;
 for(idx=0;idx<_sim.length;idx++){
  if(_sim[idx]&&grid[idx]===2){
   bricks++;
   if(bricks>=3)break;
  }
 }
 val+=bricks;
 return val;
}
function chooseTarget(pl,ci,cj){
 var best=null,bd=1e9,i,d;
 if(exit.active&&aiSafeNow(pl,exit.i,exit.j)){
  best={i:exit.i,j:exit.j};
  bd=Math.abs(exit.i-ci)+Math.abs(exit.j-cj);
 }
 for(i=0;i<powerups.length;i++){
  var p=powerups[i];
  if(!useful(pl,p.def))continue;
  if(!aiSafeNow(pl,p.i,p.j))continue;
  d=Math.abs(p.i-ci)+Math.abs(p.j-cj);
  if(d<bd){bd=d;best={i:p.i,j:p.j};}
 }
 for(i=0;i<enemies.length;i++){
  if(!enemies[i].alive)continue;
  var ei=Math.round(enemies[i].px-.5),ej=Math.round(enemies[i].py-.5);
  d=Math.abs(ei-ci)+Math.abs(ej-cj);
  if(d<bd){bd=d;best={i:ei,j:ej};}
 }
 if(hostile){
  for(i=0;i<players.length;i++){
   var o=players[i];
   if(!o.alive||o===pl)continue;
   var oi=Math.round(o.px-.5),oj=Math.round(o.py-.5);
   d=Math.abs(oi-ci)+Math.abs(oj-cj);
   if(d<bd){bd=d;best={i:oi,j:oj};}
  }
 }
 if(!best){
  for(var y=1;y<GH-1;y++){
   for(var x=1;x<GW-1;x++){
    if(grid[y*GW+x]!==2)continue;
    d=Math.abs(x-ci)+Math.abs(y-cj);
    if(d<bd){bd=d;best={i:x,j:y};}
   }
  }
 }
 return best;
}
function chooseNormalDir(pl,ci,cj,target,caution){
 var best=-1,bestScore=1e9;
 for(var d=0;d<4;d++){
  var nx=ci+DIRS[d][0],ny=cj+DIRS[d][1];
  if(!aiSafeNow(pl,nx,ny))continue;
  var hs=schedStartAt(nx,ny,null,Infinity);
  if(!caution){
   if(hs!==Infinity)continue;
  }else{
   if(hs!==Infinity&&hs<1.8)continue;
  }
  var dist=target?Math.abs(nx-target.i)+Math.abs(ny-target.j):0;
  var threat=nearestThreatD2(pl,nx,ny);
  var rev=(pl.aiLastDir>=0&&d===((pl.aiLastDir+2)&3))?25:0;
  var score=dist*10-Math.min(threat,20)*.35+rev+(caution&&hs!==Infinity?5:0);
  if(score<bestScore){bestScore=score;best=d;}
 }
 return best;
}
function setCpuDir(pl,d){
 pl.input.order=[d];pl.dir=d;pl.aiLastDir=d;
}
function tryRemoteDetonate(pl,ci,cj){
 if(!pl.remoteControl)return false;
 for(var i=0;i<bombs.length;i++){
  var b=bombs[i];
  if(b.owner!==pl||!b.remote||b.dead)continue;
  if(bombCoversTile(b,ci,cj))continue;
  var worth=false,e;
  for(e=0;e<enemies.length;e++){
   if(!enemies[e].alive)continue;
   if(bombCoversTile(b,Math.round(enemies[e].px-.5),Math.round(enemies[e].py-.5))){worth=true;break;}
  }
  if(!worth&&hostile){
   for(var p=0;p<players.length;p++){
    var o=players[p];
    if(!o.alive||o===pl)continue;
    if(bombCoversTile(b,Math.round(o.px-.5),Math.round(o.py-.5))){worth=true;break;}
   }
  }
  if(!worth&&b.age>6)worth=true;
  if(worth){pl.input.det=true;return true;}
 }
 return false;
}
function updateCPU(pl,dt){
 if(!pl.alive)return;
 pl.aiT-=dt;

 if(pl.moving){
  var di=Math.round(pl.tx-.5),dj=Math.round(pl.ty-.5);
  var step=1/Math.max(1,pl.speed);
  var bad=false;
  if(!inB(di,dj))bad=true;
  else if(!aiWalkable(di,dj))bad=true;
  else if(fireRemAt(di,dj)>0)bad=true;
  else if(enemyThreatAt(pl,di,dj))bad=true;
  else{
   var hsDest=schedStartAt(di,dj,null,Infinity);
   if(hsDest!==Infinity&&hsDest<step*1.25+AI_MARGIN)bad=true;
  }

  if(bad){
   var fi=pl.fromI,fj=pl.fromJ;
   if(inB(fi,fj)&&aiSafeNow(pl,fi,fj)){
    pl.px=pl.tx=fi+.5;pl.py=pl.ty=fj+.5;
    pl.moving=false;pl.input.order=[];
   }else{
    var ciNow=Math.round(pl.px-.5),cjNow=Math.round(pl.py-.5);
    if(inB(ciNow,cjNow)&&aiSafeNow(pl,ciNow,cjNow)){
     pl.px=pl.tx=ciNow+.5;pl.py=pl.ty=cjNow+.5;
     pl.moving=false;pl.input.order=[];
    }
   }
  }
  return;
 }

 if(pl.aiT>0){
  pl.input.order=[];
  return;
 }
 pl.aiT=AI_TICK;

 var ci=Math.round(pl.px-.5),cj=Math.round(pl.py-.5);
 if(!inB(ci,cj))return;
 ensureBuffers();

 var fireNow=fireRemAt(ci,cj)>0;
 var hsCur=schedStartAt(ci,cj,null,Infinity);
 var threatD2=nearestThreatD2(pl,ci,cj);

 /* If current cell is dangerous, distinguish temporary fire from scheduled bomb danger.
    Active fire is immediate; scheduled bombs are timed. The BFS below refuses to enter
    active fire and only crosses future blast zones if there is enough time to leave. */
 if(fireNow||hsCur!==Infinity||threatD2<1.1){
  var esc=findEscapeDir(pl,ci,cj,null,Infinity);
  if(esc>=0){
   pl.aiStuck=0;
   setCpuDir(pl,esc);
   return;
  }
  pl.input.order=[];
  pl.aiStuck+=AI_TICK;
  return;
 }

 pl.aiStuck=0;

 if(tryRemoteDetonate(pl,ci,cj))return;

 /* Bomb only when a temporal escape route exists. */
 if(pl.activeBombs<pl.maxBombs&&!bombAt(ci,cj)){
  var val=simBombValue(pl,ci,cj);
  if(val>0){
   var escB=findEscapeDirNoPanic(pl,ci,cj,_sim,BOMB_FUSE);
   if(escB>=0){
    pl.input.bomb=true;
    setCpuDir(pl,escB);
    return;
   }
  }
 }

 var target=chooseTarget(pl,ci,cj);
 var dir=chooseNormalDir(pl,ci,cj,target,false);
 if(dir<0)dir=chooseNormalDir(pl,ci,cj,target,true);

 if(dir<0){
  pl.input.order=[];
  return;
 }

 var revDir=(pl.aiLastDir>=0&&dir===((pl.aiLastDir+2)&3));
 if(revDir){
  pl.aiRev++;
  if(pl.aiRev>2){
   var alt=chooseNormalDir(pl,ci,cj,target,true);
   if(alt>=0&&alt!==((pl.aiLastDir+2)&3)){
    dir=alt;
   }else{
    pl.aiStuck+=AI_TICK;
    if(pl.aiStuck<.7){
     pl.input.order=[];
     return;
    }
    pl.aiRev=0;
    pl.aiStuck=0;
   }
  }
 }else{
  pl.aiRev=0;
  pl.aiStuck=0;
 }

 setCpuDir(pl,dir);
}

/* update */
function killPlayer(pl){
 if(!pl.alive||pl.invuln>0||pl.vestT>0)return;
 if(pl.hearts>0){
  pl.hearts--;pl.invuln=1.8;forceHud=true;return;
 }
 dropPrizes(pl);
 pl.alive=false;pl.lives--;pl.activeBombs=0;
 flash=1;shake=1;Audio.die();forceHud=true;
 spawnParts(Math.round(pl.px-.5),Math.round(pl.py-.5),10,.6,.9,1);
 pl.respawnT=1.3;
 var allDead=true;
 for(var i=0;i<players.length;i++){
  if(players[i].alive||players[i].lives>0){allDead=false;break;}
 }
 if(allDead){
  state='gameover';
  setTimeout(function(){
   if(state!=='gameover')return;
   showPanel('<h1>GAME<span> OVER</span></h1><div class="sub">THE COURSE WINS THIS ROUND</div>'+
    '<div class="big">TOTAL '+totalScore()+'</div><div class="hint">Reached level '+level+'</div>'+
    '<button data-act="retry">TRY AGAIN</button>'+
    '<div class="row3"><button class="alt" data-act="help">HELP</button>'+
    '<button class="alt" data-act="menu">MENU</button>'+
    '<button class="home" data-act="home">HOME</button></div>');
  },650);
 }
}
function respawn(pl){
 var corners=[{i:1,j:1},{i:GW-2,j:1},{i:GW-2,j:GH-2},{i:1,j:GH-2}];
 var c=corners[pl.id-1]||corners[0];
 pl.px=pl.tx=c.i+.5;pl.py=pl.ty=c.j+.5;
 pl.fromI=c.i;pl.fromJ=c.j;
 pl.moving=false;pl.dir=2;pl.alive=true;pl.invuln=2.6;
 pl.input.order=[];pl.camX=pl.px;pl.camY=pl.py;
 pl.aiRev=0;pl.aiStuck=0;
 forceHud=true;
}
function updatePlayer(pl,dt){
 if(!pl.alive)return;
 if(pl.invuln>0)pl.invuln=Math.max(0,pl.invuln-dt);
 if(pl.vestT>0)pl.vestT=Math.max(0,pl.vestT-dt);
 if(pl.moving){
  var dx=pl.tx-pl.px,dy=pl.ty-pl.py,dist=Math.sqrt(dx*dx+dy*dy),step=pl.speed*dt;
  if(step>=dist){pl.px=pl.tx;pl.py=pl.ty;pl.moving=false;checkPickups();}
  else{pl.px+=dx/dist*step;pl.py+=dy/dist*step;}
  return;
 }
 var d=pl.input.order.length?pl.input.order[pl.input.order.length-1]:-1;
 if(d>=0){
  pl.dir=d;
  var ci=Math.round(pl.px-.5),cj=Math.round(pl.py-.5);
  var nx=ci+DIRS[d][0],ny=cj+DIRS[d][1];
  if(canWalkPlayer(nx,ny,pl)){
   pl.fromI=ci;pl.fromJ=cj;
   pl.tx=nx+.5;pl.ty=ny+.5;pl.moving=true;
  }
 }
}
function updateBomb(b,dt){
 if(b.dead)return;
 b.age+=dt;

 if(b.mine){
  for(var i=0;i<enemies.length;i++){
   var e=enemies[i];
   if(!e.alive)continue;
   var dx=e.px-(b.i+.5),dy=e.py-(b.j+.5);
   if(dx*dx+dy*dy<.22){detonate(b);return;}
  }
  if(b.remote)return;
 }

 if(b.remote)return;
 b.t-=dt;
 if(b.t<=0)detonate(b);
}
function updateEnemy(en,dt){
 if(!en.alive)return;
 en.t+=dt;
 if(en.hitT>0)en.hitT=Math.max(0,en.hitT-dt);
 if(en.moving){
  var dx=en.tx-en.px,dy=en.ty-en.py,dist=Math.sqrt(dx*dx+dy*dy),step=en.speed*dt;
  if(step>=dist){en.px=en.tx;en.py=en.ty;en.moving=false;}
  else{en.px+=dx/dist*step;en.py+=dy/dist*step;}
  return;
 }
 var ci=Math.round(en.px-.5),cj=Math.round(en.py-.5);
 var pass=[],safe=[],d,nx,ny;
 for(d=0;d<4;d++){
  nx=ci+DIRS[d][0];ny=cj+DIRS[d][1];
  if(canWalkEnemy(nx,ny,en)){
   pass.push(d);
   if(!isDangerous(nx,ny))safe.push(d);
  }
 }
 var pool=safe.length?safe:pass;
 if(!pool.length)return;
 if(en.type.err&&Math.random()<.35){
  en.dir=pool[(Math.random()*pool.length)|0];
 }else if(en.type.smart){
  var best=null,bd=1e9;
  for(var i=0;i<players.length;i++){
   var pl=players[i];
   if(!pl.alive)continue;
   var ddx=pl.px-en.px,ddy=pl.py-en.py,dd=ddx*ddx+ddy*ddy;
   if(dd<bd){bd=dd;best=pl;}
  }
  var chosen=-1,bs=1e9;
  if(best){
   var pti=Math.round(best.px-.5),ptj=Math.round(best.py-.5);
   for(i=0;i<pool.length;i++){
    var nx2=ci+DIRS[pool[i]][0],ny2=cj+DIRS[pool[i]][1];
    var score=Math.abs(nx2-pti)+Math.abs(ny2-ptj);
    if(score<bs){bs=score;chosen=pool[i];}
   }
  }
  en.dir=chosen>=0?chosen:pool[(Math.random()*pool.length)|0];
 }else{
  var rev=(en.dir+2)&3,noRev=[];
  for(i=0;i<pool.length;i++)if(pool[i]!==rev)noRev.push(pool[i]);
  var p2=noRev.length?noRev:pool;
  en.dir=p2[(Math.random()*p2.length)|0];
 }
 en.tx=ci+DIRS[en.dir][0]+.5;
 en.ty=cj+DIRS[en.dir][1]+.5;
 en.moving=true;
}
function update(dt){
 time+=dt;
 if(shake>0)shake=Math.max(0,shake-dt*3.4);
 if(flash>0)flash=Math.max(0,flash-dt*2.6);
 if(frozen>0)frozen=Math.max(0,frozen-dt);

 var i;
 for(i=0;i<powerups.length;i++)if(powerups[i].grace>0)powerups[i].grace-=dt;
 for(i=0;i<PART;i++){
  var pa=particles[i];
  if(pa.life<=0)continue;
  pa.life-=dt;
  if(pa.life<=0){partFree.push(i);continue;}
  pa.x+=pa.vx*dt;pa.y+=pa.vy*dt;
  pa.vx*=.93;pa.vy*=.93;pa.vy+=dt*1.4;
 }
 if(state!=='playing')return;

 for(i=0;i<players.length;i++){
  var pl=players[i];
  if(pl.alive){
   if(pl.cpu)updateCPU(pl,dt);
   updatePlayer(pl,dt);
   if(pl.input.bomb){pl.input.bomb=false;placeBomb(pl);}
   if(pl.input.det){pl.input.det=false;detonateRemote(pl);}
  }else if(pl.respawnT>0){
   pl.respawnT-=dt;
   if(pl.respawnT<=0&&pl.lives>0)respawn(pl);
  }
 }

 for(i=bombs.length-1;i>=0;i--)updateBomb(bombs[i],dt);
 for(i=bombs.length-1;i>=0;i--)if(bombs[i].dead)bombs.splice(i,1);

 for(i=blasts.length-1;i>=0;i--){
  var bl=blasts[i];
  bl.t-=dt;
  for(var ti=0;ti<bl.tiles.length;ti++){
   var tile=bl.tiles[ti],cx=tile.i+.5,cy=tile.j+.5;
   for(var pi=0;pi<players.length;pi++){
    var p2=players[pi];
    if(!p2.alive||p2.invuln>0||p2.vestT>0)continue;
    var dx=p2.px-cx,dy=p2.py-cy;
    if(dx*dx+dy*dy<.25)killPlayer(p2);
   }
   for(var ei=0;ei<enemies.length;ei++){
    var en=enemies[ei];
    if(!en.alive||en.hitT>0)continue;
    var edx=en.px-cx,edy=en.py-cy;
    if(edx*edx+edy*edy<.27){
     en.hp--;en.hitT=.5;
     if(en.hp<=0){
      en.alive=false;
      addScore(bl.owner,150+en.typeIdx*40);
      spawnParts(tile.i,tile.j,6,1,.5,.9);
      Audio.enemy();forceHud=true;
     }
    }
   }
  }
  if(bl.t<=0)blasts.splice(i,1);
 }

 var alive=0;
 for(i=0;i<enemies.length;i++){
  var e=enemies[i];
  if(!e.alive)continue;
  alive++;
  if(frozen<=0)updateEnemy(e,dt);
  for(var pj=0;pj<players.length;pj++){
   var pl3=players[pj];
   if(!pl3.alive||pl3.invuln>0||pl3.vestT>0)continue;
   var ddx=e.px-pl3.px,ddy=e.py-pl3.py;
   if(ddx*ddx+ddy*ddy<.3)killPlayer(pl3);
  }
 }

 if(!exit.active&&alive===0){
  exit.active=true;
  Audio.win();
 }

 if(exit.active){
  for(i=0;i<players.length;i++){
   var pl4=players[i];
   if(!pl4.alive)continue;
   var ex=pl4.px-(exit.i+.5),ey=pl4.py-(exit.j+.5);
   if(ex*ex+ey*ey<.3){
    state='levelclear';
    addScore(pl4,500+level*120);
    forceHud=true;Audio.win();
    var cap=level;
    setTimeout(function(){
     if(state!=='levelclear')return;
     showPanel('<h1>LEVEL<span> CLEAR</span></h1><div class="sub">COURSE '+cap+' COMPLETE</div>'+
      '<div class="big">TOTAL '+totalScore()+'</div><button data-act="next">NEXT COURSE</button>'+
      '<div class="row2" style="margin-top:6px"><button class="alt" data-act="menu">MAIN MENU</button>'+
      '<button class="home" data-act="home">HOME</button></div>');
    },550);
    break;
   }
  }
 }

 splitOn=shouldSplit();
 updateCameras(dt);
}
function shouldSplit(){
 if(playerMode!=='2p'||players.length!==2||players[0].cpu||players[1].cpu||state!=='playing')return false;
 var a=players[0],b=players[1];
 if(!a.alive||!b.alive)return false;
 var dx=Math.abs(a.px-b.px)*ts,dy=Math.abs(a.py-b.py)*ts,m=1.5*ts;
 return dx+m*2>canvas.width||dy+m*2>canvas.height;
}
function updateCameras(dt){
 var f=1-Math.exp(-dt/.14);
 var split=splitOn&&players.length===2&&!players[0].cpu&&!players[1].cpu&&players[0].alive&&players[1].alive;
 var i;
 if(split&&!wasSplit){
  players[0].camX=camX;players[0].camY=camY;
  players[1].camX=camX;players[1].camY=camY;
  if(players[0].px<=players[1].px){players[0].splitSide=0;players[1].splitSide=1;}
  else{players[0].splitSide=1;players[1].splitSide=0;}
 }
 if(!split&&wasSplit){
  var ax=0,ay=0,n=0;
  for(i=0;i<players.length;i++)if(players[i].alive){ax+=players[i].camX;ay+=players[i].camY;n++;}
  if(n){camX=ax/n;camY=ay/n;}
 }
 wasSplit=split;
 var cx=0,cy=0,cnt=0;
 for(i=0;i<players.length;i++)if(players[i].alive&&!players[i].cpu){cx+=players[i].px;cy+=players[i].py;cnt++;}
 if(!cnt)for(i=0;i<players.length;i++)if(players[i].alive){cx+=players[i].px;cy+=players[i].py;cnt++;}
 if(cnt){cx/=cnt;cy/=cnt;camX+=(cx-camX)*f;camY+=(cy-camY)*f;}
 if(split){
  for(i=0;i<2;i++){
   var p=players[i];
   p.camX+=(p.px-p.camX)*f;
   p.camY+=(p.py-p.camY)*f;
  }
 }else{
  for(i=0;i<players.length;i++){
   players[i].camX+=(camX-players[i].camX)*f;
   players[i].camY+=(camY-players[i].camY)*f;
  }
 }
}

/* render */
function singleCam(vw,vh){
 var ww=GW*ts,wh=GH*ts,x,y;
 if(ww>vw)x=clamp(camX*ts-vw/2,0,ww-vw);else x=(ww-vw)/2;
 if(wh>vh)y=clamp(camY*ts-vh/2,0,wh-vh);else y=(wh-vh)/2;
 return {x:x,y:y};
}
function splitCam(pl,vw,vh){
 return {x:pl.camX*ts-vw/2,y:pl.camY*ts-vh/2};
}
function playerSpriteSet(pl){
 if(pl.id===1)return [T.P1_U,T.P1_R,T.P1_D,T.P1_L];
 if(pl.id===2)return [T.P2_U,T.P2_R,T.P2_D,T.P2_L];
 if(pl.id===3)return [T.P3_U,T.P3_R,T.P3_D,T.P3_L];
 return [T.P4_U,T.P4_R,T.P4_D,T.P4_L];
}
function drawScene(cam,vw,vh,shx,shy){
 if(!grid)return;
 ctx.save();
 ctx.translate(shx,shy);
 var cx=Math.floor(cam.x),cy=Math.floor(cam.y),ox=-cx,oy=-cy;
 if(cx>=0&&cy>=0&&cx+vw<=bg.width&&cy+vh<=bg.height){
  ctx.drawImage(bg,cx,cy,vw,vh,0,0,vw,vh);
 }else{
  ctx.drawImage(bg,ox,oy);
 }
 function vis(x,y){return x>-ts*2&&x<vw+ts*2&&y>-ts*2&&y<vh+ts*2;}
 var i;

 var px=ox+exit.i*ts,py=oy+exit.j*ts;
 if(vis(px,py)){
  blit(ctx,exit.active?T.PORTAL_ON:T.PORTAL_OFF,px,py,ts,ts,exit.active?(.8+.2*Math.sin(time*7)):.4);
 }

 for(i=0;i<powerups.length;i++){
  var pu=powerups[i];
  var pux=ox+pu.i*ts,puy=oy+pu.j*ts;
  if(vis(pux,puy))blit(ctx,pu.def.tile,pux,puy,ts,ts);
 }

 for(i=0;i<bombs.length;i++){
  var bm=bombs[i];
  if(bm.dead)continue;
  var bx=ox+bm.px*ts,by=oy+bm.py*ts;
  if(!vis(bx,by))continue;
  var fr=Math.floor(bm.age*8)%3,sc=1+.06*Math.sin(bm.age*17),sz=ts*.86*sc;
  blit(ctx,T.BOMB0+fr,bx-sz/2,by-sz/2,sz,sz,bm.mine?.45+.15*Math.sin(time*3):1);
 }

 for(i=0;i<players.length;i++){
  var pl=players[i];
  if(!pl.alive)continue;
  var plx=ox+pl.px*ts,ply=oy+pl.py*ts;
  if(!vis(plx,ply))continue;
  var blink=pl.invuln>0&&(Math.floor(time*16)%2===0);
  if(!blink){
   var set=playerSpriteSet(pl);
   blit(ctx,set[pl.dir],plx-ts*.45,ply-ts*.45,ts*.9,ts*.9,pl.vestT>0?.7+.3*Math.sin(time*12):1);
  }
 }

 for(i=0;i<enemies.length;i++){
  var en=enemies[i];
  if(!en.alive)continue;
  var ex=ox+en.px*ts,ey=oy+en.py*ts;
  if(!vis(ex,ey))continue;
  var frame=Math.floor(time*6+i)&1;
  blit(ctx,T.E0+en.typeIdx*2+frame,ex-ts*.45,ey-ts*.45,ts*.9,ts*.9);
 }

 for(i=0;i<blasts.length;i++){
  var bl=blasts[i],k=bl.t/bl.max,grow=1-k;
  var sc2=.5+.62*Math.min(1,grow*3.6),al=Math.min(1,k*2.6);
  for(var ti=0;ti<bl.tiles.length;ti++){
   var tt=bl.tiles[ti],tx=ox+tt.i*ts,ty=oy+tt.j*ts;
   if(!vis(tx,ty))continue;
   var img=tt.d===-1?T.EXP_C:((tt.d===1||tt.d===3)?T.EXP_H:T.EXP_V);
   var zs=ts*sc2;
   blit(ctx,img,tx+(ts-zs)/2,ty+(ts-zs)/2,zs,zs,al);
  }
 }

 for(i=0;i<PART;i++){
  var pa=particles[i];
  if(pa.life<=0)continue;
  var la=clamp(pa.life/pa.max,0,1),sx=ox+pa.x*ts,sy=oy+pa.y*ts,sz=ts*pa.s*la;
  if(!vis(sx,sy))continue;
  ctx.fillStyle='rgba('+Math.floor(pa.r*255)+','+Math.floor(pa.g*255)+','+Math.floor(pa.b*255)+','+la.toFixed(3)+')';
  ctx.fillRect(sx-sz/2,sy-sz/2,sz,sz);
 }

 if(flash>0){ctx.fillStyle='rgba(255,220,220,'+(flash*.35).toFixed(3)+')';ctx.fillRect(0,0,vw,vh);}
 if(frozen>0){ctx.fillStyle='rgba(160,210,255,.06)';ctx.fillRect(0,0,vw,vh);}
 ctx.restore();
}
function renderView(vx,vy,vw,vh,cam,shx,shy){
 ctx.save();
 ctx.beginPath();ctx.rect(vx,vy,vw,vh);ctx.clip();
 ctx.translate(vx,vy);
 drawScene(cam,vw,vh,shx,shy);
 ctx.restore();
}
function render(){
 var W=canvas.width,H=canvas.height;
 ctx.setTransform(1,0,0,1,0,0);
 ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#060911';ctx.fillRect(0,0,W,H);
 if(state==='menu'||!grid)return;
 var shx=shake>0?(Math.random()-.5)*shake*8:0;
 var shy=shake>0?(Math.random()-.5)*shake*8:0;
 var split=splitOn&&players.length===2&&!players[0].cpu&&!players[1].cpu&&players[0].alive&&players[1].alive;
 if(split){
  var p1=players[0],p2=players[1];
  var pL=p1.splitSide===0?p1:p2,pR=p1.splitSide===1?p1:p2;
  if(W>=H){
   var hw=Math.floor(W/2);
   renderView(0,0,hw,H,splitCam(pL,hw,H),shx,shy);
   renderView(hw,0,W-hw,H,splitCam(pR,W-hw,H),shx,shy);
   ctx.fillStyle='rgba(120,180,255,.4)';ctx.fillRect(hw-1,0,2,H);
  }else{
   var hh=Math.floor(H/2);
   renderView(0,0,W,hh,splitCam(pL,W,hh),shx,shy);
   renderView(0,hh,W,H-hh,splitCam(pR,W,H-hh),shx,shy);
   ctx.fillStyle='rgba(120,180,255,.4)';ctx.fillRect(0,hh-1,W,2);
  }
 }else{
  renderView(0,0,W,H,singleCam(W,H),shx,shy);
 }
}

/* panels */
function showPanel(html){panel.innerHTML=html;overlay.style.display='block';}
function hidePanel(){overlay.style.display='none';}
function pickBtns(grp,cur,vals){
 var out='';
 for(var i=0;i<vals.length;i++){
  out+='<button class="pick '+(cur===vals[i][0]?'on':'')+'" data-grp="'+grp+'" data-val="'+vals[i][0]+'">'+vals[i][1]+'</button>';
 }
 return out;
}

 state='menu';splitOn=wasSplit=false;

 showPanel('<h1>BOMB<span>BLASTER</span></h1>'+

function showPause(){
 if(state!=='playing'&&state!=='paused')return;
 state='paused';
 var code=encodePass();
 lsSet(PASS_KEY,code);
 showPanel('<h1>PAUSED</h1><div class="sub">LV '+level+' · TOTAL '+totalScore()+'</div>'+
  '<button data-act="resume">CONTINUE</button>'+
  '<button class="alt" data-act="replay">REPLAY LEVEL</button>'+
  '<button class="alt" data-act="help">HELP</button>'+
  '<div class="lbl">PASSCODE</div><input id="pauseCode" class="code" readonly value="'+code+'">'+
  '<button class="alt" data-act="copy">SAVE &amp; COPY PASSCODE</button>'+
  '<div class="row2" style="margin-top:8px"><button class="alt" data-act="menu">MAIN MENU</button>'+
  '<button class="home" data-act="home">HOME</button></div>'+
  '<div class="hint">ESC or tap ⏸ to resume</div>');
}
function encodePass(){
 return b64e(JSON.stringify({
  v:9,s:seedStr,l:level,m:playerMode,h:hostile?1:0,z:levelSize,
  p:players.map(function(p){return {lv:p.lives,s:p.score||0};})
 }));
}
function decodePass(code){
 if(!code)return null;
 var json=b64d(code.trim());
 if(!json)return null;
 try{
  var o=JSON.parse(json);
  if(!o||o.v!==9)return null;
  return o;
 }catch(e){return null;}
}
function startNew(seed){
 Audio.init();Audio.resume();
 seedStr=(seed&&seed.length)?seed:String(Math.floor(Math.random()*1e9));
 level=1;players=[];
 buildLevel(null);
 hidePanel();state='playing';last=performance.now();updateTouch();forceHud=true;
}
function continueGame(o){
 Audio.init();Audio.resume();
 seedStr=o.s||'seed';level=o.l||1;playerMode=o.m||'1p';hostile=!!o.h;levelSize=o.z||'fit';
 players=[];
 buildLevel(o);
 hidePanel();state='playing';last=performance.now();updateTouch();forceHud=true;
}
panel.addEventListener('click',function(ev){
 var btn=ev.target&&ev.target.closest?ev.target.closest('button'):null;
 if(!btn)return;
 if(btn.classList.contains('pick')){
  var grp=btn.getAttribute('data-grp'),val=btn.getAttribute('data-val');
  var picks=panel.querySelectorAll('.pick[data-grp="'+grp+'"]');
  for(var i=0;i<picks.length;i++)picks[i].classList.remove('on');
  btn.classList.add('on');
  if(grp==='size')levelSize=val;
  if(grp==='mode')playerMode=val;
  if(grp==='rel')hostile=(val==='hostile');
  return;
 }
 var act=btn.getAttribute('data-act');
 if(!act)return;
 if(act==='play'){
  var inp=$('seedIn');
  startNew(inp?inp.value.trim():'');
 }else if(act==='home'){
  try{window.location.href='https://1nd1g0.github.io/';}catch(e){}
 }else if(act==='help'){
  showHelp(state==='paused'?'pause':'menu');
 }else if(act==='helpBack'){
  if(helpFrom==='pause')showPause();else showMenu();
 }else if(act==='continue'){
  var ci=$('codeIn'),o=decodePass(ci?ci.value:'');
  if(o)continueGame(o);
 }else if(act==='resume'){
  hidePanel();state='playing';last=performance.now();
 }else if(act==='replay'){
  buildLevel(null);hidePanel();state='playing';last=performance.now();forceHud=true;
 }else if(act==='menu'){
  showMenu();
 }else if(act==='retry'){
  startNew(seedStr);
 }else if(act==='next'){
  level++;buildLevel(null);hidePanel();state='playing';last=performance.now();forceHud=true;
 }else if(act==='copy'){
  var pc=$('pauseCode');
  if(!pc)return;
  var code=pc.value;lsSet(PASS_KEY,code);
  var ok=false;
  try{
   if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code);ok=true;}
  }catch(e){}
  if(!ok){
   try{pc.removeAttribute('readonly');pc.select();document.execCommand('copy');pc.setAttribute('readonly','readonly');ok=true;}catch(e){}
  }
  pc.value=code;
 }
});
window.addEventListener('keydown',function(ev){
 if(ev.keyCode===27){
  if(overlay.style.display==='block'&&panel.querySelector('button[data-act="helpBack"]')){
   if(helpFrom==='pause')showPause();else showMenu();
   ev.preventDefault();return;
  }
  if(state==='playing'){showPause();ev.preventDefault();}
  else if(state==='paused'){hidePanel();state='playing';last=performance.now();ev.preventDefault();}
 }
});

/* input */
function pushDir(pl,d,on){
 if(!pl||pl.cpu||state!=='playing')return;
 pl.input.dirs[d]=on;
 var idx=pl.input.order.indexOf(d);
 if(on){if(idx>=0)pl.input.order.splice(idx,1);pl.input.order.push(d);}
 else if(idx>=0)pl.input.order.splice(idx,1);
}
function bomb(i){
 var p=players[i];
 if(p&&!p.cpu&&state==='playing')p.input.bomb=true;
}
function remote(i){
 var p=players[i];
 if(p&&!p.cpu&&state==='playing')p.input.det=true;
}
var WASD={87:0,68:1,83:2,65:3},ARR={38:0,39:1,40:2,37:3};
window.addEventListener('keydown',function(ev){
 if(state!=='playing'||ev.repeat)return;
 var c=ev.keyCode;
 var w=WASD[c]!==undefined,a=ARR[c]!==undefined;
 if(w||a){
  var d=w?WASD[c]:ARR[c];
  if(playerMode==='2p')pushDir(players[w?0:1],d,true);
  else pushDir(players[0],d,true);
  ev.preventDefault();return;
 }
 if(c===32){bomb(0);ev.preventDefault();}
 if(c===13){bomb(playerMode==='2p'?1:0);ev.preventDefault();}
 if(c===88){bomb(0);ev.preventDefault();}
 if(c===90){remote(0);ev.preventDefault();}
 if(c===76){bomb(playerMode==='2p'?1:0);ev.preventDefault();}
 if(c===75){remote(playerMode==='2p'?1:0);ev.preventDefault();}
},false);
window.addEventListener('keyup',function(ev){
 if(state!=='playing')return;
 var c=ev.keyCode,w=WASD[c]!==undefined,a=ARR[c]!==undefined;
 if(w||a){
  var d=w?WASD[c]:ARR[c];
  if(playerMode==='2p')pushDir(players[w?0:1],d,false);
  else pushDir(players[0],d,false);
  ev.preventDefault();
 }
},false);
window.addEventListener('blur',function(){
 for(var i=0;i<players.length;i++){
  players[i].input.dirs=[false,false,false,false];
  players[i].input.order=[];
 }
});

/* touch */
function updateTouch(){
 var touch=$('touch');
 if(!IS_MOBILE){touch.classList.remove('on');return;}
 touch.classList.add('on');
 $('dpad2').className='dpad'+(playerMode==='2p'?' on':'');
 $('p2Col').className=playerMode==='2p'?'on':'';
}
function bindDir(btn,idx,d){
 function down(e){
  if(e.cancelable)e.preventDefault();
  var p=players[idx];
  if(p&&!p.cpu&&state==='playing'){pushDir(p,d,true);btn.classList.add('act');}
 }
 function up(e){
  if(e.cancelable)e.preventDefault();
  var p=players[idx];
  if(p&&!p.cpu){pushDir(p,d,false);btn.classList.remove('act');}
 }
 btn.addEventListener('touchstart',down,{passive:false});
 btn.addEventListener('touchend',up,{passive:false});
 btn.addEventListener('touchcancel',up,{passive:false});
 btn.addEventListener('mousedown',down);
 btn.addEventListener('mouseup',up);
 btn.addEventListener('mouseleave',up);
}
function bindAct(btn,fn){
 var f=false;
 function down(e){
  if(e.cancelable)e.preventDefault();
  if(f)return;
  f=true;fn();btn.classList.add('act');
 }
 function up(e){
  if(e.cancelable)e.preventDefault();
  f=false;btn.classList.remove('act');
 }
 btn.addEventListener('touchstart',down,{passive:false});
 btn.addEventListener('touchend',up,{passive:false});
 btn.addEventListener('touchcancel',up,{passive:false});
 btn.addEventListener('mousedown',down);
 btn.addEventListener('mouseup',up);
 btn.addEventListener('mouseleave',up);
}
(function(){
 var d1=$('dpad1').querySelectorAll('button'),d2=$('dpad2').querySelectorAll('button');
 for(var i=0;i<4;i++){
  bindDir(d1[i],0,parseInt(d1[i].getAttribute('data-d'),10));
  bindDir(d2[i],1,parseInt(d2[i].getAttribute('data-d'),10));
 }
 bindAct($('b1'),function(){bomb(0);});
 bindAct($('b1remote'),function(){remote(0);});
 bindAct($('b2'),function(){bomb(1);});
 bindAct($('b2remote'),function(){remote(1);});
})();
['touchstart','mousedown','keydown'].forEach(function(e){
 window.addEventListener(e,function(){Audio.resume();},{passive:true});
});

/* boot */
atlas=buildAtlas();
buildHud();
layout();
sizeCanvas();
showMenu();
updateHud();

function frame(now){
 requestAnimationFrame(frame);
 var dt=(now-last)/1000;last=now;
 if(dt>.05)dt=.05;
 if(dt<0)dt=0;
 update(dt);
 render();
 if(forceHud||now-lastHud>150){updateHud();lastHud=now;}
}
requestAnimationFrame(frame);

})();
