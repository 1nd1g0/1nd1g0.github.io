function applyKonami(pl){
  pl.maxBombs=8;pl.fire=10;pl.speed=8.5;pl.lives=9;pl.hearts=3;
  pl.bombKick=true;pl.glove=true;pl.bombPass=true;pl.wallPass=true;
  pl.firePass=true;pl.remoteControl=true;pl.lineBomb=true;
  pl.spikeBomb=true;pl.bouncyBomb=true;pl.clusterBomb=true;
  pl.dangerousBomb=true;pl.landMine=true;pl.powerBombReady=true;
}
function startGame(seed,resume){
  Audio_.init();Audio_.resume();Audio_.setMusic(true);
  if(resume && resume.v){
    seedStr=resume.s||'seed';
    level=resume.l||1;
    playerMode=resume.m||'1p';
    cpuHostile=(resume.h===1);
    levelSize=resume.z||'fit';
  } else {
    seedStr=(seed&&seed.length)?seed:String(Math.floor(Math.random()*1e9));
    level=1;
  }
  players=[];
  updateCanvasLayout();
  applyCanvasSize();
  buildLevel(resume);
  if(resume && resume.p){
    for(var i=0;i<players.length && i<resume.p.length;i++){
      var pd=resume.p[i];
      if(typeof pd.lv==='number') players[i].lives=pd.lv;
      if(typeof pd.s==='number') players[i].score=pd.s;
    }
  }
  if(konamiUnlocked && !resume){
    for(var k=0;k<players.length;k++) applyKonami(players[k]);
  }
  shake=0;flash=0;hintT=0;frozenT=0;
  splitScreenOn=false;wasSplitLastFrame=false;
  tickerClear();
  while(arrowsEl.firstChild)arrowsEl.removeChild(arrowsEl.firstChild);
  hidePanel();
  state='playing';
  last=performance.now();
  updateHud();
  updateTouchPads();
}
function replayLevel(){
  buildLevel(null);
  shake=0;flash=0;hintT=0;frozenT=0;
  splitScreenOn=false;wasSplitLastFrame=false;
  tickerClear();
  while(arrowsEl.firstChild)arrowsEl.removeChild(arrowsEl.firstChild);
  hidePanel();
  state='playing';
  last=performance.now();
  updateHud();
}
panel.addEventListener('click',function(ev){
  var btn=ev.target&&ev.target.closest?ev.target.closest('button'):null;
  if(!btn)return;
  var act=btn.getAttribute('data-act');
  if(!act)return;
  if(act==='play'){
    var inp=document.getElementById('seedIn');
    startGame(inp?inp.value.trim():'');
  } else if(act==='next'){
    level++;
    buildLevel(null);
    shake=0;flash=0;hintT=0;frozenT=0;
    splitScreenOn=false;wasSplitLastFrame=false;
    tickerClear();
    while(arrowsEl.firstChild)arrowsEl.removeChild(arrowsEl.firstChild);
    hidePanel();state='playing';last=performance.now();
    updateHud();
  } else if(act==='retry'){
    startGame(seedStr);
  } else if(act==='menu'||act==='menu2'){
    showMenu();
  } else if(act==='home'){
    try{ window.location.href='https://1nd1g0.github.io/'; }catch(e){}
  } else if(act==='continue'){
    var ci=document.getElementById('codeIn');
    var code=ci?ci.value.trim():'';
    var r=decodePasscode(code);
    if(r) startGame(null,r);
    else tickerPush(null,'<b>Invalid passcode.</b>');
  } else if(act==='resume'){
    hidePanel();state='playing';last=performance.now();
  } else if(act==='replay'){
    replayLevel();
  } else if(act==='copyCode'){
    var pc=document.getElementById('pauseCode');
    if(pc){
      var code2=pc.value;
      lsSet(PASSCODE_KEY,code2);
      var ok=false;
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(code2);
          ok=true;
        }
      }catch(e){}
      if(!ok){
        try{
          pc.removeAttribute('readonly');
          pc.select();
          document.execCommand('copy');
          pc.setAttribute('readonly','readonly');
          ok=true;
        }catch(e){}
      }
      pc.value=code2;
      tickerPush(null, ok? '<b>Passcode copied &amp; saved.</b>':'<b>Passcode saved.</b>');
    }
  }
},false);

/* Pause button binding */
(function(){
  var pb=document.getElementById('pauseBtn');
  if(!pb) return;
  function toggle(){
    Audio_.resume();
    if(state==='playing') showPause();
    else if(state==='paused'){hidePanel();state='playing';last=performance.now();}
  }
  pb.addEventListener('click',function(ev){ev.preventDefault();toggle();});
  pb.addEventListener('touchstart',function(ev){ev.preventDefault();toggle();},{passive:false});
})();

window.addEventListener('keydown',function(ev){
  if(overlay.style.display!=='flex') return;
  var code=ev.keyCode;
  if(code!==32&&code!==13) return;
  var active=document.activeElement;
  if(active && active.tagName==='INPUT') return;
  var btn=panel.querySelector('button[data-act]');
  if(btn){ev.preventDefault();ev.stopPropagation();btn.click();}
},true);
window.addEventListener('keydown',function(ev){
  if(ev.keyCode!==27) return;
  if(state==='playing'){showPause();ev.preventDefault();ev.stopPropagation();}
  else if(state==='paused'){hidePanel();state='playing';last=performance.now();ev.preventDefault();ev.stopPropagation();}
},true);
var KONAMI=[38,38,40,40,37,39,37,39,66,65];
window.addEventListener('keydown',function(ev){
  if(state!=='menu') return;
  konamiBuf.push(ev.keyCode);
  if(konamiBuf.length>KONAMI.length) konamiBuf.shift();
  if(konamiBuf.length===KONAMI.length){
    var ok=true;
    for(var i=0;i<KONAMI.length;i++) if(konamiBuf[i]!==KONAMI[i]){ok=false;break;}
    if(ok){
      konamiUnlocked=true;
      tickerPush(null,'<b>KONAMI!</b> All upgrades unlocked — press START.');
      konamiBuf=[];
    }
  }
});

/* ============== INPUT ============== */
var KEYMAP_WASD={87:0,68:1,83:2,65:3};
var KEYMAP_ARROWS={38:0,39:1,40:2,37:3};
var shiftHeld=false;
function pushDir(pl,d,on){
  if(!pl||pl.cpu)return;
  pl.input.dirs[d]=on;
  var idx=pl.input.dirOrder.indexOf(d);
  if(on){
    if(idx>=0)pl.input.dirOrder.splice(idx,1);
    pl.input.dirOrder.push(d);
  } else {
    if(idx>=0)pl.input.dirOrder.splice(idx,1);
  }
}
function triggerBomb(playerIdx){
  var p=players[playerIdx];
  if(!p) return;
  if(p.cpu) return;
  if(state!=='playing') return;
  p.input.bomb=true;
}
function triggerRemote(playerIdx){
  var p=players[playerIdx];
  if(!p) return;
  if(p.cpu) return;
  if(state!=='playing') return;
  p.input.detonate=true;
}
function handleDown(ev){
  var code=ev.keyCode;
  if(code===16){shiftHeld=true;return;}
  var isWASD=KEYMAP_WASD[code]!==undefined;
  var isArrow=KEYMAP_ARROWS[code]!==undefined;
  var d=isWASD?KEYMAP_WASD[code]:(isArrow?KEYMAP_ARROWS[code]:-1);
  if(d>=0){
    if(playerMode==='2p'){
      if(isWASD)pushDir(players[0],d,true);
      else pushDir(players[1],d,true);
    } else {
      pushDir(players[0],d,true);
    }
    ev.preventDefault();return;
  }
  if(code===32){
    if(state==='playing'){
      var p=players[0];
      if(p&&!p.cpu){
        if(shiftHeld||ev.shiftKey) triggerRemote(0);
        else triggerBomb(0);
      }
    }
    ev.preventDefault();return;
  }
  if(code===13){
    if(state==='playing'){
      var idx=(playerMode==='2p')?1:0;
      var p2=players[idx];
      if(p2&&!p2.cpu){
        if(shiftHeld||ev.shiftKey) triggerRemote(idx);
        else triggerBomb(idx);
      }
    }
    ev.preventDefault();return;
  }
  if(code===88){ triggerBomb(0); ev.preventDefault(); return; }
  if(code===90){ triggerRemote(0); ev.preventDefault(); return; }
  if(code===76){ triggerBomb(playerMode==='2p'?1:0); ev.preventDefault(); return; }
  if(code===75){ triggerRemote(playerMode==='2p'?1:0); ev.preventDefault(); return; }
  if(code===77){musicEnabled=!musicEnabled;Audio_.setMusic(musicEnabled);}
}
function handleUp(ev){
  var code=ev.keyCode;
  if(code===16){shiftHeld=false;return;}
  var isWASD=KEYMAP_WASD[code]!==undefined;
  var isArrow=KEYMAP_ARROWS[code]!==undefined;
  var d=isWASD?KEYMAP_WASD[code]:(isArrow?KEYMAP_ARROWS[code]:-1);
  if(d>=0){
    if(playerMode==='2p'){
      if(isWASD)pushDir(players[0],d,false);
      else pushDir(players[1],d,false);
    } else {
      pushDir(players[0],d,false);
    }
    ev.preventDefault();
  }
}
window.addEventListener('keydown',function(ev){
  if(ev.repeat){if(ev.keyCode===32||ev.keyCode===13)ev.preventDefault();return;}
  handleDown(ev);
},false);
window.addEventListener('keyup',handleUp,false);
window.addEventListener('blur',function(){
  shiftHeld=false;
  for(var i=0;i<players.length;i++){
    var p=players[i];
    p.input.dirs[0]=false;p.input.dirs[1]=false;p.input.dirs[2]=false;p.input.dirs[3]=false;
    p.input.dirOrder.length=0;
  }
},false);

/* ============== TOUCH ============== */
var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
function updateTouchPads(){
  var touchEl=document.getElementById('touch');
  var p2wrap=document.getElementById('p2wrap');
  if(!isTouch){touchEl.classList.remove('on');return;}
  touchEl.classList.add('on');
  if(playerMode==='2p'){p2wrap.classList.add('on');}
  else{p2wrap.classList.remove('on');}
}
(function(){
  function setPlayerDir(plIdx, d, on){
    var pl=players[plIdx];
    if(!pl||pl.cpu)return;
    pushDir(pl,d,on);
  }
  function highlightButton(dpadEl, d){
    var btns=dpadEl.querySelectorAll('button');
    for(var i=0;i<btns.length;i++){
      var bd=parseInt(btns[i].getAttribute('data-d'),10);
      if(bd===d) btns[i].classList.add('act');
      else btns[i].classList.remove('act');
    }
  }
  function hitTest(dpadEl, clientX, clientY){
    var btns=dpadEl.querySelectorAll('button');
    for(var i=0;i<btns.length;i++){
      var b=btns[i];
      var r=b.getBoundingClientRect();
      if(clientX>=r.left&&clientX<=r.right&&clientY>=r.top&&clientY<=r.bottom){
        return parseInt(b.getAttribute('data-d'),10);
      }
    }
    var dr=dpadEl.getBoundingClientRect();
    if(clientX<dr.left||clientX>dr.right||clientY<dr.top||clientY>dr.bottom) return -1;
    var cx=(clientX-dr.left)/dr.width-0.5;
    var cy=(clientY-dr.top)/dr.height-0.5;
    if(Math.abs(cx)>Math.abs(cy)) return cx>0?1:3;
    return cy>0?2:0;
  }
  function bindSwipeDpad(dpadEl,plIdx){
    var activeDir=-1;
    var touchId=null;
    function start(ev){
      ev.preventDefault();
      var t=ev.changedTouches?ev.changedTouches[0]:ev;
      touchId=ev.changedTouches?t.identifier:0;
      var d=hitTest(dpadEl,t.clientX,t.clientY);
      if(d>=0){
        setPlayerDir(plIdx,d,true);
        activeDir=d;
        highlightButton(dpadEl,d);
      }
    }
    function move(ev){
      ev.preventDefault();
      var t=null;
      if(ev.changedTouches){
        for(var i=0;i<ev.changedTouches.length;i++){
          if(ev.changedTouches[i].identifier===touchId){t=ev.changedTouches[i];break;}
        }
      } else t=ev;
      if(!t) return;
      var d=hitTest(dpadEl,t.clientX,t.clientY);
      if(d!==activeDir){
        if(activeDir>=0) setPlayerDir(plIdx,activeDir,false);
        if(d>=0) setPlayerDir(plIdx,d,true);
        activeDir=d;
        highlightButton(dpadEl,d);
      }
    }
    function end(ev){
      ev.preventDefault();
      if(activeDir>=0) setPlayerDir(plIdx,activeDir,false);
      activeDir=-1;
      highlightButton(dpadEl,-1);
    }
    dpadEl.addEventListener('touchstart',start,{passive:false});
    dpadEl.addEventListener('touchmove',move,{passive:false});
    dpadEl.addEventListener('touchend',end,{passive:false});
    dpadEl.addEventListener('touchcancel',end,{passive:false});
    var mDown=false;
    dpadEl.addEventListener('mousedown',function(ev){
      mDown=true;
      var d=hitTest(dpadEl,ev.clientX,ev.clientY);
      if(d>=0){setPlayerDir(plIdx,d,true);activeDir=d;highlightButton(dpadEl,d);}
      ev.preventDefault();
    });
    dpadEl.addEventListener('mousemove',function(ev){
      if(!mDown) return;
      var d=hitTest(dpadEl,ev.clientX,ev.clientY);
      if(d!==activeDir){
        if(activeDir>=0) setPlayerDir(plIdx,activeDir,false);
        if(d>=0) setPlayerDir(plIdx,d,true);
        activeDir=d;highlightButton(dpadEl,d);
      }
    });
    window.addEventListener('mouseup',function(){
      if(mDown){
        mDown=false;
        if(activeDir>=0) setPlayerDir(plIdx,activeDir,false);
        activeDir=-1;
        highlightButton(dpadEl,-1);
      }
    });
  }
  bindSwipeDpad(document.getElementById('dpad1'),0);
  bindSwipeDpad(document.getElementById('dpad2'),1);
  function bindButton(el,fn){
    if(!el) return;
    function on(ev){
      try{ev.preventDefault();}catch(e){}
      fn();
      el.classList.add('act');
    }
    function off(ev){
      try{ev.preventDefault();}catch(e){}
      el.classList.remove('act');
    }
    el.addEventListener('touchstart',on,{passive:false});
    el.addEventListener('touchend',off,{passive:false});
    el.addEventListener('touchcancel',off,{passive:false});
    el.addEventListener('click',function(ev){
      try{ev.preventDefault();}catch(e){}
      fn();
    });
    el.addEventListener('mousedown',function(ev){
      try{ev.preventDefault();}catch(e){}
      el.classList.add('act');
    });
    el.addEventListener('mouseup',function(ev){
      try{ev.preventDefault();}catch(e){}
      el.classList.remove('act');
    });
    el.addEventListener('mouseleave',function(ev){el.classList.remove('act');});
  }
  bindButton(document.getElementById('b1'),function(){triggerBomb(0);});
  bindButton(document.getElementById('b1remote'),function(){triggerRemote(0);});
  bindButton(document.getElementById('b2'),function(){triggerBomb(1);});
  bindButton(document.getElementById('b2remote'),function(){triggerRemote(1);});
})();
['touchstart','mousedown','keydown'].forEach(function(e){
  window.addEventListener(e,function(){Audio_.resume();},{passive:true});
});

/* ============== MAIN LOOP ============== */
var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=(now-last)/1000;
  last=now;
  if(dt>0.05)dt=0.05;
  if(dt<0)dt=0;
  update(dt);
  tickerTick(dt);
  updateArrows(dt);
  render();
}

updateCanvasLayout();
applyCanvasSize();
computeTileSize();
showMenu();
updateHud();
updatePauseBtn();
requestAnimationFrame(function(){
  updateCanvasLayout();
  applyCanvasSize();
  computeTileSize();
});
requestAnimationFrame(frame);

})();
