<style>

.panel h1{font-size:clamp(26px,6vw,44px);color:var(--amber);padding:14px 18px 0;text-shadow:0 2px 0 #5c3c00,0 4px 0 #241700,0 0 22px rgba(255,176,0,.45)}
.panel .sub{padding:2px 18px 10px;color:var(--steel);font-size:13px;letter-spacing:.08em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 18px}

.seg button:hover,.btn:hover{background:#33401f;border-color:#7d8c4d}
.seg button:active,.btn:active{transform:translateY(2px)}
.seg button.on{background:var(--olive-d);color:var(--amber2);border-color:var(--amber);box-shadow:0 0 10px rgba(255,176,0,.35),inset 0 0 6px rgba(255,176,0,.2)}
.seg button.on.grn{border-color:#7dffb0;color:#b8ffc8;box-shadow:0 0 10px rgba(80,255,140,.3)}
.seg button.on.redseg{border-color:#ff8070;color:#ffb0a0;box-shadow:0 0 10px rgba(255,80,64,.3)}
.btn.big{display:block;width:calc(100% - 36px);margin:14px 18px 6px;padding:14px;font-size:19px;background:#3a2f08;color:var(--amber2);border-color:var(--amber);box-shadow:0 0 18px rgba(255,176,0,.25);animation:pulse 1.6s infinite}

input[type=text]:focus,input[type=number]:focus{border-color:var(--amber)}
input[type=number]{width:80px;text-align:center;text-transform:none;}
.help{padding:4px 18px 0;color:#7f8a68;font-size:12px;line-height:1.7}
.help b{color:#c8d2a8}
.stat{color:var(--amber2);font-family:"Courier New",monospace;font-weight:700;letter-spacing:.1em}
.hr{height:2px;background:#2c3519;margin:8px 18px}
.center{text-align:center}
.tally{margin:6px auto;font-family:"Courier New",monospace;font-size:15px;letter-spacing:.1em;color:#dfe6cf;border-collapse:collapse}
.tally td{padding:3px 14px}.tally td:last-child{text-align:right;color:var(--amber2)}
.badge{display:inline-block;margin-top:8px;padding:4px 12px;border:2px solid var(--red);color:var(--red);font-weight:700;letter-spacing:.2em;font-family:"Courier New",monospace;animation:blink .8s steps(2) infinite}

#hudbtns button{width:38px;height:38px;font-size:16px;background:rgba(20,26,14,.8);color:#cfd8b8;border:2px solid #4a5530;cursor:pointer;font-family:"Courier New",monospace;font-weight:700}
#hudbtns button:active{background:#33401f}
#touch{position:fixed;inset:0;z-index:7;pointer-events:none;display:none}

.tbtn{position:absolute;pointer-events:auto;border:2px solid rgba(160,180,120,.5);background:rgba(24,30,16,.55);color:rgba(220,230,200,.85);display:flex;align-items:center;justify-content:center;font-size:24px;font-family:"Courier New",monospace;font-weight:700;user-select:none;-webkit-user-select:none;border-radius:10px}

</style>
</head>

var shx,shy,vx0,vy0,vx1,vy1,wf,w,x,y,s,f,e,pl,b,p,fr,set;
if(vw<=0||vh<=0)return;
ctx.save();
ctx.beginPath();ctx.rect(vx,vy,vw,vh);ctx.clip();
ctx.translate(vx,vy);
shx=G.shake?(seedGen()-0.5)*G.shake*2:0;
shy=G.shake?(seedGen()-0.5)*G.shake*2:0;
ctx.translate(Math.round(-cam.x+shx),Math.round(-cam.y+shy));
ctx.drawImage(G.tCan,0,0);
vx0=Math.max(0,(cam.x/T|0)-1);vy0=Math.max(0,(cam.y/T|0)-1);
vx1=Math.min(G.W-1,((cam.x+vw)/T|0)+1);vy1=Math.min(G.H-1,((cam.y+vh)/T|0)+1);
wf=(G.t*2.2)|0;
for(w of G.water){x=w[0];y=w[1];if(x<vx0||x>vx1||y<vy0||y>vy1)continue;ctx.drawImage(SPR.water[(wf+x+y)&1],x*T,y*T);}
for(s of G.spawns){f=Math.min(3,(s.t/0.85*4)|0);ctx.drawImage(SPR.spawnFx[f],s.x-4,s.y-4);}
for(e of G.enemies){
if(e.type==='armor')set=SPR.tank.armor[Math.max(0,e.hp-1)];else set=SPR.tank[e.type];
if(e.drop&&((G.t*4)|0)%2)set=SPR.tank.red;
fr=((e.anim)|0)%2;
ctx.drawImage(set[fr][e.dir],e.x,e.y);
if(G.freezeT>0){ctx.globalAlpha=0.4;ctx.fillStyle='#7fd4ff';ctx.fillRect(e.x-1,e.y-1,T+2,T+2);ctx.globalAlpha=1;}
if(e.shieldT>0)ctx.drawImage(SPR.shield[((G.t*8)|0)%2],e.x-6,e.y-6);
if(e.up){ctx.fillStyle='#ffb000';for(var u=0;u<e.up;u++)ctx.fillRect(e.x+3+u*5,e.y-4,3,3);}
}
for(pl of G.pl){
if(pl.dead)continue;
fr=((pl.anim)|0)%2;
set=pl.id?SPR.tank.player2:SPR.tank.player;
ctx.drawImage(set[fr][pl.dir],pl.x,pl.y);
if(G.plFreezeT>0){ctx.globalAlpha=0.4;ctx.fillStyle='#7fd4ff';ctx.fillRect(pl.x-1,pl.y-1,T+2,T+2);ctx.globalAlpha=1;}
if(pl.shieldT>0)ctx.drawImage(SPR.shield[((G.t*8)|0)%2],pl.x-6,pl.y-6);
}
for(b of G.bullets)ctx.drawImage(SPR.bullet[b.dir],(b.x-2)|0,(b.y-4)|0);
for(b of G.booms){if(b.t<0||b.big)continue;f=clamp((b.t/0.35*5)|0,0,4);ctx.drawImage(SPR.boomS[f],b.x-13,b.y-13);}
for(p of G.parts){ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.sz,p.sz);}
ctx.drawImage(G.fCan,0,0);
for(p of G.pows){
if(p.life<4&&((p.t*6)|0)%2)continue;
var a=0.55+0.45*Math.sin(p.t*6);
ctx.globalAlpha=a;ctx.fillStyle='#8a1512';ctx.fillRect(p.x-11,p.y-11,22,22);
ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(p.x-10.5,p.y-10.5,21,21);
ctx.drawImage(SPR.pow[p.type],p.x-10,p.y-10);
}
for(b of G.booms){if(b.t<0||!b.big)continue;f=clamp((b.t/0.55*6)|0,0,5);ctx.drawImage(SPR.boomB[f],b.x-26,b.y-26);}
ctx.font='700 11px "Courier New",monospace';ctx.textAlign='center';
for(p of G.pops){ctx.globalAlpha=1-p.t/1.1;ctx.fillStyle='#000';ctx.fillText(p.txt,p.x+1,p.y+1);ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y);}
ctx.globalAlpha=1;
ctx.restore();
}
function edgePoint(ax,ay,tx2,ty2,r){var dx=tx2-ax,dy=ty2-ay,best=1,cand=[],t,px,py;if(dx>1e-6||dx<-1e-6){cand.push((r.x0-ax)/dx);cand.push((r.x1-ax)/dx);}if(dy>1e-6||dy<-1e-6){cand.push((r.y0-ay)/dy);cand.push((r.y1-ay)/dy);}for(t of cand){if(t<=0||t>1)continue;px=ax+dx*t;py=ay+dy*t;if(px>=r.x0-1&&px<=r.x1+1&&py>=r.y0-1&&py<=r.y1+1&&t<best)best=t;}return[ax+dx*best,ay+dy*best,Math.atan2(dy,dx)];}
function drawP2Arrow(){
var p2,sx,sy,p1,ax,ay,r,e,col;
if(G.split)return;
if(!(ST.mode>=2&&ST.aiView==='arrow'))return;
p2=G.pl[1];if(!p2||p2.dead)return;
sx=p2.x+8-G.cam.x;sy=p2.y+8-G.cam.y;
if(sx>=-8&&sx<=VW+8&&sy>=-8&&sy<=VH+8)return;
p1=G.pl[0];
if(p1&&!p1.dead){ax=p1.x+8-G.cam.x;ay=p1.y+8-G.cam.y;}else{ax=VW/2;ay=VH/2;}
r={x0:16,y0:36,x1:VW-16,y1:VH-16};
ax=clamp(ax,r.x0,r.x1);ay=clamp(ay,r.y0,r.y1);
e=edgePoint(ax,ay,sx,sy,r);
col='#7dffb0';
ctx.save();
ctx.globalAlpha=0.7+0.3*Math.sin(G.t*6);
ctx.translate(e[0],e[1]);ctx.rotate(e[2]);
ctx.fillStyle=col;
ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-7,-8);ctx.lineTo(-3,0);ctx.lineTo(-7,8);ctx.closePath();ctx.fill();
ctx.restore();
ctx.font='700 10px "Courier New",monospace';ctx.textAlign='center';
ctx.fillStyle=col;
ctx.fillText(plLabel(p2),clamp(e[0],20,VW-20),clamp(e[1]+20,46,VH-6));
}
function render(){
if(!bgPat)bgPat=ctx.createPattern(bgPatC,'repeat');
ctx.fillStyle=bgPat;ctx.fillRect(0,0,VW,VH);
if(G.state==='menu'){renderAttract();return;}
if(!G.grid)return;
if(G.split){
drawView(0,0,VW/2,VH,G.cam);
drawView(VW/2,0,VW/2,VH,G.cam2);
ctx.fillStyle='#0c0f07';ctx.fillRect(VW/2-2,0,4,VH);
ctx.fillStyle='#4a5530';ctx.fillRect(VW/2-1,0,2,VH);
}else{
drawView(0,0,VW,VH,G.cam);
drawP2Arrow();
}
renderHUD();
if(G.state==='intro')renderIntro();
}
function renderHUD(){
var res=BAL.ui.hudReserve,R=VW-res,left,i,x,y,hx,pl,col,maxShow,show,txt,eff,ex,e;
ctx.fillStyle='rgba(8,11,6,.78)';ctx.fillRect(0,0,VW,26);
ctx.fillStyle='#3a4526';ctx.fillRect(0,26,VW,1);
left=G.roster.length-G.rosterIx+G.enemies.length+G.spawns.filter(function(s){return s.spec;}).length;
for(i=0;i<Math.min(20,left);i++){x=6+(i%10)*11;y=4+((i/10)|0)*10;ctx.drawImage(SPR.tank.basic[0][2],0,0,16,16,x,y,9,9);}
ctx.font='700 12px "Courier New",monospace';ctx.textAlign='left';
hx=Math.min(6+Math.min(20,Math.max(1,left))*11+10,140);
ctx.fillStyle='#dfe6cf';ctx.fillText(STR.stage+String(G.level).padStart(2,'0'),hx,17);hx+=34;
for(pl of G.pl){
col=pl.id?'#7dffb0':'#ffd75e';
ctx.fillStyle=pl.out?'#5a4040':col;
ctx.fillText(plLabel(pl),hx,17);hx+=26;
maxShow=5;show=Math.min(pl.lives,maxShow);
for(i=0;i<show;i++){ctx.fillStyle=col;ctx.fillRect(hx+i*6,9,4,9);}
if(pl.lives>maxShow){ctx.fillStyle=col;txt='x'+pl.lives;ctx.fillText(txt,hx+show*6+2,17);hx+=show*6+ctx.measureText(txt).width+6;}
else{hx+=show*6+8;}
if(pl.lvl>1){ctx.fillStyle='#ffb000';ctx.fillText('★'+pl.lvl,hx,17);hx+=24;}
hx+=6;
}
ctx.fillStyle='#9aa87c';ctx.fillText(STR.base,hx,17);hx+=36;
for(i=0;i<2;i++){ctx.fillStyle=i<G.base.hp?'#ffd75e':'#3a2a10';ctx.fillRect(hx+i*10,8,8,10);}
ctx.textAlign='right';ctx.fillStyle='#ffd75e';ctx.fillText(STR.scoreLbl+' '+pad(G.score),R,17);
if(VW>=560){ctx.fillStyle='#6f7a58';ctx.fillText(STR.hiLbl+' '+pad(G.hiscore),R,25);}
eff=[];
if(G.pl.some(function(p){return !p.dead&&p.shieldT>0;}))eff.push(['SHD','#7fd4ff',Math.max.apply(null,G.pl.map(function(p){return p.shieldT;}))/BAL.player.shieldTime]);
if(G.freezeT>0)eff.push(['FRZ','#7fd4ff',G.freezeT/10]);
if(G.plFreezeT>0)eff.push(['FRP','#ff8070',G.plFreezeT/4]);
if(G.fortifyT>0)eff.push(['WLL','#c8ccd4',G.fortifyT/13]);
if(G.pl.some(function(p){return p.speedT>0;}))eff.push(['SPD','#ffd23f',Math.max.apply(null,G.pl.map(function(p){return p.speedT;}))/BAL.player.speedTime]);
if(G.pl.some(function(p){return p.hasRapid;}))eff.push(['RPD','#ff9040',1]);
if(G.pl.some(function(p){return p.lvl>=4;}))eff.push(['AP','#e8eef4',1]);
ex=6;ctx.font='700 9px "Courier New",monospace';
for(e of eff){ctx.fillStyle='rgba(8,11,6,.7)';ctx.fillRect(ex,30,38,14);ctx.fillStyle=e[1];ctx.textAlign='left';ctx.fillText(STR.eff[e[0]]||e[0],ex+3,40);ctx.fillRect(ex+26,33,9*clamp(e[2],0,1),8);ctx.strokeStyle=e[1];ctx.strokeRect(ex+25.5,32.5,10,9);ex+=42;}
renderMinimap();
}
function renderMinimap(){
var mw,mh,pad,RW,RH,hudH,spots,sx,sy,alpha,margin,checkList,pl,e,p,s,hit,obj,objs;
if(!G.showMap||!mmC||VW<480)return;
mw=mmC.width;mh=mmC.height;pad=3;RW=mw+pad*2;RH=mh+pad*2;hudH=28;
spots=IS_TOUCH?[[VW-RW,hudH],[0,hudH]]:[[VW-RW,hudH],[0,hudH],[VW-RW,VH-RH],[0,VH-RH]];
sx=spots[0][0];sy=spots[0][1];alpha=0.35;margin=24;
checkList=[];
for(pl of G.pl)if(!pl.dead)checkList.push([pl.x-G.cam.x,pl.y-G.cam.y,T,T]);
for(e of G.enemies)checkList.push([e.x-G.cam.x,e.y-G.cam.y,T,T]);
for(p of G.pows)checkList.push([p.x-G.cam.x-10,p.y-G.cam.y-10,20,20]);
for(s of spots){
hit=false;
for(obj of checkList){if(obj[0]+obj[2]>s[0]-margin&&obj[0]<s[0]+RW+margin&&obj[1]+obj[3]>s[1]-margin&&obj[1]<s[1]+RH+margin){hit=true;break;}}
if(!hit){sx=s[0];sy=s[1];alpha=1;break;}
}
ctx.globalAlpha=alpha;
ctx.fillStyle='rgba(8,11,6,.8)';ctx.fillRect(sx,sy,RW,RH);
ctx.drawImage(mmC,sx+pad,sy+pad);
for(pl of G.pl){if(pl.dead)continue;ctx.fillStyle=pl.id?'#7dffb0':'#ffd75e';ctx.fillRect(sx+pad+((pl.x/T)|0)*2,sy+pad+((pl.y/T)|0)*2,2,2);}
ctx.fillStyle='#ff5040';
for(e of G.enemies)ctx.fillRect(sx+pad+((e.x/T)|0)*2,sy+pad+((e.y/T)|0)*2,2,2);
if(((G.t*3)|0)%2){ctx.fillStyle='#7dffb0';for(p of G.pows)ctx.fillRect(sx+pad+((p.x/T)|0)*2,sy+pad+((p.y/T)|0)*2,2,2);}
ctx.globalAlpha=1;
}
function renderIntro(){
var p=1-G.introT/1.9,y,op;
ctx.fillStyle='rgba(5,8,4,'+(0.55*(p<0.85?1:(1-p)/0.15))+')';ctx.fillRect(0,0,VW,VH);
ctx.textAlign='center';
y=VH/2-14+Math.sin(p*Math.PI)*-6;
ctx.font='700 30px "Courier New",monospace';
ctx.fillStyle='#1a1408';ctx.fillText(tx('stage')+G.level,VW/2+3,y+3);
ctx.fillStyle='#ffb000';ctx.fillText(tx('stage')+G.level,VW/2,y);
ctx.font='700 15px "Courier New",monospace';
ctx.fillStyle='#7fd4ff';
op=opName(G.seed,G.level);
if(ST.mode){op+=' · '+STR.modes[ST.mode];if(ST.mode>=2)op+=' · '+STR.skills[ST.skill];}
ctx.fillText(op,VW/2,y+28);
ctx.fillStyle='#9aa87c';ctx.font='700 11px "Courier New",monospace';
ctx.fillText(tx('introStats',G.seed,G.W+'×'+G.H,G.totalEnemies,STR.rates[ST.rate],STR.foes[ST.foeSup]),VW/2,y+48);
}
var stars=[],attractT=0,parade=[];
for(var si=0;si<70;si++)stars.push([seedGen(),seedGen(),0.2+seedGen()*0.8]);
function renderAttract(){
var s,p,i,set,types;
attractT+=1/60;
ctx.fillStyle='#05070a';ctx.fillRect(0,0,VW,VH);
for(s of stars){s[1]+=0.0006*s[2];if(s[1]>1)s[1]=0;ctx.fillStyle='rgba(200,220,255,'+(0.3+s[2]*0.5)+')';ctx.fillRect(s[0]*VW,s[1]*VH,s[2]>0.7?2:1,s[2]>0.7?2:1);}
ctx.fillStyle='#0c100a';ctx.fillRect(0,VH-70,VW,70);
if(parade.length<7&&seedGen()<0.02){types=['player','player2','basic','fast','power','armor'];parade.push({x:-40,y:VH-58-(seedGen()*14|0),d:seedGen()<0.5?1:3,t:types[(seedGen()*types.length)|0],a:seedGen()*9});}
for(i=parade.length-1;i>=0;i--){
p=parade[i];p.x+=DIRS[p.d][0]*30/60;p.a+=0.25;
set=p.t==='armor'?SPR.tank.armor[2]:SPR.tank[p.t];
ctx.save();ctx.translate(p.x,p.y);ctx.scale(2,2);ctx.drawImage(set[((p.a)|0)%2][p.d],0,0);ctx.restore();
if((p.d===1&&p.x>VW+50)||(p.d===3&&p.x<-50))parade.splice(i,1);
}
ctx.fillStyle='rgba(5,7,4,.35)';ctx.fillRect(0,0,VW,VH);
}
var last=performance.now(),acc=0,STEP=1/60;
function frame(now){
var dt=(now-last)/1000;
last=now;
requestAnimationFrame(frame);
if(dt>0.1)dt=0.1;
pollGamepad();
if(G.state==='play'||G.state==='intro'||G.state==='clear'){
acc+=dt;if(acc>0.2)acc=0.2;
while(acc>=STEP){update(STEP);acc-=STEP;}
}
render();
}
function seg(el,cb){el.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){audioInit();SFX.ui();el.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');cb(b.dataset.v);});});}
function refreshHelp(){var h=$('helpTxt');if(ST.mode===0)h.innerHTML=STR.helpSolo;else if(ST.mode===1)h.innerHTML=STR.helpCoop;else if(ST.mode===2)h.innerHTML=STR.helpCpu;else h.innerHTML=STR.helpBoth;}
function updateRows(){$('rowSkill').classList.toggle('hid',ST.mode<2);$('rowView').classList.toggle('hid',ST.mode<2);}
seg($('segMode'),function(v){ST.mode=+v;LS.set('mode',v);updateRows();refreshHelp();});
seg($('segSkill'),function(v){ST.skill=+v;LS.set('skill',v);refreshHelp();});
seg($('segView'),function(v){ST.aiView=v;LS.set('aiview',v);});
seg($('segDiff'),function(v){ST.diff=+v;LS.set('diff',ST.diff);});
seg($('segRate'),function(v){ST.rate=+v;LS.set('rate',v);});
seg($('segFoe'),function(v){ST.foeSup=+v;LS.set('foe',v);});
seg($('segSize'),function(v){ST.size=v;LS.set('size',v);$('opPreview').textContent=opName(ST.seed,1);});
$('segMode').querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.v===ST.mode);});
$('segSkill').querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.v===ST.skill);});
$('segView').querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===ST.aiView);});
$('segDiff').querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.v===ST.diff);});
$('segRate').querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.v===ST.rate);});
$('segFoe').querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.v===ST.foeSup);});
$('segSize').querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===ST.size);});
updateRows();
var seedIn=$('seedIn');seedIn.value=ST.seed;
seedIn.addEventListener('input',function(){ST.seed=seedIn.value.trim().toUpperCase()||'A1';LS.set('seed',ST.seed);$('opPreview').textContent=opName(ST.seed,1);});
seedIn.addEventListener('keydown',function(e){if(e.key==='Enter'){audioInit();startCampaign(false);}});

lvlIn.addEventListener('input',function(){var v=parseInt(lvlIn.value)||1;if(v<1)v=1;if(v>99)v=99;LS.set('startLvl',v);lvlIn.value=v;});

$('btnDeploy').addEventListener('click',function(){audioInit();startCampaign(false);});

$('btnMap').addEventListener('click',function(){G.showMap=!G.showMap;});
function sndLabel(){$('btnSnd').textContent=ST.snd?'♪':'✕';$('sndBtn2').textContent=ST.snd?STR.sndOn:STR.sndOff;}

$('sndBtn2').addEventListener('click',function(){ST.snd=!ST.snd;LS.set('snd',ST.snd?'1':'0');sndLabel();if(ST.snd)SFX.ui();});
function fxLabel(){$('fxBtn').textContent=ST.fx==='lite'?STR.fxOff:STR.fxOn;document.body.classList.toggle('lite',ST.fx==='lite');}
$('fxBtn').addEventListener('click',function(){ST.fx=ST.fx==='lite'?'hi':'lite';LS.set('fx',ST.fx);fxLabel();SFX.ui();});

$('btnNext').addEventListener('click',function(){G.clearWait=0;});
$('btnRetry').addEventListener('click',function(){hideAll();startCampaign(false);});
$('btnNewSeed').addEventListener('click',function(){hideAll();startCampaign(true);});
$('btnMenu2').addEventListener('click',toMenu);
buildSprites();sndLabel();fxLabel();refreshHelp();
$('hiTxt').textContent=tx('hiScore',pad(G.hiscore));
$('opPreview').textContent=opName(ST.seed,1);
toMenu();
requestAnimationFrame(frame);
})();
