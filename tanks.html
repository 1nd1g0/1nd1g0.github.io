<style>
:root{--amber:#ffb000;--amber2:#ffd75e;--olive:#6a7d3f;--olive-d:#2c3519;--steel:#9fb4c7;--red:#ff5040;--cyan:#7fd4ff;--ink:#0a0d08;--panel:#161c11}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);touch-action:none;overscroll-behavior:none}
body{font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:#dfe6cf;background-image:repeating-linear-gradient(135deg,#0b0f09 0 26px,#0d120b 26px 52px)}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.42) 100%)}
body.lite #fx{background:none}
.hid{display:none!important}
.h-stencil{font-family:"Courier New",ui-monospace,monospace;font-weight:700;text-transform:uppercase;letter-spacing:.16em}
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:safe center;justify-content:safe center;
padding:calc(12px + var(--tlst,0px)) 12px calc(12px + var(--tlsb,0px));background:rgba(5,9,4,.55);overflow-y:auto;box-sizing:border-box}
.panel{width:min(620px,96vw);max-height:96vh;overflow:auto;background:var(--panel);border:3px solid #4a5530;box-shadow:0 0 0 2px #0c0f07,0 18px 60px rgba(0,0,0,.7),inset 0 0 0 1px #232b16;padding:0 0 18px}
.hazard{height:10px;background:repeating-linear-gradient(45deg,#c8a020 0 9px,#141810 9px 18px);opacity:.85}
.panel h1{font-size:clamp(26px,6vw,44px);color:var(--amber);padding:14px 18px 0;text-shadow:0 2px 0 #5c3c00,0 4px 0 #241700,0 0 22px rgba(255,176,0,.45)}
.panel .sub{padding:2px 18px 10px;color:var(--steel);font-size:13px;letter-spacing:.08em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 18px}
.row label.tag{width:112px;color:#9aa87c;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-family:"Courier New",monospace;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{font-family:"Courier New",monospace;font-weight:700;letter-spacing:.08em;background:#232b18;color:#cfd8b8;border:2px solid #4a5530;padding:8px 12px;font-size:13px;cursor:pointer;transition:transform .06s,background .12s,border-color .12s;text-transform:uppercase}
a.btn{text-decoration:none;display:inline-block;text-align:center}
.seg button:hover,.btn:hover{background:#33401f;border-color:#7d8c4d}
.seg button:active,.btn:active{transform:translateY(2px)}
.seg button.on{background:var(--olive-d);color:var(--amber2);border-color:var(--amber);box-shadow:0 0 10px rgba(255,176,0,.35),inset 0 0 6px rgba(255,176,0,.2)}
.seg button.on.grn{border-color:#7dffb0;color:#b8ffc8;box-shadow:0 0 10px rgba(80,255,140,.3)}
.seg button.on.redseg{border-color:#ff8070;color:#ffb0a0;box-shadow:0 0 10px rgba(255,80,64,.3)}
.btn.big{display:block;width:calc(100% - 36px);margin:14px 18px 6px;padding:14px;font-size:19px;background:#3a2f08;color:var(--amber2);border-color:var(--amber);box-shadow:0 0 18px rgba(255,176,0,.25);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(255,176,0,.5)}}
input[type=text],input[type=number]{background:#0d1109;border:2px solid #4a5530;color:var(--amber2);font-family:"Courier New",monospace;font-size:15px;letter-spacing:.12em;padding:8px 10px;width:150px;text-transform:uppercase;outline:none}
input[type=text]:focus,input[type=number]:focus{border-color:var(--amber)}
input[type=number]{width:80px;text-align:center;text-transform:none;}
.help{padding:4px 18px 0;color:#7f8a68;font-size:12px;line-height:1.7}
.help b{color:#c8d2a8}
.stat{color:var(--amber2);font-family:"Courier New",monospace;font-weight:700;letter-spacing:.1em}
.hr{height:2px;background:#2c3519;margin:8px 18px}
.center{text-align:center}
.tally{margin:6px auto;font-family:"Courier New",monospace;font-size:15px;letter-spacing:.1em;color:#dfe6cf;border-collapse:collapse}
.tally td{padding:3px 14px}.tally td:last-child{text-align:right;color:var(--amber2)}
.badge{display:inline-block;margin-top:8px;padding:4px 12px;border:2px solid var(--red);color:var(--red);font-weight:700;letter-spacing:.2em;font-family:"Courier New",monospace;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#hudbtns{position:fixed;top:calc(8px + var(--tlst,0px));right:8px;z-index:12;display:flex;gap:6px}
#hudbtns button{width:38px;height:38px;font-size:16px;background:rgba(20,26,14,.8);color:#cfd8b8;border:2px solid #4a5530;cursor:pointer;font-family:"Courier New",monospace;font-weight:700}
#hudbtns button:active{background:#33401f}
#touch{position:fixed;inset:0;z-index:7;pointer-events:none;display:none}
body.touch #touch{display:block}
.tbtn{position:absolute;pointer-events:auto;border:2px solid rgba(160,180,120,.5);background:rgba(24,30,16,.55);color:rgba(220,230,200,.85);display:flex;align-items:center;justify-content:center;font-size:24px;font-family:"Courier New",monospace;font-weight:700;user-select:none;-webkit-user-select:none;border-radius:10px}
.tbtn:active,.tbtn.on{background:rgba(106,125,63,.65);border-color:var(--amber)}
#dU{left:64px;bottom:128px;width:60px;height:60px}#dD{left:64px;bottom:8px;width:60px;height:60px}
#dL{left:8px;bottom:68px;width:60px;height:60px}#dR{left:120px;bottom:68px;width:60px;height:60px}
#bF{right:18px;bottom:34px;width:92px;height:92px;border-radius:50%;font-size:15px;border-color:rgba(255,176,0,.6);color:var(--amber2)}
@media(max-height:430px){#dU{bottom:110px}#dD{bottom:0}#dL,#dR{bottom:52px}#bF{bottom:16px}}

// self-update v3: one-time title-screen freshness check, two HEAD requests,
// a page body is NEVER downloaded. The baseline is NOT the HTTP cache: Firefox
// serves a HEAD cached before a deploy forever within max-age, and a reload
// never evicts it => endless reload loop after an update. Instead the baseline
// is the last validator THIS browser session saw, kept in sessionStorage; the
// cached HEAD only stands in for it on the first visit of a session. The
// no-store HEAD is always the source of truth; on mismatch a newer deploy
// exists => reload exactly once per session per version (the new validator is
// stored BEFORE reloading, so the reloaded page compares equal and never
// loops). Offline/file:// hosts: no request at all, never an error. Hosts
// without validators: silent. Never re-runs in-page.
// Versioning: meta[name=version] = <last-edited-date>.<build>; bump the
// build number whenever the file is edited. window.GAME_VERSION exposes it.
(function () {

if (navigator.onLine === false) return;

function last() { try { return sessionStorage.getItem("$ver:" + location.href) || ""; } catch (e) { return ""; } }
var base = last();
fetch(location.href, { method: "HEAD" }).then(function (r) {
var cached = val(r);
if (!base && !cached) return; // nothing to compare against
return fetch(location.href, { method: "HEAD", cache: "no-store" }).then(function (r2) {
var cur = val(r2);
if (!cur) return;
var old = base || cached;
if (cur !== old) { seen(cur); location.reload(); }
else seen(cur);
});
}).catch(function () {});
})();
</script>

      a change of `<html lang>` repaints it. Where the Fullscreen API is missing the
      button hides itself instead of lying.
